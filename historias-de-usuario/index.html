a dueña registra una entrada de 24 unidades de \"Arroz 1 kg\"", "And la dueña registra una merma de 3 unidades de \"Arroz 1 kg\" con el motivo \"Paquetes rotos al acomodar\"", "And la dueña registra un conteo físico de 38 unidades de \"Arroz 1 kg\" con el motivo \"Conteo de fin de mes\"", "Then la bitácora contiene tres registros de \"Arroz 1 kg\" con los tipos entrada, merma y conteo físico"]}, {"titulo": "Los registros encadenan las existencias antes y después", "pasos": ["When la dueña registra una entrada de 24 unidades de \"Arroz 1 kg\"", "And la dueña registra una merma de 3 unidades de \"Arroz 1 kg\" con el motivo \"Paquetes rotos al acomodar\"", "Then el primer registro tiene existencias antes 40 y después 64", "And el segundo registro tiene existencias antes 64 y después 61"]}, {"titulo": "El registro de un movimiento no se puede modificar", "pasos": ["Given que existe un registro de entrada de \"Arroz 1 kg\" en la bitácora", "When cualquier usuario intenta modificar ese registro mediante la aplicación", "Then el sistema no ofrece esa operación", "And el registro permanece sin cambios"]}, {"titulo": "El registro de un movimiento no se puede borrar", "pasos": ["Given que existe un registro de merma de \"Arroz 1 kg\" en la bitácora", "When cualquier usuario intenta borrar ese registro mediante la aplicación", "Then el sistema no ofrece esa operación", "And el registro permanece sin cambios"]}, {"titulo": "Las existencias y la bitácora cambian juntas o no cambian", "pasos": ["Given que falla el guardado del registro en la bitácora", "When la dueña registra una entrada de 24 unidades de \"Arroz 1 kg\"", "Then el sistema informa que no se pudo registrar el movimiento", "And las existencias de \"Arroz 1 kg\" siguen en 40"]}]}, "tareas": [{"id": "T6.1", "desc": "Usar el servicio de bitácora ya construido (o crearlo si aún no existe) y verificar que registra los tres tipos con su cantidad y sus existencias antes y después", "tipo": "Diseño y código", "horas": 3}, {"id": "T6.2", "desc": "Prueba de que la bitácora no se puede editar ni borrar desde la aplicación", "tipo": "Pruebas", "horas": 3}, {"id": "T6.3", "desc": "Atomicidad: si falla el guardado en la bitácora, las existencias no cambian, con prueba de integración", "tipo": "Código y pruebas", "horas": 4}], "horas": 10, "listo": [{"t": "Está redactada como «Como… quiero… para…» y el equipo la entiende.", "p": null}, {"t": "Cumple INVEST: se revisaron las seis letras.", "p": null}, {"t": "Tiene de 5 a 7 criterios de aceptación en Gherkin, acordados con la dueña.", "p": null}, {"t": "Sus dependencias están terminadas o simuladas (ver las dependencias del caso de uso).", "p": null}, {"t": "Sus tareas están estimadas, de 6 horas o menos cada una.", "p": null}, {"t": "Los supuestos que usa están confirmados.", "p": null}, {"t": "La meta medible está escrita con cifra", "p": "P7"}], "terminado": [{"t": "Compila y pasa las pruebas automáticas.", "p": null}, {"t": "Cada escenario Gherkin de sus criterios de aceptación se verifica y pasa.", "p": null}, {"t": "Otra persona la revisó en un Pull Request.", "p": null}, {"t": "Se puede ejecutar siguiendo el README.", "p": null}, {"t": "El issue se cierra con el enlace al Pull Request.", "p": null}, {"t": "La meta se mide con una prueba, no se da por supuesta", "p": "P7"}], "invest": null}], "flujos": "4 flujos alternativos"}}, "glosario": [{"id": "historia", "titulo": "Historia de usuario", "intro": "<p>Una historia de usuario es una unidad pequeña de trabajo que entrega algo de valor a una persona usuaria y que un solo equipo puede terminar en pocos días. Se escribe en el lenguaje del negocio, no en el de la tecnología.<\/p>", "subs": [{"titulo": "Plantilla «Como… quiero… para…»", "letra": null, "html": "<ul>\n<li><strong>Como<\/strong> {rol}: quién lo necesita.<\/li>\n<li><strong>quiero<\/strong> {función}: qué necesita poder hacer.<\/li>\n<li><strong>para<\/strong> {beneficio}: por qué le importa.<\/li>\n<\/ul>\n<p>Ejemplo: <em>Como cajera, quiero registrar los productos de un cliente y cobrarlos en efectivo, para que el cliente se lleve su compra con el vuelto correcto.<\/em> La plantilla es una ayuda, no una obligación. Usarla sin pensar («template zombies») no mejora la historia.<\/p>"}, {"titulo": "Las 3 C", "letra": null, "html": "<ul>\n<li><strong>Card (tarjeta):<\/strong> la descripción breve; sirve para planificar y recordar que hay que conversar.<\/li>\n<li><strong>Conversation (conversación):<\/strong> el equipo y la dueña aclaran los detalles hablando, no escribiendo documentos largos.<\/li>\n<li><strong>Confirmation (confirmación):<\/strong> los criterios de aceptación dicen cuándo la historia está completa; en el ejercicio son escenarios Gherkin.<\/li>\n<\/ul>"}, {"titulo": "Historia y caso de uso", "letra": null, "html": "<p>Un caso de uso describe un objetivo completo con su flujo principal y sus flujos alternativos. Una historia tiene menos alcance: se le pone un límite de tamaño para poder planificarla. Por eso un caso de uso suele dar varias historias: el flujo básico primero y una historia por cada flujo alterno importante. En el ejercicio, CU-01 «Registrar una venta» se partió en nueve historias (H1 cobra en efectivo; H4, SINPE Móvil; H5, tarjeta; y así). El mapa muestra el patrón con que se partió cada una.<\/p>"}, {"titulo": "Fuentes", "letra": null, "html": "<ul>\n<li>Cohn (2004), cap. 1 «What Is a User Story?», p. 4; cap. 12 «User Stories Are Not Use Cases», p. 137–141.<\/li>\n<li>Podeswa (2021), 13.5 «The Three Cs of Stories», p. 397–398; 10.3.1.3 «Implementing a Use Case», p. 255–256.<\/li>\n<li>Rubin (2012), cap. 5 «What Are User Stories?», p. 82–86.<\/li>\n<li>Patton (2014), cap. 6–7, sobre la conversación y el uso mecánico de la plantilla.<\/li>\n<\/ul>"}]}, {"id": "invest", "titulo": "INVEST", "intro": "<p>INVEST es una lista de seis preguntas para revisar si una historia está bien formada. El acrónimo es de Bill Wake (2003). Una historia que incumple una letra se corrige o se vuelve a partir.<\/p>", "subs": [{"titulo": "I · Independiente", "letra": "I", "html": "<p>¿Se puede construir y entregar sin esperar a otra historia? Las dependencias complican la prioridad y la estimación. Ejemplo: «cobrar con SINPE Móvil» no puede ir antes que «cobrar en efectivo», porque necesita el flujo de cobro. La dependencia que no se elimina se declara.<\/p>"}, {"titulo": "N · Negociable", "letra": "N", "html": "<p>¿Dice qué se necesita sin cerrar cómo se resuelve? Una historia no es un contrato. Ejemplo que la rompe: «un botón verde que llame a POST /api/sales». La solución técnica va en las tareas.<\/p>"}, {"titulo": "V · Valiosa", "letra": "V", "html": "<p>¿Entrega algo que la persona usuaria no podía hacer antes? Ejemplo que la rompe: «crear la tabla Sale»; nadie la puede usar. Pasa a ser una tarea dentro de una historia que sí da valor.<\/p>"}, {"titulo": "E · Estimable", "letra": "E", "html": "<p>¿El equipo entiende lo suficiente para estimarla con confianza? Si no, falta conocimiento: se hace primero un spike. Ejemplo: «cobrar con tarjeta» sin saber cómo responde el datáfono.<\/p>"}, {"titulo": "S · Pequeña", "letra": "S", "html": "<p>¿Cabe en una iteración y la hace un solo equipo? Si es grande se parte con un patrón de partición (P1 a P13) y las reglas de desempate. Meta del ejercicio: de 5 a 7 criterios de aceptación y tareas de 6 horas o menos.<\/p>"}, {"titulo": "T · Verificable", "letra": "T", "html": "<p>¿Se puede decidir sin ambigüedad si quedó terminada? Ejemplo que la rompe: «el sistema cobra bien y rápido». Se reescribe con una cifra o un ejemplo: «con ₡2 000 recibidos por una venta de ₡1 200, el vuelto es ₡800».<\/p>"}, {"titulo": "Para ir más allá", "letra": null, "html": "<p>INVEST IN CRUD (Podeswa) agrega seis criterios: Individual, Nonsolutionized, Consistent, Reinforced, Unambiguous y Discussed.<\/p>"}, {"titulo": "Fuentes", "letra": null, "html": "<ul>\n<li>Cohn (2004), cap. 2 «Writing Stories», p. 17–28: una sección por letra, con ejemplos de incumplimiento y corrección.<\/li>\n<li>Rubin (2012), cap. 5 «INVEST in Good Stories», p. 88–92.<\/li>\n<li>Podeswa (2021), 13.12.1 (INVEST con ajustes del autor) y 13.12.2 (INVEST IN CRUD).<\/li>\n<\/ul>"}]}, {"id": "listo", "titulo": "Definición de Listo", "intro": "<p>La Definición de Listo (<em>Definition of Ready<\/em>, DoR) es una lista de verificación que dice cuándo una historia se entiende lo bastante como para empezar a construirla sin demoras ni retrabajo. La acuerdan el equipo y quien representa al negocio; en el ejercicio, el equipo y la dueña.<\/p>", "subs": [{"titulo": "Qué suele incluir", "letra": null, "html": "<ul>\n<li>Está redactada y el equipo la entiende.<\/li>\n<li>Cumple INVEST.<\/li>\n<li>Tiene criterios de aceptación acordados.<\/li>\n<li>Sus dependencias están terminadas o simuladas.<\/li>\n<li>Está estimada y es lo bastante pequeña.<\/li>\n<li>No impone una solución técnica.<\/li>\n<\/ul>\n<p>La lista del ejercicio está en <code>doc/definiciones-listo-y-terminado.md<\/code>; el patrón de partición agrega exigencias (por ejemplo, P10 pide que el sistema externo o su simulador esté disponible).<\/p>"}, {"titulo": "Cuidado con la compuerta rígida", "letra": null, "html": "<p>La DoR es una ayuda, no un trámite. Si se usa para rechazar historias en la planificación, suele esconder problemas de fondo, como una dueña poco disponible o falta de confianza. Las fuentes recomiendan permitir excepciones y atacar la causa, y señalan que no todo el backlog debe estar listo, solo lo que se acerca al tope.<\/p>"}, {"titulo": "Fuentes", "letra": null, "html": "<ul>\n<li>Podeswa (2021), 6.5.7.5 «Tuning the Story Definition of Ready», p. 138–142: lista larga de condiciones que incorpora INVEST.<\/li>\n<li>Rubin (2012), cap. 6 «Definition of Ready», p. 108–110.<\/li>\n<li>Sutherland y Coplien (2019), patrón ¶65 «Definition of Ready».<\/li>\n<li>Wolpers (2024), cap. 15, antipatrón 3, p. 279: crítica a la DoR como compuerta; cap. 6, antipatrón 13, p. 135.<\/li>\n<li>Hundhausen (2021), cap. 5, p. 174: advierte contra usarla como arma contra quien prioriza.<\/li>\n<\/ul>"}]}, {"id": "terminado", "titulo": "Definición de Terminado", "intro": "<p>La Definición de Terminado (<em>Definition of Done<\/em>, DoD) es la lista de condiciones que toda historia debe cumplir para considerarse terminada. Es un acuerdo del equipo, vale para todas las historias y crece a medida que el equipo madura.<\/p>", "subs": [{"titulo": "Qué suele incluir", "letra": null, "html": "<ul>\n<li>Compila y pasa las pruebas automáticas.<\/li>\n<li>Cada escenario de aceptación pasa.<\/li>\n<li>Otra persona la revisó en un Pull Request.<\/li>\n<li>Se puede ejecutar siguiendo el README.<\/li>\n<li>El issue se cierra con el enlace al Pull Request.<\/li>\n<\/ul>\n<p>Terminada no significa liberada: entregar a la dueña es una decisión del negocio.<\/p>"}, {"titulo": "Terminado frente a criterios de aceptación y Listo", "letra": null, "html": "<ul>\n<li>Los <strong>criterios de aceptación<\/strong> son propios de cada historia. La DoD es común a todas.<\/li>\n<li>Una historia está terminada solo si cumple <strong>los dos<\/strong>: sus criterios de aceptación y la DoD. Los criterios se suman a la DoD; no la reemplazan.<\/li>\n<li>La <strong>DoR<\/strong> aplica a lo que entra al trabajo; la <strong>DoD<\/strong>, a lo que sale terminado.<\/li>\n<\/ul>"}, {"titulo": "Fuentes", "letra": null, "html": "<ul>\n<li>Rubin (2012), cap. 4 «Definition of Done», p. 73–78, en especial «Definition of Done versus Acceptance Criteria», p. 77.<\/li>\n<li>Podeswa (2021), 6.5.7.4 «Tuning the Definition of Done», p. 137–138; 13.5.3 «Confirmation», p. 398.<\/li>\n<li>Sutherland y Coplien (2019), patrón ¶82 «Definition of Done».<\/li>\n<li>Wolpers (2024), cap. 15, p. 276: la DoD como documento vivo.<\/li>\n<li>Shore y Warden (2021), cap. 9 «Done Done». Edición en español: <em>El Arte del Desarrollo Ágil<\/em> (2024).<\/li>\n<\/ul>"}]}, {"id": "referencias", "titulo": "Referencias", "intro": "<ul>\n<li>Cohn, M. (2004). <em>User Stories Applied: For Agile Software Development<\/em>. Addison-Wesley Professional.<\/li>\n<li>Podeswa, H. (2021). <em>The Agile Guide to Business Analysis and Planning<\/em>. Addison-Wesley Professional.<\/li>\n<li>Rubin, K. S. (2012). <em>Essential Scrum<\/em>. Addison-Wesley Professional.<\/li>\n<li>Wolpers, S. (2024). <em>The Scrum Anti-Patterns Guide<\/em>. Addison-Wesley Professional.<\/li>\n<li>Patton, J. (2014). <em>User Story Mapping<\/em>. O'Reilly Media.<\/li>\n<li>Shore, J. y Warden, S. (2021). <em>The Art of Agile Development<\/em> (2.ª ed.). O'Reilly Media.<\/li>\n<li>Sutherland, J. y Coplien, J. O. (2019). <em>A Scrum Book<\/em>. Pragmatic Bookshelf.<\/li>\n<li>Hundhausen, R. (2021). <em>Professional Scrum Development with Azure DevOps<\/em>. Microsoft Press.<\/li>\n<li>Wake, B. (2003). <em>INVEST in Good Stories, and SMART Tasks<\/em>. Citado a través de Cohn y Rubin.<\/li>\n<\/ul>", "subs": []}]};

const h = (tag, attrs, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === false || v == null) continue;
    if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  kids.flat().forEach(c => { if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(c)); });
  return e;
};
const escHtml = s => s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const svgEl = (name, attrs, parent) => { const e = document.createElementNS(NS, name); Object.entries(attrs || {}).forEach(([a, v]) => e.setAttribute(a, v)); if (parent) parent.appendChild(e); return e; };

const bez = (x1, y1, x2, y2) => 'M' + x1 + ' ' + y1 + ' C' + x1 + ' ' + (y1 + y2) / 2 + ' ' + x2 + ' ' + (y1 + y2) / 2 + ' ' + x2 + ' ' + y2;

function addEdge(sc, a, b, label, d, mid, opts = {}) {
  const color = opts.type || clsOf(sc.nodes[b]);
  const g = svgEl('g', { class: 't-' + color }, sc.eLayer);
  const p = svgEl('path', { class: 'edge' + (opts.dash ? ' dash' : ''), d, pathLength: 1 }, g);
  let lab = null;
  if (label) {
    lab = svgEl('g', { class: 'elabel t-' + color, transform: 'translate(' + mid[0] + ' ' + mid[1] + ')' }, sc.lLayer);
    const w = label.length * 7.3 + 20;
    svgEl('rect', { x: -w / 2, y: -13, width: w, height: 26, rx: 13 }, lab);
    svgEl('text', { 'text-anchor': 'middle', y: 5 }, lab).textContent = label;
  }
  sc.edgeEls.push({ a, b, p, lab });
}
const place = (sc, id, cx, y, w, hh) => { sc.pos[id] = { x: cx - w / 2, y, w, h: hh, cx, cy: y + hh / 2 }; };

function drawNodes(sc, onClick) {
  sc.svg.setAttribute('viewBox', '0 0 ' + sc.W + ' ' + sc.H);
  sc.order.forEach(id => {
    const n = sc.nodes[id], p = sc.pos[id];
    const g = svgEl('g', { class: 'node t-' + clsOf(n), transform: 'translate(' + p.x + ' ' + p.y + ')', tabindex: 0, role: 'button', 'data-id': id, 'aria-label': n.codigo + ' ' + n.corto }, sc.nLayer);
    const pop = svgEl('g', { class: 'pop' }, g);
    svgEl('rect', { class: 'box', width: p.w, height: p.h, rx: 24 }, pop);
    const fo = svgEl('foreignObject', { width: p.w, height: p.h }, pop);
    const nd = document.createElementNS('http://www.w3.org/1999/xhtml', 'div');
    nd.className = 'nd';
    nd.append(h('b', {}, n.codigo), h('span', {}, n.sub || n.corto));
    if (n.small) nd.append(h('small', {}, n.small));
    fo.appendChild(nd);
    const gh = svgEl('g', { class: 'ghost' }, g);
    svgEl('rect', { width: p.w, height: p.h, rx: 24 }, gh);
    svgEl('text', { x: p.w / 2, y: p.h / 2 + 10, 'text-anchor': 'middle' }, gh).textContent = '?';
    g.addEventListener('click', () => onClick(sc, id));
    g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onClick(sc, id); } });
    sc.nodeEls[id] = g;
  });
}

/* ----- Mapa general ----- */
const CHAPTERS = [
  { t: 'Problema y visión', v: '--green', types: ['contexto', 'problema', 'vision'] },
  { t: 'Requerimientos y casos de uso', v: '--purple', types: ['rf', 'rnf', 'cu'] },
];
const chapterOf = n => CHAPTERS.findIndex(c => c.types.includes(n.tipo));
const TYPE_LABEL = { contexto: 'Contexto', problema: 'Problema', vision: 'Visión', rf: 'Requerimiento funcional', cu: 'Caso de uso', rnf: 'Requerimiento no funcional' };

function buildMain() {
  const sc = newScene('main', 'main', DATA.order, nodes);
  const cuList = DATA.groups.flatMap(g => g.cus);
  const rnfIds = DATA.rnf || [];
  const P = cuList.length, COLW = 196, STEP = 226, BH = 104, RBH = 112, RGAP = 28;
  const LANE_X = 56, LANE_W = 340, BUS_X = LANE_X + LANE_W + 26, TIP_X = BUS_X + 250, BRACE_W = 26, LEFT = TIP_X + BRACE_W + 40;
  const RF_Y = 340, CU_Y = 570;
  const laneH = rnfIds.length * RBH + (rnfIds.length - 1) * RGAP + 74, LANE_Y = RF_Y + (CU_Y + BH - RF_Y) / 2 - laneH / 2;
  sc.W = LEFT + P * STEP - (STEP - COLW) + 70;
  const midX = LEFT + (sc.W - LEFT) / 2;
  place(sc, 'ctx', midX - 470, 80, 300, 112); place(sc, 'prob', midX, 80, 300, 112); place(sc, 'vis', midX + 470, 80, 300, 112);
  let col = 0;
  DATA.groups.forEach(g => {
    const xs = g.cus.map((cu, j) => LEFT + (col + j) * STEP + COLW / 2);
    g.cus.forEach((cu, j) => place(sc, cu, xs[j], CU_Y, COLW, BH));
    place(sc, g.rf, (xs[0] + xs[xs.length - 1]) / 2, RF_Y, COLW, BH);
    col += g.cus.length;
  });
  rnfIds.forEach((id, i) => place(sc, id, LANE_X + LANE_W / 2, LANE_Y + 44 + i * (RBH + RGAP), 300, RBH));
  const busBottom = CU_Y + BH + 56;
  sc.H = Math.max(LANE_Y + laneH, busBottom) + 90;
  const pos = sc.pos, bottom = id => [pos[id].cx, pos[id].y + pos[id].h], topPt = id => [pos[id].cx, pos[id].y];
  if (rnfIds.length) {
    const lane = svgEl('g', { class: 'lane' }, sc.eLayer);
    svgEl('rect', { x: LANE_X, y: LANE_Y, width: LANE_W, height: laneH, rx: 30 }, lane);
    const lt = svgEl('text', { x: LANE_X + LANE_W / 2, y: LANE_Y + 22, 'text-anchor': 'middle', class: 'ltitle' }, lane);
    lt.textContent = 'Requerimientos no funcionales';
    sc.lane = lane; sc.laneAfter = DATA.order.indexOf(rnfIds[0]);
  }
  addEdge(sc, 'ctx', 'prob', 'enmarca', 'M' + (pos.ctx.x + pos.ctx.w) + ' ' + pos.ctx.cy + ' H' + pos.prob.x, [(pos.ctx.x + pos.ctx.w + pos.prob.x) / 2, pos.ctx.cy], { type: 'problema' });
  addEdge(sc, 'prob', 'vis', 'se resuelve con', 'M' + (pos.prob.x + pos.prob.w) + ' ' + pos.prob.cy + ' H' + pos.vis.x, [(pos.prob.x + pos.prob.w + pos.vis.x) / 2, pos.prob.cy], { type: 'vision' });
  const centerRf = DATA.groups.reduce((best, g) => Math.abs(pos[g.rf].cx - midX) < Math.abs(pos[best].cx - midX) ? g.rf : best, DATA.groups[0].rf);
  DATA.groups.forEach(g => {
    const [x1, y1] = bottom('prob'), [x2, y2] = topPt(g.rf);
    addEdge(sc, 'prob', g.rf, g.rf === centerRf ? 'origina' : '', bez(x1, y1, x2, y2), [(x1 + x2) / 2, (y1 + y2) / 2]);
    const [ax, ay] = bottom(g.rf);
    g.cus.forEach((cu, j) => {
      const [bx, by] = topPt(cu);
      const straight = Math.abs(ax - bx) < 1;
      addEdge(sc, g.rf, cu, j === 0 || straight ? 'se detalla en' : '', straight ? 'M' + ax + ' ' + ay + ' V' + by : bez(ax, ay, bx, by), [(ax + bx) / 2, (ay + by) / 2]);
    });
  });
  if (rnfIds.length) {
    const y1 = RF_Y - 12, y2 = CU_Y + BH + 12, mid = (y1 + y2) / 2, r = 20, bx = TIP_X + BRACE_W;
    const ys = rnfIds.map(id => pos[id].cy);
    rnfIds.forEach((id, i) => {
      addEdge(sc, id, id, '', 'M' + (pos[id].x + pos[id].w) + ' ' + ys[i] + ' H' + BUS_X, null, { type: 'rnf', dash: true });
    });
    addEdge(sc, rnfIds[0], rnfIds[0], '', 'M' + BUS_X + ' ' + Math.min(...ys, mid) + ' V' + Math.max(...ys, mid), null, { type: 'rnf', dash: true });
    addEdge(sc, rnfIds[0], rnfIds[0], 'afectan a todos los RF y CU', 'M' + BUS_X + ' ' + mid + ' H' + TIP_X, [(BUS_X + TIP_X) / 2, mid], { type: 'rnf', dash: true });
    const sx = TIP_X + BRACE_W / 2;
    const brace = 'M' + bx + ' ' + y1 + ' Q' + sx + ' ' + y1 + ' ' + sx + ' ' + (y1 + r) + ' L' + sx + ' ' + (mid - r) + ' Q' + sx + ' ' + mid + ' ' + TIP_X + ' ' + mid + ' Q' + sx + ' ' + mid + ' ' + sx + ' ' + (mid + r) + ' L' + sx + ' ' + (y2 - r) + ' Q' + sx + ' ' + y2 + ' ' + bx + ' ' + y2;
    addEdge(sc, rnfIds[0], rnfIds[0], '', brace, null, { type: 'rnf' });
    cuList.forEach(cu => {
      const rid = nodes[cu].realiza;
      if (!rid) return;
      const [rx, ry] = bottom(rid), [cx, cy] = bottom(cu);
      addEdge(sc, rid, cu, 'se realiza en', 'M' + rx + ' ' + ry + ' V' + busBottom + ' H' + cx + ' V' + cy, [(rx + cx) / 2, busBottom], { type: 'rnf' });
    });
  }
  drawNodes(sc, onNode);
  return sc;
}

/* ----- Diagrama de historias de un caso de uso ----- */
function buildStories(cuId) {
  const sd = DATA.stories[cuId], cu = nodes[cuId];
  const nodeMap = { root: { id: 'root', cls: 'root', codigo: cu.codigo, corto: cu.corto, sub: cu.corto, small: sd.historias.length + ' historias' } };
  sd.historias.forEach(s => {
    nodeMap[s.id] = { id: s.id, cls: s.spike ? 'spike' : s.prio.toLowerCase(), codigo: s.id, corto: s.titulo, small: s.patron + ' · ' + s.prio };
  });
  const order = ['root', ...sd.historias.map(s => s.id)];
  const sc = newScene(cuId, 'story', order, nodeMap);
  sc.cuId = cuId;
  const COLS = 5, BW = 232, BHH = 128, GX = 34, ROW = 236, SPINE = 40, MARG = 90;
  const cw = COLS * BW + (COLS - 1) * GX;
  sc.W = SPINE + cw + 2 * MARG;
  const cx0 = SPINE + MARG + cw / 2;
  place(sc, 'root', cx0, 70, 400, 112);
  const rows = Math.ceil(sd.historias.length / COLS);
  const Y0 = 330;
  const busY = r => Y0 + r * ROW - 62;
  sd.historias.forEach((s, i) => {
    const r = Math.floor(i / COLS), idx = i % COLS, inRow = Math.min(COLS, sd.historias.length - r * COLS);
    const rowW = inRow * BW + (inRow - 1) * GX;
    const cx = cx0 - rowW / 2 + idx * (BW + GX) + BW / 2;
    place(sc, s.id, cx, Y0 + r * ROW, BW, BHH);
  });
  sc.H = Y0 + (rows - 1) * ROW + BHH + 80;
  const root = sc.pos.root;
  for (let r = 0; r < rows; r++) {
    const first = sd.historias[r * COLS].id;
    const d = r === 0 ? 'M' + root.x + ' ' + root.cy + ' H' + SPINE + ' V' + busY(0) : 'M' + SPINE + ' ' + busY(r - 1) + ' V' + busY(r);
    addEdge(sc, 'root', first, '', d, null, { type: 'root' });
  }
  sd.historias.forEach((s, i) => {
    const r = Math.floor(i / COLS), p = sc.pos[s.id];
    addEdge(sc, 'root', s.id, s.patron, 'M' + SPINE + ' ' + busY(r) + ' H' + p.cx + ' V' + p.y, [p.cx, p.y - 26]);
  });
  drawNodes(sc, onNode);
  return sc;
}
const getScene = key => scenes[key] || (scenes[key] = key === 'main' ? buildMain() : buildStories(key));

/* ---------- Estado visible ---------- */
function paint(freshId) {
  const sc = S;
  sc.order.forEach((id, i) => {
    const g = sc.nodeEls[id];
    g.classList.toggle('on', i < sc.k);
    g.classList.toggle('next', i === sc.k && sc.kind !== 'main');
    g.classList.toggle('focus', i === sc.ci);
    g.setAttribute('aria-hidden', i < sc.k ? 'false' : 'true');
    g.tabIndex = i < sc.k ? 0 : -1;
    if (freshId && (Array.isArray(freshId) ? freshId.includes(id) : id === freshId)) { g.classList.remove('fresh'); void g.getBoundingClientRect(); g.classList.add('fresh'); }
  });
  if (sc.lane) sc.lane.classList.toggle('on', sc.k > sc.laneAfter);
  sc.edgeEls.forEach(e => {
    const on = revealed(sc, e.a) && revealed(sc, e.b);
    e.p.classList.toggle('on', on);
    if (e.lab) e.lab.classList.toggle('on', on);
  });
  $('bar').style.width = (sc.k / sc.order.length * 100) + '%';
  paintHeader();
  const prev = $('prev'), next = $('next'), N = sc.order.length;
  prev.disabled = sc.ci < 0;
  if (sc.ci < 0 && sc.k === 0) next.textContent = 'Empezar';
  else if (sc.ci < 0) next.textContent = 'Continuar';
  else if (sc.ci < sc.k - 1) next.textContent = 'Siguiente';
  else if (sc.k < N) next.textContent = 'Descubrir ' + (sc.kind === 'main' ? STAGE_LABEL[sc.nodes[sc.order[sc.k]].tipo] : sc.nodes[sc.order[sc.k]].codigo);
  else next.textContent = 'Mapa completo ✓';
  next.disabled = sc.ci >= 0 && sc.ci >= sc.k - 1 && sc.k >= N;
  const cur = sc.ci >= 0 ? sc.nodes[sc.order[sc.ci]] : null;
  let small = 'Mapa', strong = 'Del problema a los casos de uso', color = '--green';
  if (sc.kind === 'main' && cur) { const c = CHAPTERS[chapterOf(cur)]; small = 'Capítulo ' + (chapterOf(cur) + 1); strong = c.t; color = c.v; }
  if (sc.kind === 'story') { small = 'Historias de ' + nodes[sc.cuId].codigo; strong = cur && cur.cls !== 'root' ? cur.codigo + ' · ' + cur.corto : 'Cómo se parte el caso de uso'; color = '--teal'; }
  $('tag').style.setProperty('--c', 'var(' + color + ')');
  $('tag').innerHTML = '<small></small><strong></strong>';
  $('tag').querySelector('small').textContent = small;
  $('tag').querySelector('strong').textContent = strong;
}

const pathOf = id => {
  const t = nodes[id].tipo;
  if (id === 'ctx') return ['ctx'];
  if (id === 'prob') return ['ctx', 'prob'];
  if (id === 'vis') return ['ctx', 'prob', 'vis'];
  if (t === 'rf') return ['prob', id];
  if (t === 'cu') return ['prob', nodes[id].rf, id];
  return ['prob', id];
};
const relationText = id => {
  const n = nodes[id];
  if (id === 'ctx') return null;
  if (id === 'prob') return '<em>Contexto del negocio</em> enmarca el <em>problema</em>.';
  if (id === 'vis') return 'El <em>problema</em> se resuelve con la <em>visión</em> del sistema.';
  if (n.tipo === 'rf') return 'El <em>problema</em> origina <em>' + n.codigo + '</em>.';
  if (n.tipo === 'cu') return '<em>' + nodes[n.rf].codigo + '</em> se detalla en <em>' + n.codigo + '</em>.' + (n.realiza ? ' <em>' + nodes[n.realiza].codigo + '</em> se realiza en este caso de uso.' : '');

};

  if (id === 'root') return storyRootCard();
  const sd = DATA.stories[S.cuId], st = sd.historias.find(x => x.id === id);
  const inv = st.invest;
  const donde = L => (inv && inv.letras[L] ? inv.letras[L].donde : LETTERS[L].donde);
  let active = null;
  setCard('t-' + (st.spike ? 'spike' : st.prio.toLowerCase()));
  card.append(h('div', { class: 'eyebrow' }, (st.spike ? 'Spike' : 'Historia') + ' · ' + st.id + ' · Prioridad ' + st.prio), h('h2', {}, st.titulo));

  const secs = {};
  const sec = (key, ...kids) => { const d = h('div', { class: 'secbox', 'data-sec': key }, ...kids); secs[key] = d; return d; };
  const badgesFor = key => h('span', { class: 'badges' }, inv ? LKEYS.filter(L => inv.letras[L] && inv.letras[L].donde.includes(key)).map(L => h('span', { class: 'lbadge L-' + L, title: LETTERS[L].n }, L)) : []);

  /* Historia */
  const stmt = h('p', {});
  if (inv) {
    inv.segmentos.forEach(sg => {
      if (!sg.tag) stmt.append(sg.t);
      else { const sp = h('span', { class: 'sig L-' + sg.tag, 'data-l': sg.tag, title: LETTERS[sg.tag].n, onclick: () => selectLetter(sg.tag) }, sg.t, h('sup', {}, sg.tag)); stmt.append(sp); }
    });
  } else stmt.innerHTML = st.enunciado;
  const think = h('div', { class: 'think' }, h('b', { class: 'lbl' }, st.spike ? 'Pregunta a responder' : 'Historia'), stmt);
  card.append(sec('historia', think));
  card.append(h('div', { class: 'facts' }, h('span', { class: 'fact', html: 'Cubre: ' + st.cubre }), h('span', { class: 'fact' }, st.horas + ' h en ' + st.tareas.length + ' tareas')));

  /* Partición */
  card.append(sec('particion', h('h3', { class: 'sec' }, 'Cómo se partió ', badgesFor('particion')),
    st.patrones.map(p => h('div', { class: 'pat' }, h('b', {}, p.id + ' · ' + p.nombre), ' — ' + p.uso)),
    st.desempate ? h('p', { class: 'link', html: st.desempate }) : null));

  /* INVEST */
  const invBox = h('div', { class: 'invest' });
  const chipsRow = h('div', { class: 'letters' });
  const detail = h('div', {});
  LKEYS.forEach(L => chipsRow.append(h('button', { class: 'lchip L-' + L, 'aria-pressed': 'false', 'data-l': L, onclick: () => selectLetter(L) }, h('span', { class: 'lbadge' }, L), LETTERS[L].n)));
  invBox.append(chipsRow, detail);
  const investHelp = helpBtn('invest', null, 'Qué es INVEST');
  card.append(h('h3', { class: 'sec' }, inv ? 'INVEST aplicado a ' + st.id : 'INVEST: aplíquelo en clase', investHelp), invBox);

  /* Criterios */
  const acN = st.ac ? st.ac.escenarios.length : 0;
  const acHead = h('h3', { class: 'sec' }, 'Criterios de aceptación ', badgesFor('criterios'),
    st.ac ? h('span', { class: 'limit ' + (acN <= 7 ? 'ok' : 'warn') }, acN + ' de 5 a 7 ' + (acN <= 7 ? '✓' : '⚠')) : null);
  const acBody = [];
  if (st.ac) {
    if (st.ac.fondo.length) acBody.push(h('details', { class: 'sc' }, h('summary', {}, 'Contexto común (Background)'), h('pre', { html: gherkinHtml(st.ac.fondo) })));
    st.ac.escenarios.forEach(e => acBody.push(h('details', { class: 'sc' }, h('summary', {}, e.titulo), h('pre', { html: gherkinHtml(e.pasos) }))));
  } else acBody.push(h('p', { class: 'link' }, 'Un spike termina con una decisión escrita, no con escenarios Gherkin.'));
  card.append(sec('criterios', acHead, ...acBody));

  /* Listo y Terminado */
  const checks = list => h('ul', { class: 'check' }, list.map(x => h('li', {}, h('span', {}, h('span', { html: x.t }), x.p ? h('span', { class: 'pt' }, x.p) : null))));
  card.append(h('div', { class: 'two' }, h('div', { class: 'secbox' }, h('h3', { class: 'sec' }, 'Definición de Listo', helpBtn('listo', null, 'Qué es la Definición de Listo')), checks(st.listo)), h('div', { class: 'secbox' }, h('h3', { class: 'sec' }, 'Definición de Terminado', helpBtn('terminado', null, 'Qué es la Definición de Terminado')), checks(st.terminado))));

  /* Tareas */
  const taskRows = st.tareas.map(t => h('tr', {}, h('td', {}, t.id), h('td', { html: t.desc }), h('td', {}, t.tipo), h('td', {}, t.horas)));
  card.append(sec('tareas', h('h3', { class: 'sec' }, 'Tareas ', badgesFor('tareas'), h('span', { class: 'limit ok' }, st.horas + ' h en total')),
    h('div', { class: 'tablewrap' }, h('table', {}, h('thead', {}, h('tr', {}, ['Tarea', 'Descripción', 'Tipo', 'Horas'].map(x => h('th', {}, x)))), h('tbody', {}, taskRows)))));

  /* Dependencias */
  card.append(sec('dependencias', h('h3', { class: 'sec' }, 'Dependencias del caso de uso ', badgesFor('dependencias')), h('ul', {}, sd.dependencias.map(d => h('li', { html: d })))));

  /* Candidatos y CRUD */
  if (inv && inv.candidatos.length) {
    const cell = (v, pick) => h('td', { class: v === '✓' ? 'y' : v === '✗' ? 'n' : '' }, v);
    card.append(h('h3', { class: 'sec' }, 'Candidatos de partición evaluados con INVEST'),
      h('div', { class: 'tablewrap' }, h('table', { class: 'matrix' }, h('thead', {}, h('tr', {}, ['Candidato', ...LKEYS, 'Decisión'].map(x => h('th', {}, x)))),
        h('tbody', {}, inv.candidatos.map(r => h('tr', { class: r[7] && r[7].startsWith('Elegida') ? 'pickrow' : '' }, h('td', {}, r[0]), r.slice(1, 7).map(v => cell(v)), h('td', { class: r[7] && r[7].startsWith('Elegida') ? 'pick' : '' }, r[7])))))));
  }
  if (inv && inv.crud.length) card.append(h('details', { class: 'sc' }, h('summary', {}, 'Para ir más allá: INVEST IN CRUD'), h('ul', {}, inv.crud.map(c => h('li', { html: '<b>' + c.nombre + ':</b> ' + c.texto })))));

  function selectLetter(L) {
    active = L;
    chipsRow.querySelectorAll('.lchip').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.l === L)));
    card.querySelectorAll('.sig').forEach(s => s.classList.toggle('on', s.dataset.l === L));
    Object.entries(secs).forEach(([k, el]) => { el.classList.toggle('hl', donde(L).includes(k)); el.className = el.className.replace(/ L-[INVEST]/, ''); if (donde(L).includes(k)) el.classList.add('L-' + L); });
    detail.replaceChildren();
    const meta = LETTERS[L], d = inv && inv.letras[L];
    const body = h('div', { class: 'ldetail L-' + L }, h('div', { class: 'q', html: (d ? d.pregunta : meta.q) }), h('button', { class: 'docbtn', onclick: () => openGlossary('invest', L, true) }, 'Qué significa la letra ' + L + ' (presentación) →'));
    if (d) {
      body.append(h('div', { class: 'lbox sig-box' }, h('b', {}, '✓ Señal en la historia'), h('span', { html: d.senal })),
        h('div', { class: 'lbox bad' }, h('b', {}, '✗ Ejemplo que la rompería'), h('span', { html: d.ejemplo })),
        h('div', { class: 'lbox fix' }, h('b', {}, '↻ Cómo se corrige'), h('span', { html: d.correccion })),
        h('p', { class: 'verdict', html: 'Veredicto: ' + d.veredicto }));
    } else body.append(h('p', { class: 'link' }, 'Busque la señal en las secciones resaltadas y decida si cumple. Escriba un ejemplo que la rompería.'));
    body.append(h('div', { class: 'thread' }, h('span', { class: 'lead' }, 'Mírela en:'), donde(L).map(k => h('span', {}, { historia: 'la historia', criterios: 'los criterios', tareas: 'las tareas', particion: 'la partición', dependencias: 'las dependencias' }[k] || k))));
    detail.append(body);
  }
  selectLetter('I');
}

/* ---------- Navegación ---------- */
function openNode(sc, id) {
  if (sc !== S) return;
  sc.ci = sc.order.indexOf(id);
  if (sc.kind === 'main') mainCard(id); else storyCard(id);
  card.scrollTop = 0;
  paint();
  centerOn(id);
}
function onNode(sc, id) {
  const i = sc.order.indexOf(id);
  if (i < sc.k) openNode(sc, id); else if (i >= sc.k && i < nextEnd(sc, sc.k)) advance();
}
function persist() { if (S.kind === 'main') store.k = S.k; else store.stories[S.key] = S.k; save(); }
function advance() {
  if (S.ci < S.k - 1) { openNode(S, S.order[S.ci + 1]); return; }
  if (S.k < S.order.length) {
    const from = S.k;
    S.k = nextEnd(S, from); persist();
    openNode(S, S.order[from]);
    paint(S.order.slice(from, S.k));
  }
}
function back() {
  if (S.ci > 0) openNode(S, S.order[S.ci - 1]);
  else if (S.ci === 0) showIntro();
}
function activate(sc) {
  S = sc;
  board.replaceChildren(sc.svg);
  applyZoom();
}
function goStories(cuId) {
  const sc = getScene(cuId);
  activate(sc);
  if (sc.ci >= 0) openNode(sc, sc.order[sc.ci]); else showIntro();
  board.scrollTo({ left: 0, top: 0 });
}
function goMain(openId) {
  const sc = getScene('main');
  activate(sc);
  if (openId && revealed(sc, openId)) openNode(sc, openId);
  else if (sc.ci >= 0) openNode(sc, sc.order[sc.ci]); else showIntro();
}

/* ---------- Zoom y desplazamiento ---------- */
function applyZoom() {
  S.svg.setAttribute('width', Math.round(S.W * S.zoom));
  S.svg.setAttribute('height', Math.round(S.H * S.zoom));
  $('zval').textContent = Math.round(S.zoom * 100) + '%';
}
function centerOn(id) {
  const p = S.pos[id];
  board.scrollTo({ left: p.cx * S.zoom - board.clientWidth / 2, top: p.cy * S.zoom - board.clientHeight / 2, behavior: 'smooth' });
}
function setZoom(z) { S.zoom = Math.min(1.4, Math.max(0.3, z)); applyZoom(); if (S.ci >= 0) centerOn(S.order[S.ci]); }
$('zin').addEventListener('click', () => setZoom(S.zoom + 0.1));
$('zout').addEventListener('click', () => setZoom(S.zoom - 0.1));
$('zfit').addEventListener('click', () => { S.zoom = Math.min(1.4, Math.max(0.3, board.clientWidth / S.W)); applyZoom(); board.scrollTo({ left: 0, top: 0 }); });

/* ---------- Controles ---------- */
$('next').addEventListener('click', () => {
  if (S.ci < 0 && S.k === 0) advance();
  else if (S.ci < 0) openNode(S, S.order[0]);
  else advance();
});
$('prev').addEventListener('click', back);
$('brand').addEventListener('click', () => { if (S.kind === 'story') goMain(S.cuId); });
$('showAll').addEventListener('click', () => { S.k = S.order.length; persist(); if (S.ci < 0) showIntro(); else openNode(S, S.order[S.ci]); paint(); });
$('reset').addEventListener('click', () => { S.k = 0; S.ci = -1; persist(); showIntro(); board.scrollTo({ left: 0, top: 0 }); });
$('theme').addEventListener('click', () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem(KEY + '-theme', root.dataset.theme); } catch (e) { /* ignorar */ }
});
try { const th = localStorage.getItem(KEY + '-theme'); if (th) document.documentElement.dataset.theme = th; } catch (e) { /* ignorar */ }
/* ---------- Panel de ayuda ---------- */
const G = { open: false, full: false, sec: 'historia', step: 0, letter: null, from: null };
const SHORT = { 'Definición de Listo': 'Listo', 'Definición de Terminado': 'Terminado', 'Historia de usuario': 'Historia' };
function stepsOf(s) {
  const out = [];
  if (s.intro && s.intro.trim()) out.push({ titulo: s.titulo, html: s.intro, letra: null, src: false });
  s.subs.forEach(sub => out.push({ titulo: sub.titulo === 'Fuentes' ? 'Dónde leer más' : sub.titulo, html: sub.html, letra: sub.letra, src: sub.titulo === 'Fuentes' }));
  return out;
}
const curSection = () => DATA.glosario.find(x => x.id === G.sec) || DATA.glosario[0];
function drawGlossary() {
  const sections = DATA.glosario;
  const tabs = $('gtabs'), body = $('gbody'), dr = $('gdrawer');
  dr.classList.toggle('full', G.full);
  $('gmode').textContent = G.full ? 'Volver al panel' : 'Presentación';
  $('gmode').setAttribute('aria-pressed', String(G.full));
  $('gfs').hidden = !G.full;
  $('gfs').textContent = document.fullscreenElement ? 'Salir de pantalla completa' : 'Pantalla completa (F11)';
  tabs.replaceChildren(...sections.map(s => h('button', { role: 'tab', 'aria-selected': String(s.id === G.sec), onclick: () => openGlossary(s.id, null, G.full) }, SHORT[s.titulo] || s.titulo)));
  const s = curSection();
  if (G.full) return drawWizard(s, body);
  const nodesOut = [h('h2', {}, s.titulo)];
  if (s.intro) nodesOut.push(h('div', { html: s.intro }));
  s.subs.forEach(sub => {
    const src = sub.titulo === 'Fuentes';
    const hit = sub.letra && sub.letra === G.letter;
    nodesOut.push(h('div', { class: 'gsub' + (src ? ' src' : '') + (hit ? ' hit' : ''), 'data-letter': sub.letra || false }, h('h3', {}, src ? 'Dónde leer más' : sub.titulo), h('div', { html: sub.html })));
  });
  body.replaceChildren(...nodesOut);
  const target = body.querySelector('.hit');
  if (target) target.scrollIntoView({ block: 'start' }); else body.scrollTop = 0;
}
function drawWizard(s, body) {
  const steps = stepsOf(s);
  G.step = Math.max(0, Math.min(G.step, steps.length - 1));
  const st = steps[G.step];
  const rail = h('nav', { class: 'grail', 'aria-label': 'Pasos' }, h('b', {}, SHORT[s.titulo] || s.titulo),
    steps.map((x, n) => h('button', { class: n === G.step ? 'on' : '', 'aria-current': n === G.step ? 'step' : false, onclick: () => { G.step = n; drawGlossary(); } }, x.letra ? x.letra + ' · ' + x.titulo.split(' · ')[1] : (n === 0 ? 'Qué es' : x.titulo))));
  const head = st.letra
    ? h('div', { class: 'gtitle' }, h('span', { class: 'gbig L-' + st.letra }, st.letra), h('h2', {}, st.titulo.split(' · ')[1]))
    : h('div', { class: 'gtitle' }, h('h2', {}, st.titulo));
  const dots = h('div', { class: 'gdots' }, steps.map((_, n) => h('i', { class: n === G.step ? 'on' : '' })));
  const nav = h('div', { class: 'gnav' }, h('button', { class: 'btn', onclick: () => stepGlossary(-1) }, '← Anterior'), h('span', {}, (SHORT[s.titulo] || s.titulo) + ' · ' + (G.step + 1) + ' de ' + steps.length), dots, h('button', { class: 'btn primary', onclick: () => stepGlossary(1) }, 'Siguiente →'));
  const stage = h('div', { class: 'gstage' + (st.src ? ' src' : '') }, h('div', { class: 'gslide' }, head, h('div', { class: 'gtext', html: st.html })), nav);
  body.replaceChildren(h('div', { class: 'gwiz' }, rail, stage));
  stage.firstChild.scrollTop = 0;
}
function stepGlossary(d) {
  const secs = DATA.glosario;
  let si = secs.findIndex(x => x.id === G.sec), n = G.step + d;
  const len = stepsOf(secs[si]).length;
  if (n >= len) { if (si < secs.length - 1) { si++; n = 0; } else n = len - 1; }
  else if (n < 0) { if (si > 0) { si--; n = stepsOf(secs[si]).length - 1; } else n = 0; }
  G.sec = secs[si].id; G.step = n; drawGlossary();
}
function openGlossary(sec, letter, full) {
  if (!DATA.glosario || !DATA.glosario.length) return;
  if (!G.open) G.from = document.activeElement;
  G.open = true; G.sec = sec || G.sec; G.letter = letter || null;
  if (full !== undefined) G.full = !!full;
  G.step = 0;
  if (letter) { const i = stepsOf(curSection()).findIndex(x => x.letra === letter); if (i >= 0) G.step = i; }
  $('gdrawer').classList.add('open');
  $('gdrawer').setAttribute('aria-hidden', 'false');
  $('gtab').setAttribute('aria-expanded', 'true');
  drawGlossary();
  $('gclose').focus({ preventScroll: true });
}
function closeGlossary() {
  if (!G.open) return;
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  G.open = false; G.full = false;
  $('gdrawer').classList.remove('open', 'full');
  $('gdrawer').setAttribute('aria-hidden', 'true');
  $('gtab').setAttribute('aria-expanded', 'false');
  if (G.from && G.from.focus) G.from.focus({ preventScroll: true });
}
function toggleBrowserFullscreen() {
  try {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen().catch(() => {});
  } catch (e) { /* el navegador puede bloquearlo */ }
}
const helpBtn = (sec, letter, label) => h('button', { class: 'ghelp', title: label, 'aria-label': label, onclick: e => { e.stopPropagation(); openGlossary(sec, letter); } }, '?');
$('gtab').addEventListener('click', () => (G.open ? closeGlossary() : openGlossary(S.kind === 'story' ? 'invest' : 'historia', null, false)));
$('gclose').addEventListener('click', closeGlossary);
$('gmode').addEventListener('click', () => { G.full = !G.full; if (!G.full && document.fullscreenElement) document.exitFullscreen().catch(() => {}); drawGlossary(); });
$('gfs').addEventListener('click', toggleBrowserFullscreen);
document.addEventListener('fullscreenchange', () => { if (G.open) drawGlossary(); });
document.addEventListener('keydown', e => {
  if (!G.open) return;
  if (e.key === 'Escape') { if (G.full && !document.fullscreenElement) { G.full = false; drawGlossary(); } else if (!G.full) closeGlossary(); }
  else if (G.full && (e.key === 'ArrowRight' || e.key === 'PageDown')) { e.preventDefault(); stepGlossary(1); }
  else if (G.full && (e.key === 'ArrowLeft' || e.key === 'PageUp')) { e.preventDefault(); stepGlossary(-1); }
  else if (G.full && (e.key === 'f' || e.key === 'F' || e.key === 'F11')) { e.preventDefault(); toggleBrowserFullscreen(); }
});

document.addEventListener('keydown', e => {
  if (G.open) return;
  if (e.target.closest && e.target.closest('input, textarea')) return;
  if (e.key === 'ArrowRight') { e.preventDefault(); $('next').click(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); back(); }
});

activate(getScene('main'));
showIntro();
</script>
</body>
</html>
