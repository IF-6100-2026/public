oda solicitud de anulación pendiente y toda venta a fiado en espera de autorización caducan: la dueña ya no puede autorizarlas ni rechazarlas, la venta de la solicitud de anulación sigue cobrada y la venta a fiado en espera se descarta sin cobrarse (<a href=\"#\" data-go=\"rf2\">RF-02<\/a>).<\/li>\n<li>El cierre del día y cada solicitud o venta en espera caducada quedan en la bitácora con persona, fecha, hora y motivo o tipo de solicitud (ver RNF-02); la bitácora no se puede editar ni borrar desde la aplicación.<\/li>\n<li>El cierre del día no calcula ni exige el cuadre de caja; el sistema solo recuerda que el cuadre es un proceso manual.<\/li>\n<\/ol>\n<h2>Referencias<\/h2>\n<ul>\n<li><a href=\"#\" data-go=\"cu6\">CU-06<\/a><\/li>\n<li><a href=\"#\" data-go=\"cu6\">Backlog de CU-06<\/a><\/li>\n<li><a href=\"#\" data-go=\"rf3\">RF-03 Anular ventas con autorización<\/a><\/li>\n<li><a href=\"#\" data-go=\"rf2\">RF-02 Vender a fiado<\/a><\/li>\n<li><a href=\"#\" data-go=\"rnf2\">RNF-02 Trazabilidad y auditoría<\/a><\/li>\n<li><a href=\"#\" data-go=\"rnf3\">RNF-03 Control de acceso y protección de credenciales<\/a><\/li>\n<\/ul>"}, {"id": "cu6", "tipo": "cu", "codigo": "CU-06", "titulo": "Cerrar el día", "corto": "Cerrar el día", "abstract": "Este caso de uso permite que la dueña marque el cierre del día. Desde ese momento las ventas del día ya no se pueden anular (CU-03) y las solicitudes pendientes de anulación caducan y las ventas a fiado «en espera de autorización» (CU-02) caducan y se descartan sin cobrarse.", "chips": ["Primarios: Dueña", "4 flujos alternativos"], "rnfs": ["rnf2", "rnf3"], "rfs": [], "rf": "rf6", "realiza": null, "realizaEn": [], "html": "<h2>Título del Caso de Uso<\/h2>\n<p>CU-06 Cerrar el día (atiende <a href=\"#\" data-go=\"rf6\">RF-06<\/a>)<\/p>\n<h2>Descripción<\/h2>\n<p>Este caso de uso permite que la dueña marque el cierre del día. Desde ese momento las ventas del día ya no se pueden anular (<a href=\"#\" data-go=\"cu3\">CU-03<\/a>) y las solicitudes pendientes de anulación caducan y las ventas a fiado «en espera de autorización» (<a href=\"#\" data-go=\"cu2\">CU-02<\/a>) caducan y se descartan sin cobrarse. El cierre del día no es el cuadre de caja (conteo de efectivo), que sigue siendo un proceso manual fuera de esta versión.<\/p>\n<h2>Actores<\/h2>\n<ul>\n<li><strong>Primarios<\/strong>: Dueña (cierra el día desde su sesión administrativa)<\/li>\n<\/ul>\n<h2>Precondiciones<\/h2>\n<ul>\n<li>La dueña tiene su sesión administrativa abierta (<a href=\"#\" data-go=\"cu4\">CU-04<\/a>); esa sesión no abre turno ni ocupa la caja.<\/li>\n<li>Ninguna caja está abierta: todos los turnos están cerrados. Una venta a fiado «en espera de autorización» no cuenta como venta abierta ni impide el cierre, así que puede existir con todos los turnos cerrados.<\/li>\n<li>El día no está cerrado.<\/li>\n<\/ul>\n<h2>Postcondiciones<\/h2>\n<ul>\n<li>El día queda marcado como cerrado, con la fecha, la hora y la dueña que lo cerró.<\/li>\n<li>Las ventas de ese día ya no se pueden anular, ni por solicitud ni por anulación directa.<\/li>\n<li>Las solicitudes de anulación pendientes y las ventas a fiado «en espera de autorización» quedaron caducadas: la dueña ya no puede autorizarlas ni rechazarlas, y las ventas en espera se descartaron sin cobrarse.<\/li>\n<li>La bitácora registra el cierre del día y cada solicitud caducada.<\/li>\n<\/ul>\n<h2>Flujo Principal<\/h2>\n<ol>\n<li>La dueña elige «Cerrar el día».<\/li>\n<li>El sistema verifica que no haya ningún turno abierto <span class=\"ref\">FA-01<\/span> y que el día no esté cerrado <span class=\"ref\">FA-02<\/span>.<\/li>\n<li>El sistema muestra la fecha que se va a cerrar y cuántas solicitudes de anulación pendientes y cuántas ventas a fiado en espera van a caducar, y pide confirmar. <span class=\"ref\">FA-03<\/span><\/li>\n<li>La dueña confirma el cierre.<\/li>\n<li>El sistema marca el día como cerrado (fecha, hora y dueña) y caduca las solicitudes de anulación pendientes y las ventas a fiado en espera (estas se descartan sin cobrarse).<\/li>\n<li>El sistema registra en la bitácora el cierre del día y cada solicitud o venta en espera caducada (tipo, venta, solicitante, fecha, hora y motivo de la solicitud).<\/li>\n<li>El sistema informa que el día quedó cerrado, cuántas solicitudes caducaron y recuerda que el cuadre de caja es un proceso manual.<\/li>\n<\/ol>\n<h2>Flujos Alternativos<\/h2>\n<h3>FA-01: Hay un turno abierto<\/h3>\n<ol>\n<li>El sistema no cierra el día e indica qué cajera tiene el turno abierto.<\/li>\n<li>La cajera cierra su turno (pasos 6 y 7 del flujo principal de <a href=\"#\" data-go=\"cu4\">CU-04<\/a>).<\/li>\n<li>El caso de uso continúa en el paso 1 del flujo principal.<\/li>\n<\/ol>\n<h3>FA-02: El día ya está cerrado<\/h3>\n<ol>\n<li>El sistema indica que el día ya fue cerrado, con la hora y la dueña que lo cerró.<\/li>\n<li>No cambia nada ni se registra un segundo cierre.<\/li>\n<li>El caso de uso termina.<\/li>\n<\/ol>\n<h3>FA-03: La dueña cancela el cierre<\/h3>\n<ol>\n<li>La dueña cancela en la pantalla de confirmación.<\/li>\n<li>El día sigue abierto, las ventas siguen siendo anulables y las solicitudes de anulación y las ventas a fiado en espera siguen como estaban.<\/li>\n<li>El caso de uso termina.<\/li>\n<\/ol>\n<h3>FA-04: Quien intenta cerrar el día no es la dueña<\/h3>\n<ol>\n<li>El sistema rechaza la operación por falta de permiso, sin importar si se intentó desde la interfaz o llamando a la API directamente.<\/li>\n<li>El día sigue abierto.<\/li>\n<li>El caso de uso termina.<\/li>\n<\/ol>\n<h2>Prototipos<\/h2>\n<p>Boceto de baja fidelidad de la pantalla de cierre del día de la dueña:<\/p>\n<pre><code class=\"language-text\">Cerrar el día (dueña, sesión administrativa)\n+--------------------------------------------------+\n| Fecha: 19/10/2026         Turnos abiertos: 0     |\n| Solicitudes pendientes que caducarán:            |\n|   Anulación: 2     Fiado en espera: 0            |\n| Al cerrar, las ventas de hoy ya no se anulan.    |\n| (El cuadre de caja se hace aparte, a mano.)      |\n| [Cerrar el día]  [Cancelar]                      |\n+--------------------------------------------------+\n<\/code><\/pre>\n<h2>Requerimientos Especiales<\/h2>\n<ul>\n<li><strong>Seguridad<\/strong> (RNF-03): incluye <a href=\"#\" data-go=\"cu8\">CU-08 Autorizar una operación sensible con el PIN de la dueña<\/a> para la autorización con PIN.<\/li>\n<li><strong>Seguridad<\/strong> (RNF-03): solo la dueña cierra el día; la validación de permisos se hace en el servidor, no solo en la interfaz.<\/li>\n<li><strong>Seguridad<\/strong> (RNF-02): el cierre del día y cada caducidad quedan en la bitácora con persona, fecha y hora; la bitácora no se puede editar ni borrar desde la aplicación.<\/li>\n<li><strong>Regla de negocio<\/strong>: el cierre del día no es el cuadre de caja; no cuenta ni compara efectivo.<\/li>\n<li><strong>Regla de negocio<\/strong> <em>(supuesto)<\/em>: el cierre del día no se puede deshacer desde la aplicación: no existe la reapertura del día. Un cierre equivocado se resuelve fuera del sistema.<\/li>\n<li><strong>Regla de negocio<\/strong> <em>(supuesto)<\/em>: el día se cierra al terminar la jornada y, una vez cerrado, no se abre otro turno ese día (el rechazo al intentar abrirlo lo define <a href=\"#\" data-go=\"cu4\">CU-04<\/a>).<\/li>\n<li><strong>Regla de negocio<\/strong>: una venta a fiado «en espera de autorización» ya no cuenta como venta abierta ni bloquea el cierre de turno ni el cierre del día; solo los turnos abiertos lo bloquean. Por eso puede quedar una venta en espera con todos los turnos cerrados, y esa venta caduca al cerrar el día.<\/li>\n<li><strong>Regla de negocio<\/strong>: una solicitud o venta en espera caducada no se reactiva ni se vuelve a crear con el mismo motivo; las ventas ya cobradas del día conservan su estado.<\/li>\n<\/ul>\n<h2>Escenarios de Prueba<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Entrada<\/th>\n<th>Salida Esperada<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Flujo principal: la dueña «Doña Marta» elige cerrar el día sin turnos abiertos y con 2 solicitudes de anulación pendientes, y confirma<\/td>\n<td>El día queda cerrado con fecha, hora y Doña Marta; el sistema informa 2 solicitudes caducadas<\/td>\n<\/tr>\n<tr>\n<td>Flujo principal: tras el cierre, la cajera solicita anular la venta #1042 de hoy<\/td>\n<td>Solicitud rechazada con el mensaje de que solo se anulan ventas del día y antes del cierre del día<\/td>\n<\/tr>\n<tr>\n<td>Flujo principal: solicitud de anulación pendiente sobre la venta #1042 al cerrar el día<\/td>\n<td>La solicitud caduca, la venta #1042 sigue cobrada y la dueña ya no puede autorizarla<\/td>\n<\/tr>\n<tr>\n<td>Flujo principal: venta a fiado de ₡25 000 en espera de autorización, con todos los turnos cerrados, al cerrar el día<\/td>\n<td>El cierre no se bloquea; la venta en espera caduca, se descarta sin cobrarse y el saldo no cambia<\/td>\n<\/tr>\n<tr>\n<td>Flujo principal: cierre del día con 2 solicitudes de anulación caducadas<\/td>\n<td>La bitácora tiene 1 registro del cierre y 2 de caducidad, con persona, fecha y hora<\/td>\n<\/tr>\n<tr>\n<td>FA-01: «Katherine» tiene el turno abierto<\/td>\n<td>El sistema no cierra el día e indica que Katherine tiene el turno abierto<\/td>\n<\/tr>\n<tr>\n<td>FA-02: cerrar un día que ya se cerró a las 20:15<\/td>\n<td>El sistema informa que ya está cerrado desde las 20:15 y quién lo cerró; no hay un segundo registro<\/td>\n<\/tr>\n<tr>\n<td>FA-03: la dueña cancela en la confirmación<\/td>\n<td>El día sigue abierto y las solicitudes siguen pendientes<\/td>\n<\/tr>\n<tr>\n<td>FA-04: la cajera «Yendry» intenta cerrar el día, incluso llamando a la API directamente<\/td>\n<td>Acceso denegado y el día sigue abierto<\/td>\n<\/tr>\n<tr>\n<td>Seguridad: modificar o borrar el registro del cierre en la bitácora<\/td>\n<td>La aplicación no ofrece la operación y el registro no cambia<\/td>\n<\/tr>\n<tr>\n<td>Regla: después de cerrar el día, la dueña busca reabrirlo o deshacer el cierre<\/td>\n<td>La aplicación no ofrece reabrir ni deshacer; el día sigue cerrado y no se abre otro turno ese día<\/td>\n<\/tr>\n<tr>\n<td>Alcance: cerrar el día sin haber hecho el cuadre de caja<\/td>\n<td>El cierre se realiza; el sistema solo recuerda que el cuadre es manual<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Guiones de prueba (Gherkin):<\/strong> <span class=\"ref\">h1<\/span>, <span class=\"ref\">h2<\/span>, <span class=\"ref\">h3<\/span>, <span class=\"ref\">h4<\/span>, <span class=\"ref\">h5<\/span>, <span class=\"ref\">h6<\/span>. Backlog: <a href=\"#\" data-go=\"cu6\">CU-06-backlog.md<\/a>.<\/p>"}, {"id": "rf7", "tipo": "rf", "codigo": "RF-07", "titulo": "Consultar la bitácora", "corto": "Consultar la bitácora", "abstract": "El sistema debe permitir que la dueña consulte la bitácora de operaciones: ver los registros de la más reciente a la más antigua, filtrarlos por persona, rango de fechas y tipo de operación, y ver el detalle de cada registro. La consulta es de solo lectura y nadie más que la dueña puede hacerla.", "chips": ["Actores: dueña (consulta), cajera (autora de operaciones registradas; no consulta)"], "rnfs": ["rnf2", "rnf3"], "rfs": [], "realiza": null, "realizaEn": [], "html": "<h2>Descripción<\/h2>\n<p>El sistema debe permitir que la dueña consulte la bitácora de operaciones: ver los registros de la más reciente a la más antigua, filtrarlos por persona, rango de fechas y tipo de operación, y ver el detalle de cada registro. La consulta es de solo lectura y nadie más que la dueña puede hacerla.<\/p>\n<p><strong>Actores:<\/strong> dueña (consulta), cajera (autora de operaciones registradas; no consulta).<\/p>\n<h2>Necesidad<\/h2>\n<p>Corresponde al problema 1 de <span class=\"ref\">problema.md<\/span>: hace dos años Doña Marta tardó unos 4 meses en notar que un cajero anulaba ventas, porque no tenía forma rápida de saber quién hizo cada operación. RNF-02 manda registrar las operaciones sensibles y dice que la dueña las consulta desde el sistema; sin esta consulta, la bitácora existiría pero no serviría para detectar a tiempo una anomalía.<\/p>\n<h2>Proceso Actual<\/h2>\n<p>No hay bitácora. Para saber quién hizo una operación, Doña Marta revisa las grabaciones de las cámaras, un proceso lento y manual que tardó meses en descubrir el caso anterior.<\/p>\n<h2>Solución Propuesta<\/h2>\n<p>La dueña, con su sesión administrativa (ver <a href=\"#\" data-go=\"rf4\">RF-04<\/a>), abre la bitácora y ve los registros de la más reciente a la más antigua, en páginas de 50 <em>(supuesto)<\/em>. Puede filtrar por persona, por rango de fechas y por tipo de operación (los tipos que RNF-02 manda registrar), solos o combinados, y abrir un registro para ver su detalle: persona, fecha, hora y, cuando aplique, motivo, monto y cajera afectada. La aplicación no ofrece editar ni borrar registros, y consultar la bitácora no genera un registro propio <em>(supuesto)<\/em>. Los permisos se validan en el servidor: una cajera que llame a la consulta recibe acceso denegado.<\/p>\n<p><strong>Fuera de alcance de esta versión:<\/strong> exportar a archivo, gráficos o estadísticas, alertas automáticas y definir cuánto tiempo se conserva la bitácora (decisión pendiente de RNF-02).<\/p>\n<h2>Documentos de Referencia<\/h2>\n<ul>\n<li><span class=\"ref\">Caso Minisúper La Esquina, secciones 5.1 y 5.2<\/span><\/li>\n<li><span class=\"ref\">Descripción del problema<\/span><\/li>\n<li><span class=\"ref\">Arquitectura<\/span><\/li>\n<\/ul>\n<h2>Casos de Uso Relacionados<\/h2>\n<ul>\n<li><a href=\"#\" data-go=\"cu7\">CU-07 Consultar la bitácora<\/a><\/li>\n<\/ul>\n<h2>Criterios de Aceptación<\/h2>\n<ol>\n<li>La dueña ve los registros de la más reciente a la más antigua, con persona, fecha, hora y tipo de operación, en páginas de 50 registros <em>(supuesto)<\/em>, y puede pasar de una página a otra.<\/li>\n<li>La dueña puede filtrar por persona y por tipo de operación, solos o combinados; los tipos disponibles son exactamente los de RNF-02.<\/li>\n<li>Si ningún registro cumple los filtros, el sistema indica que no hay registros y mantiene los filtros a la vista.<\/li>\n<li>La dueña puede filtrar por rango de fechas (ambos días incluidos); si la fecha de inicio es posterior a la de fin, el sistema rechaza el rango y no cambia la lista.<\/li>\n<li>La dueña puede abrir un registro y ver su detalle: persona, fecha, hora y, cuando aplique, motivo, monto y cajera afectada; el detalle no incluye PIN.<\/li>\n<li>La aplicación no ofrece editar ni borrar registros, y consultar la bitácora no agrega ningún registro a ella <em>(supuesto)<\/em> (ver RNF-02).<\/li>\n<li>Solo la dueña consulta la bitácora; si una cajera lo intenta, el servidor responde acceso denegado, y si no hay sesión, autenticación requerida; en ambos casos no se devuelve ningún registro (ver RNF-03).<\/li>\n<li>Con 10 000 registros en la bitácora, la consulta con cualquier combinación de filtros responde en 2 segundos o menos <em>(supuesto)<\/em>.<\/li>\n<\/ol>\n<h2>Referencias<\/h2>\n<ul>\n<li><a href=\"#\" data-go=\"cu7\">CU-07<\/a><\/li>\n<li><a href=\"#\" data-go=\"cu7\">Backlog de CU-07<\/a><\/li>\n<li><a href=\"#\" data-go=\"rf4\">RF-04 Abrir y cerrar turno de caja<\/a><\/li>\n<li><a href=\"#\" data-go=\"rnf2\">RNF-02 Trazabilidad y auditoría<\/a><\/li>\n<li><a href=\"#\" data-go=\"rnf3\">RNF-03 Control de acceso y protección de credenciales<\/a><\/li>\n<\/ul>"}, {"id": "cu7", "tipo": "cu", "codigo": "CU-07", "titulo": "Consultar la bitácora", "corto": "Consultar la bitácora", "abstract": "Este caso de uso permite que la dueña vea las operaciones registradas en la bitácora, las filtre por persona, rango de fechas y tipo de operación, y abra el detalle de un registro, para detectar una anomalía en minutos y no en meses. La consulta es de solo lectura: nadie edita ni borra registros desde la aplicación.", "chips": ["Primarios: Dueña", "Secundarios: Cajera", "4 flujos alternativos"], "rnfs": ["rnf2", "rnf3"], "rfs": [], "rf": "rf7", "realiza": null, "realizaEn": [], "html": "<h2>Título del Caso de Uso<\/h2>\n<p>CU-07 Consultar la bitácora (atiende <a href=\"#\" data-go=\"rf7\">RF-07<\/a>)<\/p>\n<h2>Descripción<\/h2>\n<p>Este caso de uso permite que la dueña vea las operaciones registradas en la bitácora, las filtre por persona, rango de fechas y tipo de operación, y abra el detalle de un registro, para detectar una anomalía en minutos y no en meses. La consulta es de solo lectura: nadie edita ni borra registros desde la aplicación.<\/p>\n<h2>Actores<\/h2>\n<ul>\n<li><strong>Primarios<\/strong>: Dueña (consulta la bitácora)<\/li>\n<li><strong>Secundarios<\/strong>: Cajera (aparece como autora de operaciones registradas; no puede consultar la bitácora)<\/li>\n<\/ul>\n<h2>Precondiciones<\/h2>\n<ul>\n<li>La dueña tiene su sesión administrativa abierta (<a href=\"#\" data-go=\"cu4\">CU-04<\/a>, FA-07). No necesita que la caja esté abierta ni la abre.<\/li>\n<li>Las demás operaciones del sistema (<a href=\"#\" data-go=\"cu2\">CU-02<\/a>, <a href=\"#\" data-go=\"cu3\">CU-03<\/a>, <a href=\"#\" data-go=\"cu4\">CU-04<\/a>, <a href=\"#\" data-go=\"cu5\">CU-05<\/a> y <a href=\"#\" data-go=\"cu6\">CU-06<\/a>) ya escriben en la bitácora (RNF-02).<\/li>\n<\/ul>\n<h2>Postcondiciones<\/h2>\n<ul>\n<li>La dueña vio los registros que pidió; la bitácora no cambió.<\/li>\n<li>La consulta no genera un registro propio en la bitácora <em>(supuesto)<\/em>.<\/li>\n<li>Ninguna cajera obtuvo datos de la bitácora.<\/li>\n<\/ul>\n<h2>Flujo Principal<\/h2>\n<ol>\n<li>La dueña abre la bitácora y el sistema muestra los registros de la más reciente a la más antigua, con la persona, la fecha, la hora y el tipo de operación, en páginas de 50 registros <em>(supuesto)<\/em>. <span class=\"ref\">FA-03<\/span> <span class=\"ref\">FA-04<\/span><\/li>\n<li>La dueña filtra por persona, por rango de fechas, por tipo de operación o por una combinación. <span class=\"ref\">FA-02<\/span><\/li>\n<li>El sistema muestra solo los registros que cumplen todos los filtros elegidos, siempre de la más reciente a la más antigua. <span class=\"ref\">FA-01<\/span><\/li>\n<li>La dueña pasa a otra página de resultados cuando hay más de 50 registros.<\/li>\n<li>La dueña selecciona un registro y el sistema muestra su detalle: la persona, la fecha, la hora, el tipo de operación y, cuando aplique, el motivo, el monto y la cajera afectada.<\/li>\n<li>La dueña cierra el detalle o limpia los filtros y vuelve a la lista completa.<\/li>\n<\/ol>\n<p><strong>Tipos de operación disponibles como filtro<\/strong> (los de RNF-02): inicio de sesión de caja, cierre de sesión de caja, intento fallido de PIN, bloqueo de PIN, solicitud de anulación, autorización de anulación, rechazo de anulación, caducidad de anulación, anulación directa de la dueña, autorización de fiado, rechazo de fiado, caducidad de fiado, cierre forzado de turno, inicio de sesión administrativa, administración de cajeras (crear, inactivar, desbloquear PIN y reasignar PIN) y cierre del día.<\/p>\n<h2>Flujos Alternativos<\/h2>\n<h3>FA-01: Sin resultados<\/h3>\n<ol>\n<li>Ningún registro cumple los filtros elegidos.<\/li>\n<li>El sistema indica que no hay registros para esos filtros y mantiene los filtros a la vista para que la dueña los cambie.<\/li>\n<li>El caso de uso continúa en el paso 2 del flujo principal.<\/li>\n<\/ol>\n<h3>FA-02: Rango de fechas inválido<\/h3>\n<ol>\n<li>La dueña indica una fecha de inicio posterior a la fecha de fin.<\/li>\n<li>El sistema rechaza el rango, indica que la fecha de inicio no puede ser posterior a la de fin y conserva la lista que se mostraba.<\/li>\n<li>El caso de uso continúa en el paso 2 del flujo principal.<\/li>\n<\/ol>\n<h3>FA-03: Una cajera intenta consultar<\/h3>\n<ol>\n<li>Una cajera, con su sesión de turno abierta, intenta ver la bitácora o llama directamente a la API de consulta.<\/li>\n<li>El servidor rechaza la operación con acceso denegado, validado en el servidor, y no devuelve ningún registro.<\/li>\n<li>El caso de uso termina.<\/li>\n<\/ol>\n<h3>FA-04: Solicitud sin sesión<\/h3>\n<ol>\n<li>Se intenta consultar la bitácora sin ninguna sesión.<\/li>\n<li>El servidor responde que se requiere autenticación y no devuelve ningún registro.<\/li>\n<li>El caso de uso termina.<\/li>\n<\/ol>\n<h2>Prototipos<\/h2>\n<p>Boceto de baja fidelidad de la bitácora:<\/p>\n<pre><code class=\"language-text\">+-----------------------------------------------------------------------+\n| Bitácora                                      Sesión: Doña Marta      |\n| Persona [Todas v]   Tipo [Todos v]                                    |\n| Desde [__/__/____]  Hasta [__/__/____]       [Filtrar] [Limpiar]      |\n|                                                                       |\n| Fecha        Hora   Persona      Tipo de operación                    |\n| 19/10/2026   14:35  Doña Marta   Autorización de anulación            |\n| 19/10/2026   14:32  Yendry       Solicitud de anulación               |\n| 19/10/2026   09:02  Katherine    Intento fallido de PIN               |\n| ...                                                                   |\n| Página 1 de 7                          [&lt; Anterior] [Siguiente &gt;]     |\n+-----------------------------------------------------------------------+\n| Detalle: 19/10/2026 14:35 · Doña Marta · Autorización de anulación    |\n| Motivo: cliente devolvió el producto · Monto: ₡12 500                 |\n+-----------------------------------------------------------------------+\n<\/code><\/pre>\n<h2>Requerimientos Especiales<\/h2>\n<ul>\n<li><strong>Seguridad<\/strong> (RNF-03): solo la dueña consulta la bitácora; el permiso se valida en el servidor en cada consulta, no solo en la pantalla.<\/li>\n<li><strong>Seguridad<\/strong> (RNF-02): la bitácora es de solo lectura desde la aplicación; no hay operación de editar ni de borrar registros.<\/li>\n<li><strong>Rendimiento<\/strong> <em>(supuesto)<\/em>: la consulta, con cualquier combinación de filtros, responde en 2 segundos o menos con 10 000 registros en la bitácora. Es lo que permite cumplir la justificación de RNF-02: detectar una anomalía en minutos y no en meses.<\/li>\n<li><strong>Regla de negocio<\/strong> <em>(supuesto)<\/em>: la lista se muestra de la más reciente a la más antigua, en páginas de 50 registros.<\/li>\n<li><strong>Regla de negocio<\/strong> <em>(supuesto)<\/em>: consultar la bitácora no genera un registro propio en ella.<\/li>\n<li><strong>Regla de negocio<\/strong>: los tipos de operación del filtro son exactamente los que RNF-02 manda registrar.<\/li>\n<li><strong>Fuera de alcance<\/strong>: exportar a archivo, gráficos o estadísticas, alertas automáticas de operaciones sospechosas, y definir cuánto tiempo se conserva la bitácora (decisión pendiente de RNF-02).<\/li>\n<\/ul>\n<h2>Escenarios de Prueba<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Entrada<\/th>\n<th>Salida Esperada<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Flujo principal: la dueña abre la bitácora con 120 registros<\/td>\n<td>Ve los 50 más recientes, el más reciente primero, con persona, fecha, hora y tipo; indica la página 1 de 3<\/td>\n<\/tr>\n<tr>\n<td>Paso 4: la dueña pasa a la página 3<\/td>\n<td>Ve los 20 registros más antiguos<\/td>\n<\/tr>\n<tr>\n<td>Paso 2: filtrar por persona «Yendry»<\/td>\n<td>Solo aparecen registros de «Yendry», del más reciente al más antiguo<\/td>\n<\/tr>\n<tr>\n<td>Paso 2: filtrar por el tipo «Rechazo de fiado»<\/td>\n<td>Solo aparecen rechazos de fiado<\/td>\n<\/tr>\n<tr>\n<td>Paso 2: filtrar por «Katherine» y el tipo «Intento fallido de PIN» entre el 14/10/2026 y el 18/10/2026<\/td>\n<td>Solo aparecen los intentos fallidos de «Katherine» dentro de ese rango, ambos días incluidos<\/td>\n<\/tr>\n<tr>\n<td>Paso 5: abrir el registro de una autorización de anulación de ₡12 500<\/td>\n<td>El detalle muestra a «Doña Marta», la fecha, la hora, el motivo y ₡12 500<\/td>\n<\/tr>\n<tr>\n<td>Paso 5: abrir el registro de un inicio de sesión<\/td>\n<td>El detalle muestra persona, fecha y hora; no muestra motivo ni monto<\/td>\n<\/tr>\n<tr>\n<td>Paso 5: abrir el registro de una reasignación de PIN a «Yendry»<\/td>\n<td>El detalle muestra a «Doña Marta» y a «Yendry» como cajera afectada, y no contiene el PIN<\/td>\n<\/tr>\n<tr>\n<td>FA-01: filtrar por «Daniela» sin registros a su nombre<\/td>\n<td>Mensaje de que no hay registros para esos filtros; los filtros siguen a la vista<\/td>\n<\/tr>\n<tr>\n<td>FA-02: desde 18/10/2026 hasta 14/10/2026<\/td>\n<td>Rango rechazado con el mensaje de que el inicio no puede ser posterior al fin; la lista anterior no cambia<\/td>\n<\/tr>\n<tr>\n<td>FA-03: «Katherine» (cajera) llama directamente a la API de consulta<\/td>\n<td>Acceso denegado; no se devuelve ningún registro<\/td>\n<\/tr>\n<tr>\n<td>FA-04: llamar a la API de consulta sin sesión<\/td>\n<td>Respuesta de autenticación requerida<\/td>\n<\/tr>\n<tr>\n<td>Solo lectura: buscar en la aplicación cómo editar o borrar un registro<\/td>\n<td>La aplicación no ofrece esa operación y el registro permanece sin cambios<\/td>\n<\/tr>\n<tr>\n<td>Consultar la bitácora y volver a contar los registros<\/td>\n<td>La cantidad es la misma: la consulta no agregó ningún registro<\/td>\n<\/tr>\n<tr>\n<td>Rendimiento: con 10 000 registros, filtrar por persona y rango de fechas<\/td>\n<td>La respuesta tarda 2 segundos o menos<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Guiones de prueba (Gherkin):<\/strong> <span class=\"ref\">h1<\/span>, <span class=\"ref\">h2<\/span>, <span class=\"ref\">h3<\/span>, <span class=\"ref\">h4<\/span>, <span class=\"ref\">h5<\/span>, <span class=\"ref\">h6<\/span>, <span class=\"ref\">h7<\/span>. Backlog: <a href=\"#\" data-go=\"cu7\">CU-07-backlog.md<\/a>.<\/p>"}, {"id": "rf8", "tipo": "rf", "codigo": "RF-08", "titulo": "Autorizar operaciones sensibles con el PIN de la dueña", "corto": "Autorizar operaciones sensibles con el PIN de la dueña", "abstract": "El sistema debe exigir el PIN de la dueña para decidir cada operación sensible y, solo si el servidor comprueba que quien decide tiene rol de dueña y que el PIN es correcto, aplicar la decisión mediante una autorización de un solo uso, ligada a esa operación y de vigencia corta, y dejarla en la bitácora.", "chips": ["Actores: dueña (decide con su PIN), cajera (solicitó la operación y espera el resultado; nunca conoce ni ingresa el PIN de la dueña)"], "rnfs": ["rnf3"], "rfs": [], "realiza": "rnf3", "realizaEn": [], "html": "<h2>Descripción<\/h2>\n<p>El sistema debe exigir el PIN de la dueña para decidir cada operación sensible y, solo si el servidor comprueba que quien decide tiene rol de dueña y que el PIN es correcto, aplicar la decisión mediante una autorización de un solo uso, ligada a esa operación y de vigencia corta, y dejarla en la bitácora. Las operaciones sensibles son una lista cerrada: autorizar o rechazar un fiado mayor a ₡20 000 en espera, autorizar o rechazar una solicitud de anulación y anular directamente, forzar el cierre de un turno olvidado, crear cajeras, inactivarlas, desbloquear su PIN o reasignárselo, y cerrar el día.<\/p>\n<p><strong>Origen:<\/strong> RNF-03<\/p>\n<p><strong>Actores:<\/strong> dueña (decide con su PIN), cajera (solicitó la operación y espera el resultado; nunca conoce ni ingresa el PIN de la dueña).<\/p>\n<h2>Necesidad<\/h2>\n<p>Corresponde a los problemas 1 y 4 de <span class=\"ref\">problema.md<\/span>: hace dos años un cajero anuló ventas ya cobradas y nadie lo notó en unos 4 meses. <a href=\"#\" data-go=\"rnf3\">RNF-03<\/a> manda que los permisos se validen en el servidor y que el PIN se proteja, pero sin una operación funcional que lo realice, cada caso de uso tendría que resolver la autorización por su cuenta, con reglas distintas y huecos entre ellas. Este requerimiento concentra la autorización en un solo lugar para que sea igual de estricta en todas las operaciones sensibles, sin frenar el cobro de la cajera.<\/p>\n<h2>Proceso Actual<\/h2>\n<p>No hay autorización registrada. La cajera consulta a Doña Marta de palabra o con el cuaderno; las anulaciones se corrigen en la registradora sin dejar registro de quién las pidió ni quién las aprobó. Decisión pendiente: modelar con BPMN cómo se autoriza hoy una operación sensible, sin registro.<\/p>\n<h2>Solución Propuesta<\/h2>\n<p>Cuando una operación sensible queda pendiente, el sistema muestra a la dueña su detalle y le pide elegir su usuario e ingresar su PIN para autorizar o rechazar. El servidor valida el rol de dueña y el PIN y, si son correctos, emite una autorización de un solo uso, ligada a esa operación y válida 60 segundos <em>(supuesto)<\/em>. Con ella aplica la decisión, la deja consumida, registra en la bitácora la operación, la dueña, el resultado, la fecha y la hora, y devuelve el control al caso de uso que la solicitó. La cajera ve el resultado, pero nunca conoce ni ingresa el PIN de la dueña.<\/p>\n<p>Si el PIN es incorrecto, la dueña reintenta; al tercer intento fallido consecutivo el PIN se bloquea y se recupera fuera del sistema, por soporte técnico <em>(supuesto)<\/em>. Si quien decide no tiene rol de dueña, el servidor responde acceso denegado. Si la autorización venció o la operación ya no está vigente (caducó por el cierre del día o ya fue resuelta), el sistema pide repetir la operación. Una llamada directa a la API sin autorización vigente recibe acceso denegado, y sin sesión, autenticación requerida; todos estos intentos quedan en la bitácora.<\/p>\n<p>Consultar la bitácora (<a href=\"#\" data-go=\"rf7\">RF-07<\/a>) exige la sesión administrativa de la dueña, pero no pide el PIN por operación <em>(supuesto)<\/em>.<\/p>\n<p><strong>Fuera de alcance de esta versión:<\/strong> autorizar por otro medio (huella, tarjeta, aprobación a distancia), delegar la autorización en otra persona y desbloquear o reasignar el PIN de la dueña desde la aplicación.<\/p>\n<h2>Documentos de Referencia<\/h2>\n<ul>\n<li><span class=\"ref\">Caso Minisúper La Esquina, secciones 5.1 y 5.2<\/span><\/li>\n<li><span class=\"ref\">Descripción del problema<\/span><\/li>\n<li><span class=\"ref\">Arquitectura<\/span><\/li>\n<\/ul>\n<h2>Casos de Uso Relacionados<\/h2>\n<ul>\n<li><a href=\"#\" data-go=\"cu8\">CU-08 Autorizar una operación sensible con el PIN de la dueña<\/a><\/li>\n<li>Lo incluyen (relación «include»): <a href=\"#\" data-go=\"cu2\">CU-02 Vender a fiado<\/a>, <a href=\"#\" data-go=\"cu3\">CU-03 Anular venta<\/a>, <a href=\"#\" data-go=\"cu4\">CU-04 Identificar cajera en la caja (PIN)<\/a>, <a href=\"#\" data-go=\"cu5\">CU-05 Administrar cajeras<\/a> y <a href=\"#\" data-go=\"cu6\">CU-06 Cerrar el día<\/a><\/li>\n<\/ul>\n<h2>Criterios de Aceptación<\/h2>\n<ol>\n<li>Para decidir una operación sensible (las de la lista cerrada de la descripción), el sistema muestra a la dueña su detalle y le pide su PIN; con el rol de dueña y el PIN correctos, la decisión (autorizar o rechazar) se aplica y el control vuelve al caso de uso que la solicitó.<\/li>\n<li>La autorización es de un solo uso, está ligada a esa operación y vale 60 segundos <em>(supuesto)<\/em>; no se puede reutilizar ni usar para otra operación.<\/li>\n<li>Un PIN incorrecto no autoriza nada: el sistema permite reintentar y cuenta cada intento fallido consecutivo; un PIN correcto pone el contador en cero <em>(supuesto)<\/em>.<\/li>\n<li>Al tercer intento fallido consecutivo el PIN de la dueña se bloquea y se recupera fuera del sistema, por soporte técnico <em>(supuesto)<\/em>; la aplicación no ofrece desbloquearlo, y con el PIN bloqueado ni el PIN correcto autoriza.<\/li>\n<li>Si quien decide no tiene rol de dueña (por ejemplo, una cajera con su propio PIN), el servidor responde acceso denegado y la operación no cambia (ver RNF-03).<\/li>\n<li>Si la autorización venció o la operación ya no está vigente (caducó por el cierre del día o ya fue resuelta), el sistema no aplica nada y pide repetir la operación.<\/li>\n<li>Una llamada directa a la API sin autorización vigente recibe acceso denegado, y sin sesión, autenticación requerida; la operación no cambia (ver RNF-03).<\/li>\n<li>El PIN se guarda con hash y no aparece en registros del servidor ni en respuestas; la cajera nunca lo conoce ni lo ingresa.<\/li>\n<li>Cada decisión, intento fallido, bloqueo y acceso denegado queda en la bitácora con la persona, la operación, el resultado, la fecha y la hora, y la bitácora no se puede editar ni borrar desde la aplicación (ver RNF-02).<\/li>\n<li>Validar el PIN y emitir la autorización toma 3 segundos o menos <em>(supuesto)<\/em>.<\/li>\n<li>Los cinco casos de uso con operaciones sensibles (CU-02, CU-03, CU-04, CU-05 y CU-06) usan esta autorización en lugar de validar el PIN por su cuenta.<\/li>\n<\/ol>\n<h2>Referencias<\/h2>\n<ul>\n<li><a href=\"#\" data-go=\"cu8\">CU-08<\/a><\/li>\n<li><a href=\"#\" data-go=\"cu8\">Backlog de CU-08<\/a><\/li>\n<li><a href=\"#\" data-go=\"rf2\">RF-02 Vender a fiado<\/a><\/li>\n<li><a href=\"#\" data-go=\"rf3\">RF-03 Anular ventas con autorización<\/a><\/li>\n<li><a href=\"#\" data-go=\"rf4\">RF-04 Abrir y cerrar turno de caja<\/a><\/li>\n<li><a href=\"#\" data-go=\"rf5\">RF-05 Administrar cajeras<\/a><\/li>\n<li><a href=\"#\" data-go=\"rf6\">RF-06 Cerrar el día<\/a><\/li>\n<li><a href=\"#\" data-go=\"rnf2\">RNF-02 Trazabilidad y auditoría<\/a><\/li>\n<li><a href=\"#\" data-go=\"rnf3\">RNF-03 Control de acceso y protección de credenciales<\/a><\/li>\n<\/ul>"}, {"id": "cu8", "tipo": "cu", "codigo": "CU-08", "titulo": "Autorizar una operación sensible con el PIN de la dueña", "corto": "Autorizar una operación sensible con el PIN de la dueña", "abstract": "Este caso de uso es el paso común de control de acceso que usan todas las operaciones sensibles: la dueña revisa la operación pendiente, ingresa su PIN para decidirla (autorizar o rechazar), el servidor comprueba que quien decide tiene rol de dueña y que el PIN es correcto, emite una autorización de un solo uso ligada a esa operación,…", "chips": ["Primarios: Dueña", "Secundarios: Cajera", "5 flujos alternativos"], "rnfs": ["rnf3"], "rfs": [], "rf": "rf8", "realiza": "rnf3", "realizaEn": [], "html": "<h2>Título del Caso de Uso<\/h2>\n<p>CU-08 Autorizar una operación sensible con el PIN de la dueña (atiende <a href=\"#\" data-go=\"rf8\">RF-08<\/a>; realiza <a href=\"#\" data-go=\"rnf3\">RNF-03<\/a>)<\/p>\n<h2>Descripción<\/h2>\n<p>Este caso de uso es el paso común de control de acceso que usan todas las operaciones sensibles: la dueña revisa la operación pendiente, ingresa su PIN para decidirla (autorizar o rechazar), el servidor comprueba que quien decide tiene rol de dueña y que el PIN es correcto, emite una autorización de un solo uso ligada a esa operación, aplica la decisión y la deja en la bitácora. Es un caso de uso <strong>incluido<\/strong> por los casos que tienen una operación sensible (relación «include»): quien lo incluye lo invoca y recupera el control cuando termina. La cajera que solicitó la operación espera el resultado, pero nunca conoce ni ingresa el PIN de la dueña.<\/p>\n<p>Las operaciones sensibles son una lista cerrada:<\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Operación sensible<\/th>\n<th>Caso de uso que la incluye<\/th>\n<th>Decisión de la dueña<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Fiado mayor a ₡20 000 en espera de autorización<\/td>\n<td><a href=\"#\" data-go=\"cu2\">CU-02<\/a><\/td>\n<td>Autorizar o rechazar<\/td>\n<\/tr>\n<tr>\n<td>Solicitud de anulación de una venta<\/td>\n<td><a href=\"#\" data-go=\"cu3\">CU-03<\/a><\/td>\n<td>Autorizar o rechazar<\/td>\n<\/tr>\n<tr>\n<td>Anulación directa de una venta<\/td>\n<td><a href=\"#\" data-go=\"cu3\">CU-03<\/a><\/td>\n<td>Anular<\/td>\n<\/tr>\n<tr>\n<td>Forzar el cierre de un turno olvidado<\/td>\n<td><a href=\"#\" data-go=\"cu4\">CU-04<\/a><\/td>\n<td>Forzar el cierre<\/td>\n<\/tr>\n<tr>\n<td>Crear una cajera, inactivarla, desbloquear su PIN o reasignarle el PIN<\/td>\n<td><a href=\"#\" data-go=\"cu5\">CU-05<\/a><\/td>\n<td>Confirmar la acción<\/td>\n<\/tr>\n<tr>\n<td>Cerrar el día<\/td>\n<td><a href=\"#\" data-go=\"cu6\">CU-06<\/a><\/td>\n<td>Cerrar<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Consultar la bitácora (<a href=\"#\" data-go=\"cu7\">CU-07<\/a>) exige la sesión administrativa de la dueña, pero no pide el PIN por operación <em>(supuesto)<\/em>: es de solo lectura y no cambia el estado del negocio.<\/p>\n<h2>Actores<\/h2>\n<ul>\n<li><strong>Primarios<\/strong>: Dueña (decide con su PIN; su sesión es administrativa, no abre turno ni ocupa la caja)<\/li>\n<li><strong>Secundarios<\/strong>: Cajera (solicitó la operación y espera el resultado; nunca conoce ni ingresa el PIN de la dueña)<\/li>\n<\/ul>\n<h2>Precondiciones<\/h2>\n<ul>\n<li>Existe una operación sensible pendiente de decisión, solicitada por un caso de uso que incluye a este (<a href=\"#\" data-go=\"cu2\">CU-02<\/a>, <a href=\"#\" data-go=\"cu3\">CU-03<\/a>, <a href=\"#\" data-go=\"cu4\">CU-04<\/a>, <a href=\"#\" data-go=\"cu5\">CU-05<\/a> o <a href=\"#\" data-go=\"cu6\">CU-06<\/a>), y sigue vigente: no ha caducado ni se ha resuelto.<\/li>\n<li>La dueña tiene su usuario activo y su PIN no está bloqueado. Puede ingresar su PIN en la caja de una cajera (el turno sigue a nombre de la cajera) o desde su sesión administrativa (<a href=\"#\" data-go=\"cu4\">CU-04<\/a>, FA-07).<\/li>\n<\/ul>\n<h2>Postcondiciones<\/h2>\n<ul>\n<li>Si el PIN fue correcto y la persona tiene rol de dueña: la decisión (autorizar o rechazar) quedó aplicada sobre la operación, la autorización se consumió y no se puede reutilizar, y el control volvió al caso de uso que la solicitó.<\/li>\n<li>Si no se autorizó (PIN incorrecto, PIN bloqueado, persona sin rol de dueña, autorización vencida u operación no vigente): la operación no cambió.<\/li>\n<li>La bitácora registra la operación, la dueña, el resultado, la fecha y la hora; los intentos denegados también quedan registrados.<\/li>\n<li>El PIN no quedó en ningún registro ni respuesta, y la cajera no tuvo acceso a él.<\/li>\n<\/ul>\n<h2>Flujo Principal<\/h2>\n<ol>\n<li>El caso de uso que la incluye entrega al sistema la operación sensible pendiente y el sistema muestra a la dueña su detalle: tipo de operación, quién la solicitó, y los datos que la definen (por ejemplo venta, monto y motivo). <span class=\"ref\">FA-04<\/span><\/li>\n<li>La dueña elige su usuario e ingresa su PIN para decidir: autorizar o rechazar. <span class=\"ref\">FA-05<\/span><\/li>\n<li>El servidor valida que la persona tiene rol de dueña. <span class=\"ref\">FA-03<\/span><\/li>\n<li>El servidor valida que el PIN es correcto. <span class=\"ref\">FA-01<\/span> <span class=\"ref\">FA-02<\/span><\/li>\n<li>El servidor emite una autorización de un solo uso, ligada a esa operación y válida 60 segundos <em>(supuesto)<\/em>.<\/li>\n<li>El sistema aplica la decisión sobre la operación con esa autorización, que queda consumida. <span class=\"ref\">FA-04<\/span><\/li>\n<li>El sistema registra en la bitácora la operación, la dueña, el resultado (autorizada o rechazada), la fecha y la hora.<\/li>\n<li>El sistema devuelve el control al caso de uso que la solicitó, con el resultado, y este informa a la cajera si corresponde.<\/li>\n<\/ol>\n<h2>Flujos Alternativos<\/h2>\n<h3>FA-01: PIN incorrecto<\/h3>\n<ol>\n<li>El servidor rechaza el PIN e indica que es incorrecto, sin revelar cuántos dígitos acertó.<\/li>\n<li>El intento cuenta como fallido consecutivo y queda en la bitácora.<\/li>\n<li>La operación sigue pendiente y sin cambios.<\/li>\n<li>El caso de uso continúa en el paso 2 del flujo principal. Un PIN correcto pone en cero los intentos fallidos <em>(supuesto, coherente con <a href=\"#\" data-go=\"cu4\">CU-04<\/a>)<\/em>.<\/li>\n<\/ol>\n<h3>FA-02: Tercer intento fallido: el PIN de la dueña se bloquea<\/h3>\n<ol>\n<li>El servidor bloquea el PIN de la dueña al tercer intento fallido consecutivo <em>(supuesto)<\/em> y registra el bloqueo en la bitácora.<\/li>\n<li>El sistema indica que el PIN está bloqueado y que se recupera fuera del sistema, por soporte técnico <em>(supuesto, coherente con <a href=\"#\" data-go=\"cu4\">CU-04<\/a> FA-07 y <a href=\"#\" data-go=\"cu5\">CU-05<\/a>)<\/em>; la aplicación no ofrece desbloquearlo.<\/li>\n<li>La operación sigue pendiente y sin cambios; ni siquiera el PIN correcto la autoriza mientras el PIN siga bloqueado.<\/li>\n<li>El caso de uso termina.<\/li>\n<\/ol>\n<h3>FA-03: La persona no tiene rol de dueña<\/h3>\n<ol>\n<li>La persona que decide es una cajera (por ejemplo, ingresa su propio PIN en lugar del de la dueña).<\/li>\n<li>El servidor responde acceso denegado, aunque el PIN sea correcto para esa cajera, y el intento no cuenta contra el PIN de la dueña.<\/li>\n<li>El intento queda en la bitácora con la persona, la operación, la fecha y la hora.<\/li>\n<li>La operación sigue pendiente y sin cambios; el caso de uso termina.<\/li>\n<\/ol>\n<h3>FA-04: La autorización venció o la operación ya no está vigente<\/h3>\n<ol>\n<li>La autorización superó los 60 segundos <em>(supuesto)<\/em> antes de aplicarse, o la operación ya no está vigente: la solicitud caducó por el cierre del día (<a href=\"#\" data-go=\"cu6\">CU-06<\/a>) o ya fue resuelta.<\/li>\n<li>El sistema no aplica nada, descarta la autorización e informa que debe repetir la operación.<\/li>\n<li>Si la operación sigue vigente, la dueña repite el paso 2 del flujo principal con su PIN; si ya no lo está, el caso de uso termina.<\/li>\n<\/ol>\n<h3>FA-05: Llamada directa a la API sin autorización vigente o sin sesión<\/h3>\n<ol>\n<li>Alguien llama directamente a la API para aplicar una operación sensible sin una autorización vigente, ligada a esa operación.<\/li>\n<li>Si no hay sesión, el servidor responde que se requiere autenticación. Si hay sesión sin autorización vigente (por ejemplo, la de una cajera), responde acceso denegado.<\/li>\n<li>El intento queda en la bitácora; la operación no cambia.<\/li>\n<li>El caso de uso termina.<\/li>\n<\/ol>\n<h2>Prototipos<\/h2>\n<p>Boceto de baja fidelidad de la ventana de autorización con PIN, mostrada sobre la pantalla del caso que la incluye:<\/p>\n<pre><code class=\"language-text\">+------------------------------------------------------------+\n| Autorizar operación sensible                                |\n|                                                             |\n| Operación: Fiado mayor a ₡20 000                            |\n| Solicitó:  Yendry        Cliente: Juan Mora                 |\n| Monto:     ₡25 000       Crédito disponible: ₡40 000        |\n|                                                             |\n| Usuario: [Doña Marta v]    PIN: [ • • • • ]                 |\n|                                                             |\n| [Autorizar]  [Rechazar]  [Cancelar]                         |\n+------------------------------------------------------------+\n| PIN incorrecto. Intento 1 de 3.                             |\n+------------------------------------------------------------+\n<\/code><\/pre>\n<h2>Requerimientos Especiales<\/h2>\n<ul>\n<li><strong>Seguridad<\/strong> (RNF-03): el PIN se guarda con hash y no aparece en registros del servidor ni en respuestas; la cajera nunca lo conoce ni lo ingresa.<\/li>\n<li><strong>Seguridad<\/strong> (RNF-03): el rol de dueña, el PIN y el límite de 3 intentos se validan en el servidor, no solo en la interfaz; una llamada directa a la API sin autorización vigente recibe acceso denegado, y sin sesión, autenticación requerida.<\/li>\n<li><strong>Seguridad<\/strong> (RNF-03): la autorización es de un solo uso, está ligada a una única operación y no sirve para otra ni se puede reutilizar.<\/li>\n<li><strong>Seguridad<\/strong> (RNF-02): toda decisión, intento fallido, bloqueo y acceso denegado queda en la bitácora con persona, fecha y hora; la bitácora no se puede editar ni borrar desde la aplicación.<\/li>\n<li><strong>Rendimiento<\/strong> (RNF-01, <em>supuesto<\/em>): validar el PIN y emitir la autorización toma 3 segundos o menos.<\/li>\n<li><strong>Regla de negocio<\/strong> <em>(supuesto)<\/em>: la autorización vale 60 segundos desde que se emite y se consume al aplicar la decisión.<\/li>\n<li><strong>Regla de negocio<\/strong>: las operaciones sensibles son exactamente las de la tabla de la descripción; agregar otra exige modificar este caso de uso.<\/li>\n<li><strong>Regla de negocio<\/strong> <em>(supuesto)<\/em>: consultar la bitácora (<a href=\"#\" data-go=\"cu7\">CU-07<\/a>) exige la sesión administrativa de la dueña, pero no su PIN por operación.<\/li>\n<li><strong>Regla de negocio<\/strong>: este caso de uso solo valida y registra la autorización; el efecto de cada operación (cobrar el fiado, anular la venta, cerrar el turno, crear o cambiar una cajera, cerrar el día) lo define el caso de uso que la incluye.<\/li>\n<li><strong>Regla de negocio<\/strong>: reutiliza los intentos fallidos y el bloqueo de PIN de <a href=\"#\" data-go=\"cu4\">CU-04<\/a>; el PIN de la dueña no se desbloquea ni se reasigna desde la aplicación.<\/li>\n<li><strong>Decisión pendiente<\/strong>: los tipos de registro propios de este caso (autorización con PIN y acceso denegado a una operación sensible) no están en el catálogo de tipos de RNF-02 ni en el filtro de <a href=\"#\" data-go=\"cu7\">CU-07<\/a>; el profesor decide si se agregan o se reutilizan los tipos existentes.<\/li>\n<li><strong>Relaciones («include»)<\/strong>: este caso de uso es incluido por <a href=\"#\" data-go=\"cu2\">CU-02<\/a>, <a href=\"#\" data-go=\"cu3\">CU-03<\/a>, <a href=\"#\" data-go=\"cu4\">CU-04<\/a>, <a href=\"#\" data-go=\"cu5\">CU-05<\/a> y <a href=\"#\" data-go=\"cu6\">CU-06<\/a>.<\/li>\n<li><strong>Fuera de alcance<\/strong>: autorizar por otro medio (huella, tarjeta, aprobación a distancia), delegar la autorización en otra persona y desbloquear o reasignar el PIN de la dueña desde la aplicación.<\/li>\n<\/ul>\n<h2>Escenarios de Prueba<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Entrada<\/th>\n<th>Salida Esperada<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Flujo principal: «Doña Marta» ingresa su PIN correcto y autoriza el fiado de ₡25 000 de «Juan Mora» solicitado por «Yendry»<\/td>\n<td>El servidor emite una autorización de 60 s ligada a ese fiado, el fiado se cobra a crédito, la autorización queda consumida y el control vuelve a CU-02<\/td>\n<\/tr>\n<tr>\n<td>Flujo principal: «Doña Marta» ingresa su PIN correcto y rechaza la solicitud de anulación de la venta #1042<\/td>\n<td>La decisión se aplica como rechazo, la venta sigue cobrada y el control vuelve a CU-03<\/td>\n<\/tr>\n<tr>\n<td>Flujo principal: autorización con PIN de «Doña Marta» para la operación del paso 1<\/td>\n<td>La bitácora registra la operación, a «Doña Marta», el resultado, la fecha y la hora, sin el PIN<\/td>\n<\/tr>\n<tr>\n<td>Flujo principal: «Yendry» espera el resultado de su solicitud<\/td>\n<td>Ve que fue autorizada o rechazada, pero en ningún momento ve ni ingresa el PIN de la dueña<\/td>\n<\/tr>\n<tr>\n<td>Flujo principal: la dueña autoriza forzar el cierre del turno de «Katherine»<\/td>\n<td>El turno de «Katherine» se cierra y la autorización queda consumida<\/td>\n<\/tr>\n<tr>\n<td>FA-01: «Doña Marta» ingresa un PIN incorrecto<\/td>\n<td>Mensaje de PIN incorrecto, un intento fallido en la bitácora y la operación sigue pendiente<\/td>\n<\/tr>\n<tr>\n<td>FA-01: PIN incorrecto y luego el PIN correcto<\/td>\n<td>La operación se autoriza y los intentos fallidos vuelven a cero<\/td>\n<\/tr>\n<tr>\n<td>FA-02: tres PIN incorrectos consecutivos de «Doña Marta»<\/td>\n<td>El PIN se bloquea, el bloqueo queda en la bitácora y se indica que se recupera por soporte técnico<\/td>\n<\/tr>\n<tr>\n<td>FA-02: PIN bloqueado y luego el PIN correcto<\/td>\n<td>La operación no se autoriza y sigue pendiente<\/td>\n<\/tr>\n<tr>\n<td>FA-03: «Katherine» elige su usuario e ingresa su propio PIN correcto<\/td>\n<td>Acceso denegado; la operación sigue pendiente y el intento queda en la bitácora<\/td>\n<\/tr>\n<tr>\n<td>FA-03: «Katherine» ingresa su PIN para autorizar su propia solicitud<\/td>\n<td>Acceso denegado y los intentos de «Doña Marta» no cambian<\/td>\n<\/tr>\n<tr>\n<td>FA-04: la autorización de 60 s se aplica a los 75 s<\/td>\n<td>No se aplica nada; el sistema pide repetir la operación<\/td>\n<\/tr>\n<tr>\n<td>FA-04: la dueña intenta autorizar una solicitud de anulación que caducó por el cierre del día<\/td>\n<td>No se aplica nada; el sistema informa que la solicitud ya no está vigente<\/td>\n<\/tr>\n<tr>\n<td>FA-04: la dueña intenta autorizar una solicitud que ya había rechazado<\/td>\n<td>No se aplica nada; la solicitud ya fue resuelta<\/td>\n<\/tr>\n<tr>\n<td>FA-05: «Yendry» llama a la API para forzar un cierre de turno sin autorización vigente<\/td>\n<td>Acceso denegado, el intento queda en la bitácora y nada cambia<\/td>\n<\/tr>\n<tr>\n<td>FA-05: llamar a la API para cerrar el día sin sesión<\/td>\n<td>Respuesta de autenticación requerida y el intento queda en la bitácora<\/td>\n<\/tr>\n<tr>\n<td>Seguridad: reutilizar la autorización ya consumida del fiado para otra operación<\/td>\n<td>Acceso denegado; la autorización no se puede reutilizar<\/td>\n<\/tr>\n<tr>\n<td>Seguridad: usar la autorización de la anulación de la venta #1042 para anular la venta #1050<\/td>\n<td>Acceso denegado; la autorización está ligada a una sola operación<\/td>\n<\/tr>\n<tr>\n<td>Seguridad: buscar el PIN en los registros del servidor y en las respuestas de la API<\/td>\n<td>No aparece en ninguno<\/td>\n<\/tr>\n<tr>\n<td>Rendimiento: validar el PIN y emitir la autorización<\/td>\n<td>Toma 3 segundos o menos <em>(supuesto)<\/em><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Guiones de prueba (Gherkin):<\/strong> <span class=\"ref\">h1<\/span>, <span class=\"ref\">h2<\/span>, <span class=\"ref\">h3<\/span>, <span class=\"ref\">h4<\/span>, <span class=\"ref\">h5<\/span>, <span class=\"ref\">h6<\/span>, <span class=\"ref\">h7<\/span>, <span class=\"ref\">h8<\/span>, <span class=\"ref\">h9<\/span>, <span class=\"ref\">h10<\/span>, <span class=\"ref\">h11<\/span>, <span class=\"ref\">h12<\/span>, <span class=\"ref\">h13<\/span>, <span class=\"ref\">h14<\/span>. Backlog: <a href=\"#\" data-go=\"cu8\">CU-08-backlog.md<\/a>.<\/p>"}, {"id": "rnf1", "tipo": "rnf", "codigo": "RNF-01", "titulo": "Usabilidad en caja", "corto": "Usabilidad en caja", "abstract": "Los viernes de quincena y los sábados en la mañana se forman filas largas en el Minisúper La Esquina porque hay una sola caja y todo se calcula a mano. Doña Marta sospecha que pierde clientes frente a un supermercado de cadena cercano.", "chips": ["Estatus: Propuesto", "Condiciona a 3 requerimientos funcionales"], "rnfs": [], "rfs": ["rf1", "rf3", "rf4"], "realiza": null, "realizaEn": [], "html": "<h2>Estatus<\/h2>\n<p>Propuesto<\/p>\n<h2>Contexto<\/h2>\n<p>Los viernes de quincena y los sábados en la mañana se forman filas largas en el Minisúper La Esquina porque hay una sola caja y todo se calcula a mano. Doña Marta sospecha que pierde clientes frente a un supermercado de cadena cercano. Además, ni ella ni las cajeras se sienten cómodas con tecnología compleja, y la cajera Yendry teme que cualquier control adicional haga todo más lento (ver <span class=\"ref\">problema.md<\/span>, problemas 2 y 4).<\/p>\n<h2>Requerimiento<\/h2>\n<p>En la pantalla de caja, con una cajera con práctica y un lector de código de barras:<\/p>\n<ol>\n<li>Vender un producto en efectivo requiere <strong>4 acciones o menos<\/strong> (teclado o ratón).<\/li>\n<li>Una venta de <strong>5 productos<\/strong> en efectivo, desde iniciarla hasta emitir el comprobante, toma <strong>60 s o menos<\/strong>.<\/li>\n<li>La identificación con PIN toma <strong>3 s o menos<\/strong> y se pide <strong>una sola vez por turno<\/strong>, no por venta.<\/li>\n<li>Solicitar la anulación de una venta toma <strong>3 acciones o menos<\/strong>.<\/li>\n<li>Cada operación del servidor de una venta responde en <strong>menos de 500 ms<\/strong>.<\/li>\n<li>Los mensajes de error dicen qué pasó y qué hacer, sin términos técnicos.<\/li>\n<\/ol>\n<p><em>Todas las cifras son supuestos del ejercicio; se validan con una prueba de usabilidad con una cajera.<\/em><\/p>\n<h2>Justificación<\/h2>\n<p>El control de quién hace cada operación (RNF-02 y RNF-03) solo es aceptable para el negocio si no alarga el cobro en las horas de mayor demanda. Los valores se eligieron para que el sistema sea claramente más rápido que calcular con calculadora, y para que la identificación sea casi invisible.<\/p>\n<h2>Implicaciones<\/h2>\n<ul>\n<li>El diseño de la pantalla de caja se orienta al teclado y al lector de código de barras.<\/li>\n<li>La sesión debe permanecer abierta todo el turno; por eso se necesita bloqueo por inactividad en lugar de un PIN por venta.<\/li>\n<li>Hay que medir tiempos con una prueba de usabilidad y con pruebas de rendimiento de los endpoints de venta.<\/li>\n<\/ul>\n<h2>Alternativas Consideradas<\/h2>\n<ol>\n<li><strong>Segunda caja con registradora básica:<\/strong> no resuelve el cálculo manual ni la falta de registro.<\/li>\n<li><strong>Pedir el PIN en cada venta:<\/strong> da la mejor trazabilidad, pero rompe la meta de 3 s por turno y alarga la fila.<\/li>\n<li><strong>Tarjeta de proximidad en lugar de PIN:<\/strong> más rápida, pero implica comprar hardware, que el negocio no puede pagar por ahora. Se evalúa en el spike de CU-04.<\/li>\n<\/ol>\n<h2>Decisión<\/h2>\n<p>Pantalla de caja orientada a teclado y lector, identificación con PIN corto una vez por turno y bloqueo por inactividad. La decisión sobre el mecanismo queda sujeta al spike de CU-04.<\/p>\n<h2>Requerimientos funcionales implicados<\/h2>\n<ul>\n<li>RF-01 Registrar ventas en caja<\/li>\n<li>CU-01 Registrar venta en caja<\/li>\n<li>RF-03 Anular ventas con autorización<\/li>\n<li>CU-03 Anular venta<\/li>\n<li>RF-04 Abrir y cerrar turno de caja (identificar a la cajera)<\/li>\n<li>CU-04 Abrir y cerrar turno de caja<\/li>\n<\/ul>\n<h2>Referencias<\/h2>\n<ul>\n<li><span class=\"ref\">Descripción del problema<\/span><\/li>\n<li><span class=\"ref\">Arquitectura: características arquitectónicas<\/span><\/li>\n<li>Historias que lo verifican: CU-01 H8, CU-03 H8 y CU-04 H11 en <span class=\"ref\">backlog<\/span><\/li>\n<\/ul>"}, {"id": "rnf2", "tipo": "rnf", "codigo": "RNF-02", "titulo": "Trazabilidad y auditoría", "corto": "Trazabilidad y auditoría", "abstract": "Hace dos años un cajero anuló ventas ya cobradas en efectivo y hizo descuentos no autorizados. Doña Marta tardó unos 4 meses en notarlo, revisando grabaciones, y perdió cerca de ₡350 000. Desde entonces le preocupa no poder saber rápido «quién hizo qué» (ver problema.md, problema 1).", "chips": ["Estatus: Propuesto", "Condiciona a 7 requerimientos funcionales"], "rnfs": [], "rfs": ["rf0", "rf2", "rf3", "rf4", "rf5", "rf6", "rf7"], "realiza": null, "realizaEn": [], "html": "<h2>Estatus<\/h2>\n<p>Propuesto<\/p>\n<h2>Contexto<\/h2>\n<p>Hace dos años un cajero anuló ventas ya cobradas en efectivo y hizo descuentos no autorizados. Doña Marta tardó unos 4 meses en notarlo, revisando grabaciones, y perdió cerca de ₡350 000. Desde entonces le preocupa no poder saber rápido «quién hizo qué» (ver <span class=\"ref\">problema.md<\/span>, problema 1).<\/p>\n<h2>Requerimiento<\/h2>\n<p>El sistema debe registrar en una <strong>bitácora<\/strong> las siguientes operaciones, cada una con <strong>persona, fecha, hora<\/strong> y, cuando aplique, <strong>motivo y monto<\/strong>:<\/p>\n<ul>\n<li>Inicio y cierre de sesión de caja.<\/li>\n<li>Intentos fallidos de PIN y bloqueos.<\/li>\n<li>Solicitud, autorización y rechazo de una anulación, y anulación directa de la dueña.<\/li>\n<li>Autorización y rechazo de un fiado mayor a ₡20 000 <em>(supuesto)<\/em>.<\/li>\n<li>Cierre forzado de un turno por la dueña, inicio de su sesión administrativa y operaciones de administración de cajeras (crear, inactivar, desbloquear y reasignar PIN).<\/li>\n<li>Cierre del día y caducidad de las solicitudes pendientes de anulación y de fiado.<\/li>\n<li>Alta de un producto, cambio de precio (con el precio anterior y el nuevo) y movimiento de existencias (con las existencias antes y después y el motivo).<\/li>\n<\/ul>\n<p>La bitácora es <strong>de solo inserción<\/strong>: la aplicación no ofrece editar ni borrar registros. En una prueba, el <strong>100 %<\/strong> de las operaciones listadas debe aparecer en la bitácora.<\/p>\n<h2>Justificación<\/h2>\n<p>El problema no fue la falta de grabación (las cámaras sí lo captaron), sino la imposibilidad de saberlo a tiempo. Una bitácora consultable por la dueña reduce de meses a minutos el tiempo para detectar una anomalía, y desalienta la conducta por el solo hecho de saber que queda registrada.<\/p>\n<h2>Implicaciones<\/h2>\n<ul>\n<li>Se necesita un servicio de bitácora reutilizable por CU-02, CU-03, CU-04 y CU-09 a CU-11.<\/li>\n<li>La bitácora crece de forma continua; hay que definir cuánto tiempo se conserva <em>(decisión pendiente)<\/em>.<\/li>\n<li>El registro no debe ensuciar la lógica de ventas (candidatos: Observer o Decorator).<\/li>\n<\/ul>\n<h2>Alternativas Consideradas<\/h2>\n<ol>\n<li><strong>Depender de las cámaras:<\/strong> ya existen, pero la revisión es lenta y manual.<\/li>\n<li><strong>Registros del servidor (logs):<\/strong> no son consultables por la dueña ni distinguen operaciones del negocio.<\/li>\n<li><strong>Confirmar la identidad en cada venta:<\/strong> da trazabilidad completa, pero choca con RNF-01.<\/li>\n<\/ol>\n<h2>Decisión<\/h2>\n<p>Bitácora de solo inserción en la base de datos, alimentada por un servicio único que usan todos los casos de uso. La dueña la consulta desde el sistema con <a href=\"#\" data-go=\"cu7\">CU-07<\/a> (solo lectura, filtrable por persona, fechas y tipo de operación).<\/p>\n<h2>Requerimientos funcionales implicados<\/h2>\n<ul>\n<li>RF-00 Administrar inventario<\/li>\n<li>CU-09 Registrar producto<\/li>\n<li>CU-10 Cambiar el precio de un producto<\/li>\n<li>CU-11 Registrar movimiento de existencias<\/li>\n<li>RF-02 Vender a fiado<\/li>\n<li>CU-02 Vender a fiado<\/li>\n<li>RF-03 Anular ventas con autorización<\/li>\n<li>CU-03 Anular venta<\/li>\n<li>RF-04 Abrir y cerrar turno de caja (identificar a la cajera)<\/li>\n<li>CU-04 Abrir y cerrar turno de caja<\/li>\n<li>RF-05 Administrar cajeras<\/li>\n<li>CU-05 Administrar cajeras<\/li>\n<li>RF-06 Cerrar el día<\/li>\n<li>CU-06 Cerrar el día<\/li>\n<li>RF-07 Consultar la bitácora<\/li>\n<li>CU-07 Consultar la bitácora<\/li>\n<\/ul>\n<h2>Referencias<\/h2>\n<ul>\n<li><span class=\"ref\">Descripción del problema<\/span><\/li>\n<li><a href=\"#\" data-go=\"cu7\">CU-07 Consultar la bitácora<\/a>: cómo la dueña consulta la bitácora<\/li>\n<li>Historias que lo verifican: CU-02 H6, CU-03 H7, CU-04 H10, CU-05 H6, CU-06 H6, CU-07 H6 y CU-07 H7 en <span class=\"ref\">backlog<\/span><\/li>\n<\/ul>"}, {"id": "rnf3", "tipo": "rnf", "codigo": "RNF-03", "titulo": "Control de acceso y protección de credenciales", "corto": "Control de acceso y protección de credenciales", "abstract": "Las operaciones sensibles (anular ventas, autorizar fiados, desbloquear PIN, crear cajeras) solo deben poder hacerlas la dueña. Una cajera con un PIN robado o adivinado, o con conocimientos técnicos, no debe poder hacerse pasar por otra persona ni saltarse los permisos (ver problema.md, problemas 1 y 4).", "chips": ["Estatus: Propuesto", "Condiciona a 7 requerimientos funcionales"], "rnfs": [], "rfs": ["rf0", "rf3", "rf4", "rf5", "rf6", "rf7", "rf8"], "realiza": null, "realizaEn": ["cu8"], "html": "<h2>Estatus<\/h2>\n<p>Propuesto<\/p>\n<h2>Contexto<\/h2>\n<p>Las operaciones sensibles (anular ventas, autorizar fiados, desbloquear PIN, crear cajeras) solo deben poder hacerlas la dueña. Una cajera con un PIN robado o adivinado, o con conocimientos técnicos, no debe poder hacerse pasar por otra persona ni saltarse los permisos (ver <span class=\"ref\">problema.md<\/span>, problemas 1 y 4).<\/p>\n<h2>Requerimiento<\/h2>\n<ol>\n<li>Los permisos por rol (cajera o dueña) se validan <strong>en el servidor<\/strong> en cada operación; ocultar un botón en la pantalla no cuenta como control.<\/li>\n<li>El PIN se guarda <strong>con hash<\/strong>, nunca en texto plano, y no aparece en registros del servidor ni en respuestas.<\/li>\n<li>El PIN tiene de <strong>4 a 6 dígitos<\/strong> <em>(supuesto)<\/em> y se <strong>bloquea tras 3 intentos fallidos consecutivos<\/strong>; solo la dueña lo desbloquea.<\/li>\n<li>El token de sesión <strong>expira al cerrar el turno<\/strong> y la pantalla se bloquea tras <strong>5 minutos<\/strong> de inactividad <em>(supuesto)<\/em>.<\/li>\n<li>La sesión de la <strong>dueña<\/strong> es administrativa: no abre turno ni ocupa la caja, y con su PIN autoriza operaciones y administra cajeras. Solo la dueña cierra el día, crea cajeras y desbloquea o reasigna PIN, siempre validado en el servidor.<\/li>\n<li>En una prueba, una cajera que llame directamente a la API de autorización recibe <strong>acceso denegado<\/strong> y una solicitud sin sesión recibe <strong>autenticación requerida<\/strong>.<\/li>\n<\/ol>\n<h2>Justificación<\/h2>\n<p>El caso de Esteban mostró que quien tiene acceso a la caja puede abusar de él. Para que la bitácora (RNF-02) sea creíble, cada acción debe estar atada a una identidad que nadie pueda suplantar con facilidad, y los permisos deben sostenerse aunque alguien omita la interfaz.<\/p>\n<h2>Implicaciones<\/h2>\n<ul>\n<li>Se usa Spring Security y una política de roles en el servidor.<\/li>\n<li>Hay que probar la seguridad llamando a la API sin pasar por la pantalla.<\/li>\n<li>El bloqueo por inactividad exige conservar la venta abierta en el servidor mientras la pantalla está bloqueada.<\/li>\n<\/ul>\n<h2>Alternativas Consideradas<\/h2>\n<ol>\n<li><strong>Contraseña larga por usuario:<\/strong> más segura, pero demasiado lenta para la caja (choca con RNF-01).<\/li>\n<li><strong>Tarjeta de proximidad:<\/strong> buena velocidad, pero requiere hardware que el negocio no puede pagar por ahora.<\/li>\n<li><strong>Validar permisos solo en la interfaz:<\/strong> descartada, porque se evade con una llamada directa a la API.<\/li>\n<\/ol>\n<h2>Decisión<\/h2>\n<p>PIN corto con hash, bloqueo por intentos, roles validados en el servidor y token de sesión con expiración al cerrar el turno. Pendiente de confirmación por el spike de CU-04.<\/p>\n<h2>Requerimientos funcionales implicados<\/h2>\n<ul>\n<li>RF-00 Administrar inventario<\/li>\n<li>CU-09 Registrar producto<\/li>\n<li>CU-10 Cambiar el precio de un producto<\/li>\n<li>CU-11 Registrar movimiento de existencias<\/li>\n<li>RF-03 Anular ventas con autorización<\/li>\n<li>CU-03 Anular venta<\/li>\n<li>RF-04 Abrir y cerrar turno de caja (identificar a la cajera)<\/li>\n<li>CU-04 Abrir y cerrar turno de caja<\/li>\n<li>RF-05 Administrar cajeras<\/li>\n<li>CU-05 Administrar cajeras<\/li>\n<li>RF-06 Cerrar el día<\/li>\n<li>CU-06 Cerrar el día<\/li>\n<li>RF-07 Consultar la bitácora<\/li>\n<li>CU-07 Consultar la bitácora (solo la dueña consulta, validado en el servidor)<\/li>\n<li>RF-08 Autorizar operaciones sensibles con el PIN de la dueña (realiza este requerimiento)<\/li>\n<li>CU-08 Autorizar una operación sensible con el PIN de la dueña (realiza este requerimiento; lo incluyen CU-02, CU-03, CU-04, CU-05 y CU-06)<\/li>\n<\/ul>\n<h2>Referencias<\/h2>\n<ul>\n<li><a href=\"https://cheatsheetseries.owasp.org/cheatsheets/Authentication_Cheat_Sheet.html\" target=\"_blank\" rel=\"noopener\">OWASP Authentication Cheat Sheet<\/a><\/li>\n<li><span class=\"ref\">Arquitectura<\/span><\/li>\n<li>Historias que lo verifican: CU-03 H6, CU-04 H3, CU-04 H9, CU-05 H5, CU-06 H5, CU-07 H5 y CU-08 (H3, H4, H6 y H7) en <span class=\"ref\">backlog<\/span><\/li>\n<\/ul>"}], "order": ["ctx", "prob", "vis", "rf0", "rf1", "rf2", "rf3", "rf4", "rf5", "rf6", "rf7", "rf8", "rnf1", "rnf2", "rnf3", "cu9", "cu10", "cu11", "cu1", "cu2", "cu3", "cu4", "cu5", "cu6", "cu7", "cu8"], "groups": [{"rf": "rf0", "cus": ["cu9", "cu10", "cu11"]}, {"rf": "rf1", "cus": ["cu1"]}, {"rf": "rf2", "cus": ["cu2"]}, {"rf": "rf3", "cus": ["cu3"]}, {"rf": "rf4", "cus": ["cu4"]}, {"rf": "rf5", "cus": ["cu5"]}, {"rf": "rf6", "cus": ["cu6"]}, {"rf": "rf7", "cus": ["cu7"]}, {"rf": "rf8", "cus": ["cu8"]}], "rnf": ["rnf1", "rnf2", "rnf3"], "stories": {"cu1": {"justificacion": ["<strong>P1 + P4 en H1:<\/strong> primero una rebanada delgada que atraviesa pantalla, endpoint, servicio y base de datos con solo efectivo; los demás flujos agregan escenarios sobre esa base. El flujo básico es el <em>happy path<\/em> del caso de uso.", "<strong>Desempate, regla 1:<\/strong> H6 (pago mixto), H7 (atajos) y H8 (rendimiento) quedan como historias de baja o media prioridad para hacer visible su costo y poder posponerlas. En una sola historia «cobrar» habrían quedado ocultas.", "<strong>Desempate, regla 3:<\/strong> FA-01 y FA-02 se agrupan en H2 porque ambas son un rechazo de entrada de tamaño parecido; separarlas daría historias más pequeñas que el resto.", "<strong>P10 en H5:<\/strong> el datafono es una integración externa con comportamiento propio (autorización y fallos); no se mezcla con SINPE, que solo registra una referencia.", "<strong>P6 en H7:<\/strong> H1 usa la interfaz más simple que cumple la meta; los atajos son la versión sofisticada.", "<strong>P7 en H8:<\/strong> la funcionalidad primero (H1–H5); la meta de tiempo se verifica en una historia propia, porque exige una prueba distinta.", "<strong>P4 en H9:<\/strong> FA-09 (existencias insuficientes) es un flujo alterno propio: avisa y deja vender igual, por decisión del negocio. Se separa de H1 para que el flujo feliz quede pequeño y porque se puede construir después sin cambiar el cobro.", "<strong>P13 como verificación:<\/strong> ninguna historia pasa de 7 criterios."], "dependencias": ["H1 va primero: construye el esqueleto del sistema. H2 a H9 dependen de H1. La independencia total no es posible aquí y se declara; entre H2 a H6 y H9 no hay dependencia, así que se pueden tomar en paralelo."], "historias": [{"id": "H1", "titulo": "Vender productos en efectivo", "enunciado": "como cajera, quiero registrar los productos de un cliente y cobrarlos en efectivo, para que el cliente se lleve su compra con el vuelto correcto.", "cubre": "Flujo básico, FA-06, FA-08", "patron": "P1 + P4", "patrones": [{"id": "P1", "nombre": "Workflow Steps", "uso": "El ítem abarca los pasos de un proceso de punta a punta"}, {"id": "P4", "nombre": "Multiple Use-Case Scenarios", "uso": "Hay un flujo básico y varios flujos alternos"}], "prio": "Alta", "spike": false, "desempate": "Rebanada delgada de punta a punta con el flujo básico; incluye monto insuficiente (FA-06) y venta sin líneas (FA-08)", "ac": {"fondo": ["Given que la cajera \"Yendry\" tiene la caja abierta", "And existen los productos \"Arroz 1 kg\" a ₡1 200 y \"Leche 1 L\" a ₡1 100"], "escenarios": [{"titulo": "Cobro exitoso de un producto con vuelto", "pasos": ["Given una venta abierta con 1 unidad de \"Arroz 1 kg\"", "When la cajera cobra en efectivo y recibe ₡2 000", "Then la venta queda cobrada por ₡1 200", "And el sistema muestra un vuelto de ₡800", "And se emite el comprobante no tributario con las líneas, el total, el monto en efectivo con el monto recibido y el vuelto, la cajera, la fecha y la hora"]}, {"titulo": "El total suma las líneas por cantidad y precio", "pasos": ["Given una venta abierta con 2 unidades de \"Arroz 1 kg\" y 1 unidad de \"Leche 1 L\"", "When la cajera consulta el total", "Then el total es ₡3 500"]}, {"titulo": "Cobro con el monto exacto no genera vuelto", "pasos": ["Given una venta abierta con 1 unidad de \"Leche 1 L\"", "When la cajera cobra en efectivo y recibe ₡1 100", "Then la venta queda cobrada", "And el vuelto es ₡0"]}, {"titulo": "Monto recibido menor al total", "pasos": ["Given una venta abierta con 1 unidad de \"Arroz 1 kg\"", "When la caje : null}], "flujos": "8 flujos alternativos"}, "cu4": {"justificacion": ["<strong>P9 en S1:<\/strong> hay incertidumbre real sobre el mecanismo (PIN corto, tarjeta de proximidad o sesión por turno). Se investiga con un spike de tiempo limitado y su resultado destraba la estimación de H1. Es el único spike que bloquea al resto del caso.", "<strong>P1 + P3 en H1:<\/strong> casi todo el esfuerzo está en el primer mecanismo de autenticación (configuración de Spring Security, usuarios, token, pantalla). Una vez hecho, las demás historias son incrementos pequeños. Por eso H1 es la más grande del caso y se parte en 8 tareas. El rechazo de la apertura de turno tras el cierre del día (FA-09) es un incremento pequeño que se agrega aquí (T1.8), porque modifica el mismo inicio de sesión.", "<strong>P4 en H2 a H6:<\/strong> cada una es un flujo alterno del caso de uso.", "<strong>Desempate, regla 3:<\/strong> FA-02 y FA-03 se agrupan en H3 porque ambas hablan de un usuario que no puede entrar (por bloqueo o por estar inactivo); FA-01 se deja aparte, aunque es pequeña, porque es el flujo alterno más frecuente.", "<strong>P12 en H7:<\/strong> el comportamiento cambia por rol. La sesión de la dueña es administrativa: no abre turno, no ocupa la caja y sirve para autorizar en la caja sin cambiar a quién pertenece el turno. Es alta porque CU-02 H4 y CU-03 la necesitan.", "<strong>P12 en H8:<\/strong> solo la dueña puede forzar el cierre de un turno ajeno. <strong>Desempate, regla 1:<\/strong> es un flujo poco frecuente (ocurre cuando una cajera olvida cerrar) y se aísla para poder posponerlo; mientras tanto, FA-04 se resuelve pidiendo a la cajera anterior que cierre.", "<strong>P7 en H9, H10 y H11:<\/strong> tres requisitos no funcionales con pruebas distintas: protección del PIN y la sesión, trazabilidad y velocidad.", "<strong>Desempate, regla 1:<\/strong> H4, H5, H6 y H8 son de menor prioridad que H1 a H3 y se pueden posponer sin impedir que la cajera cobre.", "<strong>P13 como verificación:<\/strong> ninguna historia pasa de 7 criterios.", "<strong>Qué salió de este caso:<\/strong> las historias de crear cajeras, inactivar, desbloquear PIN y reasignar PIN (P8, «gestionar») viven en CU-05, porque administrar cajeras es otra meta de otro actor primario (la dueña)."], "dependencias": ["<strong>S1 va primero.<\/strong> Su decisión se escribe en <code>../arquitectura.md<\/code>.", "<strong>CU-04 H1 es prerrequisito de CU-01 H1<\/strong>, que supone una caja abierta. Decisión sugerida: construir CU-04 H1 primero como esqueleto de punta a punta; si el equipo quiere arrancar CU-01 en paralelo, simula la sesión con un usuario fijo y lo reemplaza al cerrar CU-04 H1.", "<strong>CU-02 H4 y CU-03 H1 y H5<\/strong> necesitan que la dueña pueda autorizar en la caja: dependen de <strong>H7<\/strong>.", "H1 usa usuarios sembrados; crear cajeras reales es <a href=\"CU-05-backlog.md\">CU-05 H1<\/a>, que depende de H7 (la dueña administra con su sesión administrativa).", "H2 y H3 dependen de H1; H3 también de H2 (cuenta intentos fallidos). Desbloquear el PIN es <a href=\"CU-05-backlog.md\">CU-05 H3<\/a> y depende de H3.", "H4 depende de H6 (cerrar turno); H5 depende de H1.", "H7 depende de H1 (reutiliza el inicio de sesión y agrega el rol de dueña).", "H8 depende de H6 y H7, y se usa también desde <a href=\"CU-05-backlog.md\">CU-05 H2<\/a> (no se inactiva a una cajera con turno abierto).", "H1 (T1.8) depende de <strong>CU-06 H1<\/strong> (la marca de día cerrado). H6 usa el estado «en espera de autorización» de <strong>CU-02 H4<\/strong> (T4.8).", "H10 reutiliza el servicio de bitácora de <strong>CU-02 H6<\/strong> o <strong>CU-03 H7<\/strong>; quien lo construya primero lo deja reutilizable."], "historias": [{"id": "S1", "titulo": "Spike: decidir el mecanismo de identificación", "enunciado": "¿PIN corto, tarjeta de proximidad o sesión por turno cumplen a la vez la meta de 3 s y la trazabilidad por persona?", "cubre": "Decisión de diseño", "patron": "P9", "patro
