<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapa de requerimientos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
:root{
  --bg:#eef4f6; --board:#f8fbfc; --dot:#cfdde3; --sheet:#ffffff; --ink:#1c2a31; --muted:#586b74; --line:#d3e0e5;
  --green:#2b8a4f; --orange:#b85410; --teal:#11808a; --purple:#6a46b6; --red:#c42a3c; --gold:#9a6b00;
  --ok:#2b8a4f; --bad:#c42a3c; --tint:12%;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",Verdana,system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e171c; --board:#111d23; --dot:#23343c; --sheet:#182730; --ink:#e5eef2; --muted:#9db1ba; --line:#2a3d46;
  --green:#6dc78f; --orange:#f09a5c; --teal:#5dc5ce; --purple:#b49ef0; --red:#f07482; --gold:#f2c552;
  --ok:#6dc78f; --bad:#f07482; --tint:20%; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e171c; --board:#111d23; --dot:#23343c; --sheet:#182730; --ink:#e5eef2; --muted:#9db1ba; --line:#2a3d46;
  --green:#6dc78f; --orange:#f09a5c; --teal:#5dc5ce; --purple:#b49ef0; --red:#f07482; --gold:#f2c552;
  --ok:#6dc78f; --bad:#f07482; --tint:20%; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,.node:focus-visible,summary:focus-visible{outline:3px solid var(--green);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.15;text-wrap:balance}
p{margin:0}

.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);grid-template-columns:minmax(0,1fr)}
header{min-width:0}
.top{display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:1.5px solid var(--line);background:var(--sheet);min-width:0}
.brand{display:grid;line-height:1.1;flex:none;text-align:left;background:none;border:0;padding:0}
.brand b{font-family:var(--display);font-size:1.15rem;color:var(--green)}
.brand span{font-size:.78rem;color:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;min-width:0;flex:1;padding-block:2px;scrollbar-width:thin;align-items:center}
.chip{flex:none;font-family:var(--display);font-weight:700;font-size:.85rem;padding:3px 11px;border-radius:999px;border:1.5px solid var(--line);color:var(--muted);background:transparent;white-space:nowrap}
.chip.done{color:var(--c);border-color:color-mix(in srgb,var(--c) 40%,transparent)}
.chip.now{background:var(--c);border-color:var(--c);color:var(--sheet)}
.chip:disabled{cursor:default;opacity:.6}
.chip.dot::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);margin-right:6px;vertical-align:-1px}
.sep{color:var(--muted);flex:none}
.tools{display:flex;gap:6px;flex:none}
.tbtn{font-family:var(--display);font-weight:700;font-size:.85rem;padding:3px 11px;border-radius:999px;border:1.5px solid var(--line);background:transparent;color:var(--muted)}
.tbtn:hover{border-color:var(--green);color:var(--green)}
.progress{position:relative;height:4px;background:var(--line)}
.progress i{position:absolute;inset:0 auto 0 0;background:var(--green);transition:width .5s}

.stage{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(380px,1fr);min-height:0}
.boardwrap{position:relative;min-height:0;background-color:var(--board);background-image:radial-gradient(var(--dot) 1.3px,transparent 1.4px);background-size:22px 22px}
.board{position:absolute;inset:0;overflow:auto;overscroll-behavior:contain}
.board svg{display:block;touch-action:manipulation}
.chapter-tag{position:absolute;left:14px;top:12px;display:grid;pointer-events:none;max-width:calc(100% - 28px);background:color-mix(in srgb,var(--board) 85%,transparent);padding:2px 8px;border-radius:10px}
.chapter-tag small{font-family:var(--display);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:.72rem;color:var(--muted)}
.chapter-tag strong{font-family:var(--display);font-size:1.35rem;color:var(--c);line-height:1.1}
.zoom{position:absolute;right:14px;bottom:12px;display:flex;gap:6px;align-items:center;background:var(--sheet);border:1px solid var(--line);padding:3px 6px;border-radius:999px;font-size:.78rem;color:var(--muted)}
.zoom button{border:1.5px solid var(--line);background:transparent;border-radius:999px;min-width:28px;height:26px;font-family:var(--display);font-weight:800;color:var(--ink)}
.zoom button:hover{border-color:var(--green)}

.panel{display:grid;grid-template-rows:minmax(0,1fr) auto;border-left:1.5px solid var(--line);background:var(--sheet);min-height:0}
.card{overflow-y:auto;padding:20px 22px;display:grid;gap:14px;align-content:start}
.card.enter{animation:cardIn .45s ease}
@keyframes cardIn{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:none}}
.eyebrow{font-family:var(--display);font-weight:700;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--c)}
.card h2{font-size:1.75rem;color:var(--ink)}
.card h3.sec{font-size:1.05rem;color:var(--c);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.think{border-radius:16px;padding:18px;background:color-mix(in srgb,var(--c) var(--tint),var(--sheet));border:2px dashed color-mix(in srgb,var(--c) 55%,transparent);display:grid;gap:8px}
.think b.lbl{font-family:var(--display);font-size:.95rem;color:var(--c)}
.think p{font-family:var(--display);font-weight:600;font-size:1.22rem;line-height:1.3}
.facts{display:flex;flex-wrap:wrap;gap:6px}
.fact{font-size:.85rem;border-radius:8px;padding:2px 9px;background:var(--bg);color:var(--muted)}
.thread{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:.85rem;color:var(--muted)}
.thread span,.thread button{background:var(--bg);border-radius:8px;padding:1px 8px;border:0;color:inherit}
.thread button:hover:not(:disabled){outline:2px solid var(--c)}
.thread button:disabled{opacity:.5;cursor:default}
.thread .last{background:var(--c);color:var(--sheet);font-weight:700;opacity:1!important}
.thread i{font-style:normal;opacity:.7}
.thread .lead{background:transparent;padding:0}
.link{font-size:.95rem;color:var(--muted);border-left:4px solid var(--c);padding-left:10px}
.link em{font-style:normal;font-weight:700;color:var(--c)}
ul.steps{margin:0;padding:0;list-style:none;display:grid;gap:10px;counter-reset:s}
ul.steps li{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;counter-increment:s}
ul.steps li::before{content:counter(s);width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:var(--sheet);font-family:var(--display);font-weight:700}
.docbtn{justify-self:start;border:2px solid color-mix(in srgb,var(--c) 55%,transparent);background:transparent;color:var(--c);border-radius:12px;padding:8px 14px;font-family:var(--display);font-weight:700}
.docbtn:hover{background:color-mix(in srgb,var(--c) var(--tint),var(--sheet))}
.docbtn.solid{background:var(--c);color:var(--sheet);border-color:var(--c)}
.docbtn.solid:hover{filter:brightness(1.08)}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.doc{border-top:2px solid var(--line);padding-top:6px;font-size:1rem;line-height:1.6}
.doc[hidden]{display:none}
.doc h2{font-family:var(--display);font-size:1.3rem;margin:24px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--line);color:var(--c)}
.doc h3{font-size:1.08rem;margin:18px 0 6px}
.doc ul,.doc ol{padding-left:1.4rem}
.doc li{margin:3px 0}
.doc code,.card code{font:.9em Consolas,"Courier New",monospace;background:var(--bg);padding:1px 5px;border-radius:4px}
.doc pre{background:#1b2630;color:#e8eef2;padding:14px 16px;border-radius:12px;overflow-x:auto;font-size:.88rem;line-height:1.45}
.doc pre code{background:none;color:inherit;padding:0}
.doc blockquote{margin:14px 0;padding:8px 16px;border-left:5px solid var(--c);background:color-mix(in srgb,var(--c) var(--tint),var(--sheet));border-radius:0 10px 10px 0}
.doc .tablewrap,.tablewrap{overflow-x:auto;margin:8px 0}
.doc table,.card table{border-collapse:collapse;width:100%;font-size:.92rem}
.doc th,.doc td,.card th,.card td{border:1px solid var(--line);padding:6px 9px;vertical-align:top;text-align:left}
.doc th,.card th{background:var(--bg)}
.doc a{color:var(--c);font-weight:700}
.doc .ref{color:var(--muted);border-bottom:1px dotted var(--muted)}

.nav{display:flex;gap:10px;padding:12px 22px;border-top:1.5px solid var(--line);background:var(--sheet)}
.btn{border-radius:12px;padding:10px 16px;font-family:var(--display);font-weight:700;font-size:1.05rem;border:2px solid var(--line);background:var(--sheet);color:var(--ink)}
.btn.primary{flex:1;background:var(--c);border-color:var(--c);color:var(--sheet)}
.btn:disabled{opacity:.45;cursor:default}
.nav{--c:var(--green)}

/* Colores por tipo de caja */
.t-contexto,.t-problema,.t-vision{--c:var(--green)}
.t-rf{--c:var(--purple)}
.t-cu,.t-root{--c:var(--teal)}
.t-rnf{--c:var(--orange)}
.t-alta{--c:var(--green)}
.t-media{--c:var(--purple)}
.t-baja{--c:var(--teal)}
.t-spike{--c:var(--gold)}
.intro{--c:var(--green)}

/* Letras INVEST */
.L-I{--lc:var(--green)}.L-N{--lc:var(--teal)}.L-V{--lc:var(--purple)}.L-E{--lc:var(--orange)}.L-S{--lc:var(--red)}.L-T{--lc:var(--gold)}
.lbadge{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--lc);color:var(--sheet);font:800 .8rem var(--display);flex:none}
.sig{border-bottom:3px solid var(--lc);background:color-mix(in srgb,var(--lc) 20%,transparent);border-radius:4px;padding:0 3px;cursor:pointer}
.sig sup{font:800 .6em var(--display);color:var(--lc);margin-left:2px}
.sig.on{background:color-mix(in srgb,var(--lc) 45%,transparent)}
.invest{border:2px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:12px}
.letters{display:flex;gap:6px;flex-wrap:wrap}
.lchip{display:flex;align-items:center;gap:6px;border:2px solid color-mix(in srgb,var(--lc) 50%,transparent);background:transparent;border-radius:999px;padding:3px 12px 3px 4px;font-family:var(--display);font-weight:700}
.lchip:hover{background:color-mix(in srgb,var(--lc) var(--tint),var(--sheet))}
.lchip[aria-pressed="true"]{background:var(--lc);color:var(--sheet);border-color:var(--lc)}
.lchip[aria-pressed="true"] .lbadge{background:var(--sheet);color:var(--lc)}
.ldetail{display:grid;gap:10px;border-left:6px solid var(--lc);padding-left:12px}
.ldetail .q{font-family:var(--display);font-weight:700;font-size:1.08rem;color:var(--lc)}
.lbox{border-radius:12px;padding:10px 12px;display:grid;gap:2px}
.lbox b{font-family:var(--display);font-size:.9rem}
.lbox.sig-box{background:color-mix(in srgb,var(--ok) var(--tint),var(--sheet))}
.lbox.sig-box b{color:var(--ok)}
.lbox.bad{background:color-mix(in srgb,var(--bad) var(--tint),var(--sheet))}
.lbox.bad b{color:var(--bad)}
.lbox.fix{background:color-mix(in srgb,var(--teal) var(--tint),var(--sheet))}
.lbox.fix b{color:var(--teal)}
.verdict{font-weight:700}
.hl{outline:3px solid var(--lc);outline-offset:3px;border-radius:12px}
.secbox{display:grid;gap:8px}
.badges{display:inline-flex;gap:3px}
.matrix td.y{color:var(--ok);font-weight:800;text-align:center}
.matrix td.n{color:var(--bad);font-weight:800;text-align:center}
.matrix td.pick{background:color-mix(in srgb,var(--ok) var(--tint),var(--sheet))}
details.sc{border:1.5px solid var(--line);border-radius:10px;padding:6px 10px;margin:4px 0}
details.sc summary{cursor:pointer;font-weight:700}
details.sc pre{margin:8px 0 2px;white-space:pre-wrap;font:.88rem/1.5 Consolas,"Courier New",monospace}
details.sc pre b{color:var(--c)}
ul.check{list-style:none;padding:0;margin:0;display:grid;gap:6px}
ul.check li{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:start}
ul.check li::before{content:"☐";color:var(--c);font-size:1.1rem;line-height:1.25}
ul.check .pt{display:inline-block;font:700 .72rem var(--display);padding:0 7px;border-radius:999px;background:var(--bg);color:var(--muted);margin-left:6px}
.two{display:grid;grid-template-columns:1fr;gap:14px}
.limit{font-size:.85rem;border-radius:999px;padding:1px 10px;font-weight:700}
.limit.ok{background:color-mix(in srgb,var(--ok) var(--tint),var(--sheet));color:var(--ok)}
.limit.warn{background:color-mix(in srgb,var(--bad) var(--tint),var(--sheet));color:var(--bad)}
.pat{border-radius:10px;padding:6px 10px;background:var(--bg);font-size:.92rem}
.pat b{font-family:var(--display);color:var(--c)}

/* Nodos SVG */
.node{cursor:default;outline:none}
.node.on{cursor:pointer}
.node .pop{transform-box:fill-box;transform-origin:center;transition:transform .55s cubic-bezier(.3,1.45,.55,1),opacity .35s}
.node:not(.on) .pop{transform:scale(.55);opacity:0}
.node .box{fill:color-mix(in srgb,var(--c) var(--tint),var(--sheet));stroke:var(--c);stroke-width:2.5}
.node.t-problema .box,.node.t-root .box{fill:var(--c)}
.node.t-rnf .box,.node.t-spike .box{stroke-dasharray:9 5}
.node .nd{width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:6px 10px;gap:2px;font-family:var(--body);color:var(--ink)}
.node .nd b{font-family:var(--display);font-weight:700;font-size:21px;line-height:1.05;color:var(--c)}
.node .nd span{font-size:14.5px;line-height:1.2;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.node .nd small{font-size:12.5px;font-weight:700;color:var(--c);margin-top:2px}
.node.t-problema .nd b,.node.t-problema .nd span,.node.t-root .nd b,.node.t-root .nd span{color:var(--sheet)}
.node.t-problema .nd b,.node.t-root .nd b{font-size:23px}
.board svg.main .ghost{display:none}
.lane rect{fill:color-mix(in srgb,var(--orange) 8%,transparent);stroke:var(--orange);stroke-width:2;stroke-dasharray:3 9;stroke-linecap:round}
.lane text{fill:var(--orange);font-family:var(--display);font-weight:700;font-size:15px}
.lane text.ltitle{font-size:18px}
.lane{opacity:0;transition:opacity .5s}.lane.on{opacity:1}
.node .ghost{opacity:0;transition:opacity .35s}
.node:not(.on) .ghost{opacity:1}
.node .ghost rect{fill:transparent;stroke:var(--muted);stroke-width:2;stroke-dasharray:7 6;opacity:.4}
.node .ghost text{fill:var(--muted);font-family:var(--display);font-weight:800;font-size:30px;opacity:.4}
.node.next .ghost rect{stroke:var(--c);opacity:1;animation:breathe 1.6s ease-in-out infinite}
.node.next .ghost text{fill:var(--c);opacity:1}
@keyframes breathe{50%{stroke-dashoffset:13}}
.node.fresh .box{animation:glow 1.4s ease}
@keyframes glow{0%{stroke-width:9}100%{stroke-width:2.5}}
.node.focus .box{stroke-width:5}

.edge{fill:none;stroke:var(--c);stroke-width:3;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;opacity:.75;transition:stroke-dashoffset .8s ease .2s}
.edge.on{stroke-dashoffset:0}
.edge.dash{stroke-dasharray:7 6;stroke-dashoffset:0;opacity:0;transition:opacity .6s ease .2s}
.edge.dash.on{opacity:.75}
.elabel{opacity:0;transition:opacity .4s ease .75s}
.elabel.on{opacity:1}
.elabel rect{fill:var(--board);stroke:color-mix(in srgb,var(--c) 45%,transparent);stroke-width:1.5}
.elabel text{fill:var(--c);font-family:var(--body);font-weight:700;font-size:13.5px}

/* Panel de ayuda: historias de usuario */
.gtab{position:fixed;left:0;top:42%;z-index:30;writing-mode:vertical-rl;transform:rotate(180deg);background:var(--green);color:var(--sheet);border:0;border-radius:0 10px 10px 0;padding:14px 8px;font-family:var(--display);font-weight:800;font-size:.9rem;letter-spacing:.03em;box-shadow:2px 2px 8px rgba(0,0,0,.18)}
.gtab:hover{filter:brightness(1.1)}
.gdrawer{position:fixed;left:0;top:0;bottom:0;z-index:40;width:min(460px,100vw);background:var(--sheet);border-right:1.5px solid var(--line);box-shadow:6px 0 24px rgba(0,0,0,.2);display:grid;grid-template-rows:auto auto minmax(0,1fr);transform:translateX(-102%);visibility:hidden;transition:transform .25s,visibility .25s}
.gdrawer.open{transform:none;visibility:visible}
.ghead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px 4px}
.ghead h2{font-size:1.25rem;color:var(--green)}
.gclose{border:1.5px solid var(--line);background:transparent;border-radius:999px;width:32px;height:32px;font-weight:800}
.gclose:hover{border-color:var(--green)}
.gtabs{display:flex;gap:6px;flex-wrap:wrap;padding:6px 16px 10px;border-bottom:1.5px solid var(--line)}
.gtabs button{font-family:var(--display);font-weight:700;font-size:.85rem;padding:3px 11px;border-radius:999px;border:1.5px solid var(--line);background:transparent;color:var(--muted)}
.gtabs button[aria-selected="true"]{background:var(--green);border-color:var(--green);color:var(--sheet)}
.gbody{overflow-y:auto;padding:16px;display:grid;gap:12px;align-content:start}
.gbody h3{font-size:1.02rem;color:var(--teal)}
.gbody .gsub{border-left:4px solid var(--line);padding:2px 0 2px 12px;display:grid;gap:4px}
.gbody .gsub.src{border-left-color:var(--gold)}
.gbody .gsub.src h3{color:var(--gold)}
.gbody .gsub.hit{border-left-color:var(--green);background:color-mix(in srgb,var(--green) var(--tint),transparent);border-radius:0 10px 10px 0}
.gbody ul{margin:0 0 6px;padding-left:1.2em}
.gbody p+p,.gbody ul+p{margin-top:6px}
.gbody code{font-size:.85em}
.ghelp{margin-left:6px;border:1.5px solid var(--line);background:transparent;border-radius:999px;width:22px;height:22px;font-size:.78rem;font-weight:800;color:var(--muted);vertical-align:middle;padding:0}
.ghelp:hover{border-color:var(--green);color:var(--green)}
.gact{display:flex;gap:6px;align-items:center}
.gbtn{font-family:var(--display);font-weight:700;font-size:.85rem;padding:3px 11px;border-radius:999px;border:1.5px solid var(--line);background:transparent;color:var(--muted)}
.gbtn:hover{border-color:var(--green);color:var(--green)}
.gbtn[hidden]{display:none}
.gdrawer.full{width:100vw;border-right:0}
.gdrawer.full .ghead{padding:14px 28px 6px}
.gdrawer.full .gtabs{padding:6px 28px 12px}
.gdrawer.full .gtabs button{font-size:1rem;padding:5px 16px}
.gdrawer.full .gbody{padding:0;display:block;overflow:hidden}
.gwiz{display:grid;grid-template-columns:230px minmax(0,1fr);height:100%;min-height:0}
.grail{border-right:1.5px solid var(--line);padding:18px 14px;display:grid;gap:4px;align-content:start;overflow-y:auto}
.grail b{font-family:var(--display);color:var(--green);font-size:1.05rem;margin-bottom:6px;padding-left:8px}
.grail button{text-align:left;border:0;background:transparent;border-radius:8px;padding:6px 10px;color:var(--muted);font-size:.95rem}
.grail button:hover{background:color-mix(in srgb,var(--green) var(--tint),transparent)}
.grail button.on{background:color-mix(in srgb,var(--green) 18%,transparent);color:var(--ink);font-weight:700}
.gstage{display:grid;grid-template-rows:minmax(0,1fr) auto;min-height:0}
.gslide{overflow-y:auto;padding:4vh 7vw;display:grid;gap:18px;align-content:start;font-size:clamp(1.25rem,2.1vw,1.9rem);line-height:1.5}
.gslide .gtitle{display:flex;align-items:center;gap:22px}
.gslide h2{font-size:clamp(2rem,4vw,3.2rem);color:var(--green)}
.gstage.src .gslide h2{color:var(--gold)}
.gbig{font-family:var(--display);font-weight:800;font-size:clamp(4.5rem,11vw,8rem);line-height:.9;color:var(--c,var(--purple))}

<script>
const DATA = {"nodes": [{"id": "ctx", "tipo": "contexto", "codigo": "Contexto", "titulo": "Contexto del negocio", "corto": "Contexto del negocio", "sub": "El negocio y su día a día", "abstract": "Minisúper La Esquina es un comercio de barrio en Paraíso de Cartago, con 15 años de operación, a cargo de Doña Marta. Trabaja con una caja registradora básica, un cuaderno de fiado, una calculadora y una hoja de Excel de inventario, todos los días de 6:00 a.m. a 8:00 p.m.", "chips": [], "html": "<h2>Contexto<\/h2>\n<p>Minisúper La Esquina es un comercio de barrio en Paraíso de Cartago, con 15 años de operación, a cargo de Marta Salazar («Doña Marta»). Vende abarrotes, refrescos, snacks, carnicería básica, frutas y verduras en un solo local, con una caja activa, todos los días de 6:00 a.m. a 8:00 p.m.<\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Rol<\/th>\n<th>Persona<\/th>\n<th>Relación con el negocio<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Dueña<\/td>\n<td>Doña Marta<\/td>\n<td>Decide qué comprar, autoriza el fiado y es la responsable final<\/td>\n<\/tr>\n<tr>\n<td>Cajeras<\/td>\n<td>Yendry y Katherine (turnos rotativos)<\/td>\n<td>Cobran en la caja<\/td>\n<\/tr>\n<tr>\n<td>Apoyo de inventario<\/td>\n<td>Kevin (hijo de Doña Marta)<\/td>\n<td>Actualiza una hoja de Excel cada 15 días<\/td>\n<\/tr>\n<tr>\n<td>Clientes<\/td>\n<td>Vecinos del barrio; algunos con cuenta de fiado<\/td>\n<td>Compran de contado o a crédito<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Hoy el negocio opera con una caja registradora básica que solo suma, un cuaderno de fiado que maneja solo Doña Marta, una calculadora, la hoja de Excel de Kevin y cámaras de seguridad. Se acepta efectivo y SINPE Móvil; un datafono de tarjeta falla a veces en horas pico <em>(supuesto)<\/em>.<\/p>", "rnfs": [], "rfs": [], "realiza": null, "realizaEn": []}, {"id": "prob", "tipo": "problema", "codigo": "Problema", "titulo": "Problema", "corto": "Problema", "sub": "Lo que se pierde hoy", "abstract": "Cuatro problemas: no hay trazabilidad de quién hace cada operación (≈ ₡350 000 perdidos hace dos años), el cobro es lento en horas pico, el fiado vive en un cuaderno sin control verificable y controlar más puede alargar todavía más la fila.", "chips": [], "html": "<h2>Situación actual<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Proceso<\/th>\n<th>Cómo se hace hoy<\/th>\n<th>Limitación<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Venta de contado<\/td>\n<td>La cajera suma en la registradora o con calculadora y cobra<\/td>\n<td>No queda historial de la venta ni de quién la hizo<\/td>\n<\/tr>\n<tr>\n<td>Venta a fiado<\/td>\n<td>La cajera revisa el cuaderno de Doña Marta; solo ella lo maneja<\/td>\n<td>Depende de una sola persona y de un papel que se puede perder<\/td>\n<\/tr>\n<tr>\n<td>Anulación de una venta<\/td>\n<td>Se corrige en la registradora sin dejar registro<\/td>\n<td>No hay control de quién anula ni por qué<\/td>\n<\/tr>\n<tr>\n<td>Identificación de la cajera<\/td>\n<td>Ninguna dentro del sistema; solo las cámaras<\/td>\n<td>Saber «quién hizo qué» exige revisar grabaciones<\/td>\n<\/tr>\n<tr>\n<td>Cuadre de caja al cierre del día<\/td>\n<td>Se cuenta el efectivo y se compara contra la registradora<\/td>\n<td>Depende de que nadie se haya equivocado ni hecho trampa. Este proceso manual no es el «cierre del día» del sistema (RF-06), que solo fija hasta cuándo se pueden anular ventas<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Problema<\/h2>\n<ol>\n<li><strong>Falta de trazabilidad.<\/strong> Hace dos años un cajero anuló ventas ya cobradas en efectivo y hacía descuentos no autorizados. Doña Marta tardó unos 4 meses en notarlo, por medio de las cámaras, y perdió cerca de ₡350 000. Hoy sigue sin una forma rápida de saber quién hizo cada operación.<\/li>\n<li><strong>Cobro lento en horas pico.<\/strong> Los viernes de quincena y los sábados en la mañana hay filas largas porque hay una sola caja y todo se calcula a mano. Doña Marta sospecha que pierde clientes frente a un supermercado de cadena cercano.<\/li>\n<li><strong>Fiado sin control verificable.<\/strong> El crédito a clientes vive en un cuaderno: no hay límite que se aplique solo, ni historial confiable, ni autorización registrada para montos altos.<\/li>\n<li><strong>Conflicto entre los dos primeros puntos.<\/strong> Controlar quién hace cada operación puede volver más lento el cobro. A Yendry le preocupa que un control por venta alargue las filas.<\/li>\n<\/ol>\n<p><strong>Qué se pierde o se arriesga si todo sigue igual:<\/strong> dinero por anulaciones y descuentos sin control, clientes que se van por la espera, deudas de fiado sin respaldo y desconfianza entre la dueña y las cajeras.<\/p>\n<h2>Impacto<\/h2>\n<ul>\n<li>Pérdida económica ya ocurrida (≈ ₡350 000) y riesgo de que se repita sin que se detecte a tiempo.<\/li>\n<li>Ventas perdidas en las horas de mayor demanda.<\/li>\n<li>Tensión con el personal, que siente que todas cargan con la desconfianza que generó una persona.<\/li>\n<\/ul>", "rnfs": [], "rfs": [], "realiza": null, "realizaEn": []}, {"id": "vis", "tipo": "vision", "codigo": "Visión", "titulo": "Solución y visión", "corto": "Solución y visión", "sub": "Caja La Esquina y su alcance", "abstract": "Caja La Esquina es un punto de venta que registra cada operación a nombre de una persona sin frenar el cobro. Incluye inventario básico (catálogo, precios y existencias), ventas, fiado, anulaciones, turnos, administración de cajeras y cierre del día; deja fuera proveedores, factura electrónica y productos por peso.", "chips": [], "html": "<h2>Solución propuesta<\/h2>\n<p><strong>Qué incluye (a nivel macro):<\/strong><\/p>\n<ul>\n<li>Administrar el inventario (a cargo de la dueña): registrar productos con su precio, cambiar precios y registrar entradas, mermas y conteos de existencias. Las ventas descuentan las existencias solas y las anulaciones las devuelven.<\/li>\n<li>Registrar ventas en caja con cobro en efectivo, SINPE Móvil, tarjeta o combinaciones.<\/li>\n<li>Vender a fiado con verificación de cuenta, crédito disponible y autorización de la dueña en montos altos.<\/li>\n<li>Anular ventas con motivo y autorización de la dueña, sin borrar nunca la venta.<\/li>\n<li>Identificar a la cajera una sola vez por turno, de forma rápida.<\/li>\n<li>Dejar una bitácora de las operaciones sensibles que nadie pueda editar ni borrar desde el sistema.<\/li>\n<li>Administrar las cajeras (crear, inactivar, asignar y reasignar PIN, desbloquear PIN), a cargo de la dueña.<\/li>\n<li>Cerrar el día (a cargo de la dueña): marca desde la cual ya no se anulan ventas del día y caducan las solicitudes pendientes. No es el cuadre de caja, que es el conteo manual del efectivo.<\/li>\n<li>Consultar la bitácora (a cargo de la dueña): ver las operaciones registradas y filtrarlas por persona, fechas y tipo de operación, en solo lectura.<\/li>\n<li>Autorizar operaciones sensibles con el PIN de la dueña: la dueña decide con su PIN, validado en el servidor, y la autorización es de un solo uso y queda en la bitácora; la cajera nunca conoce ese PIN.<\/li>\n<\/ul>\n<p><strong>Qué queda fuera de esta versión:<\/strong><\/p>\n<ul>\n<li>Compras a proveedores, costos, existencias mínimas, lotes y reportes de inventario (el inventario se limita al catálogo, los precios y las existencias).<\/li>\n<li>Cuadre de caja automatizado (el conteo del efectivo sigue siendo manual).<\/li>\n<li>Factura electrónica ante Hacienda; el comprobante de venta es no tributario.<\/li>\n<li>Reportes y estadísticas de ventas.<\/li>\n<li>Funcionamiento sin conexión a internet.<\/li>\n<li>Más de una caja activa a la vez.<\/li>\n<li>Productos que se venden por peso (carnicería, frutas y verduras a granel): las cantidades son enteras.<\/li>\n<li>Abandonar o cancelar una venta abierta sin cobrar (la única cancelación es la del cierre forzado de un turno por la dueña, CU-04).<\/li>\n<\/ul>\n<p><strong>Nota de contexto:<\/strong> el negocio sí vende productos por peso y cobra con factura electrónica; esos procesos siguen como hoy y quedan fuera de este sistema en esta versión.<\/p>\n<h2>Visión del sistema<\/h2>\n<blockquote>\n<p>Para <strong>Doña Marta y las cajeras del Minisúper La Esquina<\/strong>, que necesitan <strong>cobrar rápido en las horas pico y saber quién hizo cada venta, fiado y anulación<\/strong>, <strong>Caja La Esquina<\/strong> es un <strong>punto de venta<\/strong> que <strong>registra cada operación a nombre de una persona sin frenar el cobro<\/strong>.<\/p>\n<\/blockquote>\n<p><strong>Hecho de la situación actual que la sustenta:<\/strong> un cajero anuló ventas durante unos 4 meses sin que nadie lo notara, mientras las filas de los viernes de quincena ya hacían perder clientes.<\/p>", "rnfs": [], "rfs": [], "realiza": null, "realizaEn": []}, {"id": "rf0", "tipo": "rf", "codigo": "RF-00", "titulo": "Administrar inventario", "corto": "Administrar inventario", "abstract": "El sistema debe permitir a la dueña mantener el catálogo de productos que se venden en caja y sus existencias: registrar un producto con su código, nombre, precio y existencias iniciales; cambiar su precio; y registrar entradas de mercadería, mermas y conteos físicos.", "chips": ["Actores: dueña"], "rnfs": ["rnf2", "rnf3"], "rfs": [], "realiza": null, "realizaEn": [], "html": "<h2>Descripción<\/h2>\n<p>El sistema debe permitir a la dueña mantener el catálogo de productos que se venden en caja y sus existencias: registrar un producto con su código, nombre, precio y existencias iniciales; cambiar su precio; y registrar entradas de mercadería, mermas y conteos físicos. Las ventas descuentan las existencias solas y las anulaciones las devuelven. Todo cambio queda en la bitácora con quién lo hizo, cuándo y qué valores cambiaron.<\/p>\n<p>Este requerimiento se numera RF-00 porque es la base de <a href=\"#\" data-go=\"rf1\">RF-01<\/a>: sin un producto con precio no hay nada que vender. Tiene más de un caso de uso, porque agrupa tres metas distintas de la dueña.<\/p>\n<p><strong>Límites de alcance y supuestos:<\/strong>\n- Solo la dueña administra el inventario, desde su sesión administrativa (RF-04); las cajeras solo venden.\n- Las existencias son números enteros; los productos por peso quedan fuera de alcance, igual que en RF-01.\n- Una venta con existencias insuficientes se permite con un aviso (decisión del negocio): el inventario puede quedar negativo hasta que la dueña lo corrija con un conteo físico.\n- Quedan fuera de esta versión: dar de baja o inactivar productos, categorías, costos y márgenes, proveedores y órdenes de compra, alertas de existencias mínimas, lotes y fechas de vencimiento, y reportes de inventario.<\/p>\n<p><strong>Actores:<\/strong> dueña.<\/p>\n<h2>Necesidad<\/h2>\n<p>Habilita el problema 2 de <span class=\"ref\">problema.md<\/span>: <a href=\"#\" data-go=\"rf1\">RF-01<\/a> necesita un catálogo con precio vigente para cobrar rápido. También reemplaza la hoja de Excel que Kevin actualiza cada 15 días (ver el contexto del negocio): las existencias se mantienen al día con cada venta. Aporta al problema 1 porque los cambios de precio y los ajustes de existencias, que son una vía clásica para esconder faltantes, quedan en la bitácora.<\/p>\n<h2>Proceso Actual<\/h2>\n<p>Los precios están en la memoria de las cajeras y en etiquetas de los estantes; la registradora no tiene catálogo. Kevin cuenta los productos y actualiza una hoja de Excel cada 15 días, por lo que la dueña no sabe qué hay hasta el siguiente conteo. Un cambio de precio se comunica de palabra y no deja registro <em>(supuesto)<\/em>.<\/p>\n<h2>Solución Propuesta<\/h2>\n<p>Una pantalla de administración, solo para la dueña, donde se registra cada producto con su precio inicial, se cambia el precio cuando sube o baja y se registran las entradas, las mermas y los conteos. El sistema descuenta las existencias al cobrar cada venta, las devuelve al anular y avisa a la cajera si vende algo que el sistema cree agotado.<\/p>\n<h2>Documentos de Referencia<\/h2>\n<ul>\n<li><span class=\"ref\">Caso Minisúper La Esquina, secciones 3, 4.1 y 5.1<\/span><\/li>\n<li><span class=\"ref\">Descripción del problema<\/span><\/li>\n<\/ul>\n<h2>Casos de Uso Relacionados<\/h2>\n<ul>\n<li><a href=\"#\" data-go=\"cu9\">CU-09 Registrar producto<\/a><\/li>\n<li><a href=\"#\" data-go=\"cu10\">CU-10 Cambiar el precio de un producto<\/a><\/li>\n<li><a href=\"#\" data-go=\"cu11\">CU-11 Registrar movimiento de existencias<\/a><\/li>\n<\/ul>\n<h2>Criterios de Aceptación<\/h2>\n<ol>\n<li>Un producto se registra con código único, nombre, precio y existencias iniciales; queda disponible para vender de inmediato.<\/li>\n<li>Un código que ya existe se rechaza y se indica con qué producto está registrado.<\/li>\n<li>El precio es un número entero de colones mayor que cero; las existencias son números enteros, no negativos al registrar o al ajustar.<\/li>\n<li>Cambiar el precio afecta solo a las ventas nuevas: una venta ya cobrada y una línea ya agregada a una venta abierta conservan el precio con que se vendieron.<\/li>\n<li>Una entrada de mercadería suma a las existencias; una merma resta y nunca deja las existencias negativas; un conteo físico fija las existencias al valor contado.<\/li>\n<li>La merma y el conteo exigen un motivo de al menos 10 caracteres <em>(supuesto)<\/em>.<\/li>\n<li>Cada venta cobrada descuenta las existencias de sus líneas, y una anulación autorizada las devuelve (ver <a href=\"#\" data-go=\"cu1\">CU-01<\/a> y <a href=\"#\" data-go=\"cu3\">CU-03<\/a>).<\/li>\n<li>Vender un producto con existencias insuficientes se permite con un aviso a la cajera; las existencias quedan negativas y la dueña las corrige con un conteo físico.<\/li>\n<li>Solo la dueña puede registrar productos, cambiar precios y mover existencias; el permiso se valida en el servidor.<\/li>\n<li>El alta de un producto, cada cambio de precio (con precio anterior y nuevo) y cada movimiento de existencias (con existencias antes y después) quedan en la bitácora (RNF-02).<\/li>\n<\/ol>\n<h2>Referencias<\/h2>\n<ul>\n<li><a href=\"#\" data-go=\"cu9\">CU-09<\/a>, <a href=\"#\" data-go=\"cu10\">CU-10<\/a>, <a href=\"#\" data-go=\"cu11\">CU-11<\/a><\/li>\n<li><a href=\"#\" data-go=\"cu9\">Backlog de CU-09<\/a>, <a href=\"#\" data-go=\"cu10\">de CU-10<\/a> y <a href=\"#\" data-go=\"cu11\">de CU-11<\/a><\/li>\n<li><a href=\"#\" data-go=\"rnf2\">RNF-02 Trazabilidad y auditoría<\/a><\/li>\n<li><a href=\"#\" data-go=\"rnf3\">RNF-03 Control de acceso y protección de credenciales<\/a><\/li>\n<\/ul>"}, {"id": "cu9", "tipo": "cu", "codigo": "CU-09", "titulo": "Registrar producto", "corto": "Registrar producto", "abstract": "Este caso de uso permite a la dueña dar de alta un producto en el catálogo con su código, nombre, precio y existencias iniciales, para que las cajeras lo puedan vender en caja (CU-01).", "chips": ["Primarios: Dueña", "4 flujos alternativos"], "rnfs": ["rnf2", "rnf3"], "rfs": [], "rf": "rf0", "realiza": null, "realizaEn": [], "html": "<h2>Título del Caso de Uso<\/h2>\n<p>CU-09 Registrar producto (atiende <a href=\"#\" data-go=\"rf0\">RF-00<\/a>)<\/p>\n<h2>Descripción<\/h2>\n<p>Este caso de uso permite a la dueña dar de alta un producto en el catálogo con su código, nombre, precio y existencias iniciales, para que las cajeras lo puedan vender en caja (<a href=\"#\" data-go=\"cu1\">CU-01<\/a>).<\/p>\n<p><strong>Límites de alcance de esta versión:<\/strong>\n- Solo se registran productos que se venden por unidad; los productos por peso quedan fuera de alcance.\n- Un producto registrado no se elimina ni se da de baja en esta versión; su precio se cambia con <a href=\"#\" data-go=\"cu10\">CU-10<\/a> y sus existencias con <a href=\"#\" data-go=\"cu11\">CU-11<\/a>.\n- No se registran categorías, costos, proveedores ni imágenes.<\/p>\n<h2>Actores<\/h2>\n<ul>\n<li><strong>Primarios<\/strong>: Dueña<\/li>\n<li><strong>Secundarios<\/strong>: Ninguno<\/li>\n<\/ul>\n<h2>Precondiciones<\/h2>\n<ul>\n<li>La dueña tiene su sesión administrativa abierta (<a href=\"#\" data-go=\"cu4\">CU-04<\/a>). La sesión administrativa no abre turno ni ocupa la caja.<\/li>\n<\/ul>\n<h2>Postcondiciones<\/h2>\n<ul>\n<li>El producto queda en el catálogo con su código, nombre, precio vigente y existencias iniciales, y está disponible para vender en <a href=\"#\" data-go=\"cu1\">CU-01<\/a>.<\/li>\n<li>La bitácora registra el alta con la dueña, la fecha, la hora, el código, el precio inicial y las existencias iniciales.<\/li>\n<\/ul>\n<h2>Flujo Principal<\/h2>\n<ol>\n<li>La dueña elige registrar un producto nuevo.<\/li>\n<li>La dueña indica el código (digitado o con el lector de código de barras), el nombre, el precio y las existencias iniciales. <span class=\"ref\">FA-01<\/span> <span class=\"ref\">FA-02<\/span> <span class=\"ref\">FA-03<\/span> <span class=\"ref\">FA-04<\/span><\/li>\n<li>El sistema registra el producto con ese precio como precio vigente y esas existencias.<\/li>\n<li>El sistema registra el alta en la bitácora y confirma a la dueña que el producto queda disponible para vender.<\/li>\n<\/ol>\n<h2>Flujos Alternativos<\/h2>\n<h3>FA-01: Código repetido<\/h3>\n<ol>\n<li>El sistema indica que el código ya está registrado y con qué nombre de producto.<\/li>\n<li>No se registra ningún producto.<\/li>\n<li>La dueña corrige el código y el caso de uso continúa en el paso 2 del flujo principal, o desiste y el caso de uso termina.<\/li>\n<\/ol>\n<h3>FA-02: Código o nombre faltante o inválido<\/h3>\n<ol>\n<li>El código está vacío o tiene más de 20 caracteres <em>(supuesto)<\/em>, o el nombre tiene menos de 3 o más de 60 caracteres <em>(supuesto)<\/em>.<\/li>\n<li>El sistema indica cuál dato falta o es inválido y no registra el producto; los demás datos escritos se conservan.<\/li>\n<li>El caso de uso continúa en el paso 2 del flujo principal.<\/li>\n<\/ol>\n<h3>FA-03: Precio inválido<\/h3>\n<ol>\n<li>El precio es cero, negativo, decimal (por ejemplo 1 200,50), no numérico o mayor que ₡1 000 000 <em>(supuesto)<\/em>.<\/li>\n<li>El sistema indica que el precio debe ser un número entero de colones mayor que cero y no registra el producto.<\/li>\n<li>El caso de uso continúa en el paso 2 del flujo principal.<\/li>\n<\/ol>\n<h3>FA-04: Existencias iniciales inválidas<\/h3>\n<ol>\n<li>Las existencias iniciales son negativas, decimales o no numéricas. Cero es válido: el producto se registra sin existencias.<\/li>\n<li>El sistema indica que deben ser un número entero mayor o igual que cero y no registra el producto.<\/li>\n<li>El caso de uso continúa en el paso 2 del flujo principal.<\/li>\n<\/ol>\n<h2>Prototipos<\/h2>\n<p>Boceto de baja fidelidad de la pantalla de registro de producto (el diseño final lo define el equipo de frontend):<\/p>\n<pre><code class=\"language-text\">+--------------------------------------------------+\n| Administración · Registrar producto              |\n+--------------------------------------------------+\n| Código:      [_____________]  (escanee o digite) |\n| Nombre:      [______________________________]    |\n| Precio (₡):  [_______]                           |\n| Existencias: [_______]                           |\n|                       [Registrar]   [Cancelar]   |\n+--------------------------------------------------+\n<\/code><\/pre>\n<h2>Requerimientos Especiales<\/h2>\n<ul>\n<li><strong>Seguridad<\/strong> (RNF-03): solo la dueña registra productos; la validación de permisos se hace en el servidor, no solo en la interfaz.<\/li>\n<li><strong>Seguridad<\/strong> (RNF-02): el alta del producto queda en la bitácora, que no se puede editar ni borrar desde la aplicación.<\/li>\n<li><strong>Regla de negocio<\/strong>: el código identifica un producto y no se repite.<\/li>\n<li><strong>Regla de negocio<\/strong>: el precio es un número entero de colones mayor que cero; las existencias son un número entero mayor o igual que cero.<\/li>\n<\/ul>\n<h2>Escenarios de Prueba<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Entrada<\/th>\n<th>Salida Esperada<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Flujo principal: la dueña registra el código «7441001000012», nombre «Arroz 1 kg», precio ₡1 200 y existencias 40<\/td>\n<td>Producto registrado con precio vigente de ₡1 200 y 40 unidades; disponible para vender; alta en la bitácora con la dueña, la fecha, la hora, el código, el precio inicial y las existencias iniciales<\/td>\n<\/tr>\n<tr>\n<td>Flujo principal: registrar «Leche 1 L» a ₡1 100 con existencias 0<\/td>\n<td>Producto registrado sin existencias y disponible para vender<\/td>\n<\/tr>\n<tr>\n<td>FA-01: registrar el código «7441001000012» que ya es de «Arroz 1 kg»<\/td>\n<td>Registro rechazado; mensaje de que el código ya está registrado como «Arroz 1 kg»; el catálogo no cambia<\/td>\n<\/tr>\n<tr>\n<td>FA-02: registrar sin código<\/td>\n<td>Registro rechazado; se indica que falta el código y se conservan los demás datos<\/td>\n<\/tr>\n<tr>\n<td>FA-02: registrar con el nombre «Aa»<\/td>\n<td>Registro rechazado; se indica que el nombre debe tener entre 3 y 60 caracteres<\/td>\n<\/tr>\n<tr>\n<td>FA-03: registrar con precio 0 o -500<\/td>\n<td>Registro rechazado; el precio debe ser un entero mayor que cero<\/td>\n<\/tr>\n<tr>\n<td>FA-03: registrar con precio 1 200,50 o «abc»<\/td>\n<td>Registro rechazado; el precio debe ser un número entero de colones<\/td>\n<\/tr>\n<tr>\n<td>FA-03: registrar con precio ₡1 000 001<\/td>\n<td>Registro rechazado; el precio supera el máximo de ₡1 000 000<\/td>\n<\/tr>\n<tr>\n<td>FA-04: registrar con existencias -1<\/td>\n<td>Registro rechazado; las existencias deben ser un entero mayor o igual que cero<\/td>\n<\/tr>\n<tr>\n<td>FA-04: registrar con existencias 2,5<\/td>\n<td>Registro rechazado; las existencias deben ser un número entero<\/td>\n<\/tr>\n<tr>\n<td>Postcondición: tras el registro, la cajera busca «Arroz 1 kg» en una venta<\/td>\n<td>El producto aparece con su precio vigente de ₡1 200<\/td>\n<\/tr>\n<tr>\n<td>Seguridad: una cajera intenta registrar un producto llamando a la API directamente<\/td>\n<td>Acceso denegado y el catálogo no cambia<\/td>\n<\/tr>\n<tr>\n<td>Seguridad: modificar o borrar el registro del alta en la bitácora<\/td>\n<td>La aplicación no ofrece la operación y el registro no cambia<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Guiones de prueba (Gherkin):<\/strong> <span class=\"ref\">h1<\/span>, <span class=\"ref\">h2<\/span>, <span class=\"ref\">h3<\/span>, <span class=\"ref\">h4<\/span>, <span class=\"ref\">h5<\/span>, <span class=\"ref\">h6<\/span>. Backlog: <a href=\"#\" data-go=\"cu9\">CU-09-backlog.md<\/a>.<\/p>"}, {"id": "cu10", "tipo": "cu", "codigo": "CU-10", "titulo": "Cambiar el precio de un producto", "corto": "Cambiar el precio de un producto", "abstract": "Este caso de uso permite a la dueña cambiar el precio vigente de un producto del catálogo cuando sube o baja, sin alterar las ventas ya hechas, y dejando constancia de quién lo cambió y de cuánto a cuánto.", "chips": ["Primarios: Dueña", "3 flujos alternativos"], "rnfs": ["rnf2", "rnf3"], "rfs": [], "rf": "rf0", "realiza": null, "realizaEn": [], "html": "<h2>Título del Caso de Uso<\/h2>\n<p>CU-10 Cambiar el precio de un producto (atiende <a href=\"#\" data-go=\"rf0\">RF-00<\/a>)<\/p>\n<h2>Descripción<\/h2>\n<p>Este caso de uso permite a la dueña cambiar el precio vigente de un producto del catálogo cuando sube o baja, sin alterar las ventas ya hechas, y dejando constancia de quién lo cambió y de cuánto a cuánto.<\/p>\n<p><strong>Límites de alcance de esta versión:<\/strong>\n- Se cambia el precio de un producto a la vez; no hay cambios masivos ni precios programados con fecha futura.\n- No se llevan promociones, descuentos ni listas de precios por cliente.<\/p>\n<h2>Actores<\/h2>\n<ul>\n<li><strong>Primarios<\/strong>: Dueña<\/li>\n<li><strong>Secundarios<\/strong>: Ninguno<\/li>\n<\/ul>\n<h2>Precondiciones<\/h2>\n<ul>\n<li>La dueña tiene su sesión administrativa abierta (<a href=\"#\" data-go=\"cu4\">CU-04<\/a>).<\/li>\n<li>El producto existe en el catálogo (<a href=\"#\" data-go=\"cu9\">CU-09<\/a>).<\/li>\n<\/ul>\n<h2>Postcondiciones<\/h2>\n<ul>\n<li>El producto tiene el nuevo precio como precio vigente.<\/li>\n<li>Las ventas ya cobradas conservan el precio con que se vendieron, y las líneas ya agregadas a una venta abierta conservan el precio con que se agregaron. Solo las líneas que se agreguen después usan el nuevo precio.<\/li>\n<li>La bitácora registra el cambio con la dueña, la fecha, la hora, el producto, el precio anterior y el precio nuevo.<\/li>\n<\/ul>\n<h2>Flujo Principal<\/h2>\n<ol>\n<li>La dueña busca el producto por código o por nombre. <span class=\"ref\">FA-01<\/span><\/li>\n<li>El sistema muestra el producto con su precio vigente.<\/li>\n<li>La dueña indica el nuevo precio. <span class=\"ref\">FA-02<\/span> <span class=\"ref\">FA-03<\/span><\/li>\n<li>El sistema actualiza el precio vigente del producto.<\/li>\n<li>El sistema registra el cambio en la bitácora (producto, precio anterior, precio nuevo, dueña, fecha y hora) y confirma que las ventas nuevas usarán el nuevo precio.<\/li>\n<\/ol>\n<h2>Flujos Alternativos<\/h2>\n<h3>FA-01: Producto no encontrado<\/h3>\n<ol>\n<li>El sistema indica «producto no encontrado».<\/li>\n<li>La dueña busca de nuevo y el caso de uso continúa en el paso 1 del flujo principal, o desiste y el caso de uso termina.<\/li>\n<\/ol>\n<h3>FA-02: Precio inválido<\/h3>\n<ol>\n<li>El nuevo precio es cero, negativo, decimal, no numérico o mayor que ₡1 000 000 <em>(supuesto)<\/em>.<\/li>\n<li>El sistema indica que el precio debe ser un número entero de colones mayor que cero, no cambia el precio y conserva el producto seleccionado.<\/li>\n<li>El caso de uso continúa en el paso 3 del flujo principal.<\/li>\n<\/ol>\n<h3>FA-03: El precio no cambia<\/h3>\n<ol>\n<li>El nuevo precio es igual al precio vigente.<\/li>\n<li>El sistema indica que el precio ya es ese, no cambia nada y no registra nada en la bitácora.<\/li>\n<li>El caso de uso termina.<\/li>\n<\/ol>\n<h2>Prototipos<\/h2>\n<p>Boceto de baja fidelidad de la pantalla de cambio de precio (el diseño final lo define el equipo de frontend):<\/p>\n<pre><code class=\"language-text\">+--------------------------------------------------+\n| Administración · Cambiar precio                  |\n+--------------------------------------------------+\n| Producto: [Arroz________]  [Buscar]              |\n| Arroz 1 kg · código 7441001000012                |\n| Precio vigente: ₡1 200                           |\n| Nuevo precio (₡): [_______]                      |\n|                      [Guardar]   [Cancelar]      |\n+--------------------------------------------------+\n<\/code><\/pre>\n<h2>Requerimientos Especiales<\/h2>\n<ul>\n<li><strong>Seguridad<\/strong> (RNF-03): solo la dueña cambia precios; la validación de permisos se hace en el servidor, no solo en la interfaz.<\/li>\n<li><strong>Seguridad<\/strong> (RNF-02): el cambio de precio, con el precio anterior y el nuevo, queda en la bitácora, que no se puede editar ni borrar desde la aplicación.<\/li>\n<li><strong>Regla de negocio<\/strong>: un cambio de precio nunca modifica ventas ya cobradas ni líneas ya agregadas a una venta abierta.<\/li>\n<li><strong>Regla de negocio<\/strong> <em>(supuesto)<\/em>: la dueña ya está identificada con su PIN en su sesión administrativa; el cambio de precio no pide una autorización adicional con PIN (<a href=\"#\" data-go=\"cu8\">CU-08<\/a>).<\/li>\n<\/ul>\n<h2>Escenarios de Prueba<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Entrada<\/th>\n<th>Salida Esperada<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Flujo principal: cambiar «Arroz 1 kg» de ₡1 200 a ₡1 300<\/td>\n<td>El precio vigente es ₡1 300; la bitácora registra el producto, ₡1 200 como precio anterior, ₡1 300 como precio nuevo, la dueña, la fecha y la hora<\/td>\n<\/tr>\n<tr>\n<td>Postcondición: una venta nueva agrega 1 «Arroz 1 kg» después del cambio<\/td>\n<td>La línea se agrega a ₡1 300<\/td>\n<\/tr>\n<tr>\n<td>Postcondición: una venta cobrada ayer con «Arroz 1 kg» a ₡1 200<\/td>\n<td>La venta sigue mostrando ₡1 200 en esa línea y su total no cambia<\/td>\n<\/tr>\n<tr>\n<td>Postcondición: una venta abierta con 1 «Arroz 1 kg» a ₡1 200 y la dueña cambia el precio a ₡1 300 antes de cobrar<\/td>\n<td>La línea ya agregada conserva ₡1 200; si la cajera agrega otra unidad después, esa línea usa ₡1 300<\/td>\n<\/tr>\n<tr>\n<td>FA-01: buscar el código «0000000»<\/td>\n<td>Mensaje «producto no encontrado»<\/td>\n<\/tr>\n<tr>\n<td>FA-02: nuevo precio 0 o -100<\/td>\n<td>Cambio rechazado; el precio vigente sigue siendo ₡1 200<\/td>\n<\/tr>\n<tr>\n<td>FA-02: nuevo precio 1 300,50 o «abc»<\/td>\n<td>Cambio rechazado; el precio debe ser un número entero de colones<\/td>\n<\/tr>\n<tr>\n<td>FA-02: nuevo precio ₡1 000 001<\/td>\n<td>Cambio rechazado; el precio supera el máximo de ₡1 000 000<\/td>\n<\/tr>\n<tr>\n<td>FA-03: nuevo precio ₡1 200 con precio vigente ₡1 200<\/td>\n<td>Mensaje de que el precio ya es ese; no hay registro nuevo en la bitácora<\/td>\n<\/tr>\n<tr>\n<td>Seguridad: una cajera intenta cambiar un precio llamando a la API directamente<\/td>\n<td>Acceso denegado y el precio no cambia<\/td>\n<\/tr>\n<tr>\n<td>Seguridad: modificar o borrar el registro del cambio de precio en la bitácora<\/td>\n<td>La aplicación no ofrece la operación y el registro no cambia<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Guiones de prueba (Gherkin):<\/strong> <span class=\"ref\">h1<\/span>, <span class=\"ref\">h2<\/span>, <span class=\"ref\">h3<\/span>, <span class=\"ref\">h4<\/span>, <span class=\"ref\">h5<\/span>. Backlog: <a href=\"#\" data-go=\"cu10\">CU-10-backlog.md<\/a>.<\/p>"}, {"id": "cu11", "tipo": "cu", "codigo": "CU-11", "titulo": "Registrar movimiento de existencias", "corto": "Registrar movimiento de existencias", "abstract": "Este caso de uso permite a la dueña mantener al día las existencias de un producto registrando una entrada de mercadería, una merma o un conteo físico. Las ventas y las anulaciones ajustan las existencias solas y no pasan por aquí.", "chips": ["Primarios: Dueña", "4 flujos alternativos"], "rnfs": ["rnf2", "rnf3"], "rfs": [], "rf": "rf0", "realiza": null, "realizaEn": [], "html": "<h2>Título del Caso de Uso<\/h2>\n<p>CU-11 Registrar movimiento de existencias (atiende <a href=\"#\" data-go=\"rf0\">RF-00<\/a>)<\/p>\n<h2>Descripción<\/h2>\n<p>Este caso de uso permite a la dueña mantener al día las existencias de un producto registrando una entrada de mercadería, una merma o un conteo físico. Las ventas y las anulaciones ajustan las existencias solas y no pasan por aquí.<\/p>\n<p><strong>Tipos de movimiento:<\/strong>\n- <strong>Entrada<\/strong>: llega mercadería y las existencias suben por la cantidad recibida.\n- <strong>Merma<\/strong>: se pierde mercadería (vencida, dañada, robada) y las existencias bajan por la cantidad perdida; exige un motivo.\n- <strong>Conteo físico<\/strong>: la dueña cuenta el producto y las existencias pasan a ser la cantidad contada; exige un motivo. Es la vía para corregir existencias negativas.<\/p>\n<p><strong>Límites de alcance de esta versión:<\/strong>\n- No hay proveedores, órdenes de compra, costos ni lotes con fecha de vencimiento.\n- No hay alertas de existencias mínimas ni reportes de inventario; la dueña ve las existencias de un producto al buscarlo.<\/p>\n<h2>Actores<\/h2>\n<ul>\n<li><strong>Primarios<\/strong>: Dueña<\/li>\n<li><strong>Secundarios<\/strong>: Ninguno<\/li>\n<\/ul>\n<h2>Precondiciones<\/h2>\n<ul>\n<li>La dueña tiene su sesión administrativa abierta (<a href=\"#\" data-go=\"cu4\">CU-04<\/a>).<\/li>\n<li>El producto existe en el catálogo (<a href=\"#\" data-go=\"cu9\">CU-09<\/a>).<\/li>\n<\/ul>\n<h2>Postcondiciones<\/h2>\n<ul>\n<li>Las existencias del producto reflejan el movimiento registrado.<\/li>\n<li>La bitácora registra el movimiento con la dueña, la fecha, la hora, el producto, el tipo, la cantidad, las existencias antes y después y, cuando aplique, el motivo.<\/li>\n<\/ul>\n<h2>Flujo Principal<\/h2>\n<ol>\n<li>La dueña busca el producto por código o por nombre. <span class=\"ref\">FA-01<\/span><\/li>\n<li>El sistema muestra el producto con sus existencias actuales.<\/li>\n<li>La dueña elige el tipo de movimiento (entrada, merma o conteo físico) e indica la cantidad y, en la merma y el conteo, el motivo. <span class=\"ref\">FA-02<\/span> <span class=\"ref\">FA-03<\/span> <span class=\"ref\">FA-04<\/span><\/li>\n<li>El sistema calcula las nuevas existencias y las registra.<\/li>\n<li>El sistema registra el movimiento en la bitácora (producto, tipo, cantidad, existencias antes y después, motivo, dueña, fecha y hora) y muestra las nuevas existencias.<\/li>\n<\/ol>\n<h2>Flujos Alternativos<\/h2>\n<h3>FA-01: Producto no encontrado<\/h3>\n<ol>\n<li>El sistema indica «producto no encontrado».<\/li>\n<li>La dueña busca de nuevo y el caso de uso continúa en el paso 1 del flujo principal, o desiste y el caso de uso termina.<\/li>\n<\/ol>\n<h3>FA-02: Cantidad inválida<\/h3>\n<ol>\n<li>La cantidad es cero, negativa, decimal o no numérica. En el conteo físico, cero es válido: el producto se cuenta sin existencias.<\/li>\n<li>El sistema indica que la cantidad debe ser un número entero (mayor que cero en la entrada y la merma, mayor o igual que cero en el conteo) y no registra el movimiento.<\/li>\n<li>El caso de uso continúa en el paso 3 del flujo principal.<\/li>\n<\/ol>\n<h3>FA-03: Motivo faltante o demasiado corto<\/h3>\n<ol>\n<li>En una merma o un conteo físico, el motivo está vacío o tiene menos de 10 caracteres <em>(supuesto)<\/em>.<\/li>\n<li>El sistema exige el motivo y no registra el movimiento; la cantidad escrita se conserva.<\/li>\n<li>El caso de uso continúa en el paso 3 del flujo principal.<\/li>\n<\/ol>\n<h3>FA-04: La merma supera las existencias<\/h3>\n<ol>\n<li>La cantidad de la merma es mayor que las existencias actuales.<\/li>\n<li>El sistema rechaza el movimiento porque dejaría las existencias negativas y sugiere registrar un conteo físico si las existencias del sistema están desactualizadas.<\/li>\n<li>El caso de uso continúa en el paso 3 del flujo principal.<\/li>\n<\/ol>\n<h2>Prototipos<\/h2>\n<p>Boceto de baja fidelidad de la pantalla de movimientos (el diseño final lo define el equipo de frontend):<\/p>\n<pre><code class=\"language-text\">+--------------------------------------------------+\n| Administración · Existencias                     |\n+--------------------------------------------------+\n| Producto: [Arroz________]  [Buscar]              |\n| Arroz 1 kg · Existencias actuales: 40            |\n| Movimiento: (o) Entrada ( ) Merma ( ) Conteo     |\n| Cantidad:   [_______]                            |\n| Motivo:     [______________________________]     |\n|                      [Registrar]   [Cancelar]    |\n+--------------------------------------------------+\n<\/code><\/pre>\n<h2>Requerimientos Especiales<\/h2>\n<ul>\n<li><strong>Seguridad<\/strong> (RNF-03): solo la dueña registra movimientos de existencias; la validación de permisos se hace en el servidor, no solo en la interfaz.<\/li>\n<li><strong>Seguridad<\/strong> (RNF-02): cada movimiento, con las existencias antes y después y el motivo, queda en la bitácora, que no se puede editar ni borrar desde la aplicación.<\/li>\n<li><strong>Regla de negocio<\/strong>: las existencias se expresan en números enteros.<\/li>\n<li><strong>Regla de negocio<\/strong>: a diferencia de la venta, que se permite con un aviso aunque no haya existencias (<a href=\"#\" data-go=\"cu1\">CU-01<\/a>), una merma nunca deja las existencias negativas; el conteo físico es la vía para corregirlas.<\/li>\n<\/ul>\n<h2>Escenarios de Prueba<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Entrada<\/th>\n<th>Salida Esperada<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Flujo principal: entrada de 24 unidades de «Arroz 1 kg» con 40 existencias<\/td>\n<td>Existencias de 64; la bitácora registra la entrada, la cantidad 24, existencias antes (40) y después (64), la dueña, la fecha y la hora<\/td>\n<\/tr>\n<tr>\n<td>Flujo principal: merma de 3 unidades de «Arroz 1 kg» con 40 existencias y motivo «Paquetes rotos al acomodar»<\/td>\n<td>Existencias de 37; la bitácora registra la merma, la cantidad, el motivo, existencias antes (40) y después (37)<\/td>\n<\/tr>\n<tr>\n<td>Flujo principal: conteo físico de «Arroz 1 kg» con 40 existencias en el sistema y 38 contadas, motivo «Conteo de fin de mes»<\/td>\n<td>Existencias de 38 y el movimiento registrado con existencias antes (40) y después (38)<\/td>\n<\/tr>\n<tr>\n<td>Flujo principal: conteo físico de un producto con existencias de -2 y 5 contadas, motivo «Corrección tras venta sin existencias»<\/td>\n<td>Existencias de 5<\/td>\n<\/tr>\n<tr>\n<td>FA-01: buscar el código «0000000»<\/td>\n<td>Mensaje «producto no encontrado»<\/td>\n<\/tr>\n<tr>\n<td>FA-02: entrada de 0, de -4, de 2,5 o de «abc»<\/td>\n<td>Movimiento rechazado; las existencias no cambian<\/td>\n<\/tr>\n<tr>\n<td>FA-02: conteo físico con cantidad 0 y motivo válido<\/td>\n<td>Existencias de 0 y movimiento registrado<\/td>\n<\/tr>\n<tr>\n<td>FA-03: merma de 3 sin motivo<\/td>\n<td>Movimiento rechazado; se exige el motivo y se conserva la cantidad<\/td>\n<\/tr>\n<tr>\n<td>FA-03: conteo físico con el motivo «ok»<\/td>\n<td>Movimiento rechazado; el motivo debe tener al menos 10 caracteres<\/td>\n<\/tr>\n<tr>\n<td>FA-04: merma de 50 con 40 existencias<\/td>\n<td>Movimiento rechazado; se indica que dejaría las existencias negativas y se sugiere el conteo físico; las existencias siguen en 40<\/td>\n<\/tr>\n<tr>\n<td>Seguridad: una cajera intenta registrar un movimiento llamando a la API directamente<\/td>\n<td>Acceso denegado y las existencias no cambian<\/td>\n<\/tr>\n<tr>\n<td>Seguridad: modificar o borrar el registro de un movimiento en la bitácora<\/td>\n<td>La aplicación no ofrece la operación y el registro no cambia<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Guiones de prueba (Gherkin):<\/strong> <span class=\"ref\">h1<\/span>, <span class=\"ref\">h2<\/span>, <span class=\"ref\">h3<\/span>, <span class=\"ref\">h4<\/span>, <span class=\"ref\">h5<\/span>, <span class=\"ref\">h6<\/span>. Backlog: <a href=\"#\" data-go=\"cu11\">CU-11-backlog.md<\/a>.<\/p>"}, {"id": "rf1", "tipo": "rf", "codigo": "RF-01", "titulo": "Registrar ventas en caja", "corto": "Registrar ventas en caja", "abstract": "El sistema debe permitir a la cajera registrar los productos que lleva un cliente, calcular el total y cobrarlo en efectivo, SINPE Móvil, tarjeta o una combinación de medios, y emitir el comprobante. Cada venta queda registrada con sus líneas, medio de pago, cajera, fecha y hora.", "chips": ["Actores: cajera"], "rnfs": ["rnf1"], "rfs": [], "realiza": null, "realizaEn": [], "html": "<h2>Descripción<\/h2>\n<p>El sistema debe permitir a la cajera registrar los productos que lleva un cliente, calcular el total y cobrarlo en efectivo, SINPE Móvil, tarjeta o una combinación de medios, y emitir el comprobante. Cada venta queda registrada con sus líneas, medio de pago, cajera, fecha y hora.<\/p>\n<p><strong>Límites de alcance y supuestos:<\/strong>\n- Solo se venden cantidades enteras; los productos por peso (carnicería, frutas y verduras a granel) quedan fuera de alcance de esta versión.\n- El catálogo de productos y sus existencias los mantiene la dueña con <a href=\"#\" data-go=\"rf0\">RF-00<\/a>; este requerimiento solo los consume. Vender sin existencias suficientes se permite con un aviso.\n- El comprobante es un comprobante no tributario; la factura electrónica ante Hacienda queda fuera de alcance.\n- No hay flujo para que la cajera abandone o cancele una venta abierta sin cobrar en esta versión; solo la cancela el cierre forzado del turno por la dueña (RF-04). Una venta a fiado en espera de autorización (ver RF-02) no cuenta como venta abierta.<\/p>\n<p><strong>Actores:<\/strong> cajera.<\/p>\n<h2>Necesidad<\/h2>\n<p>Corresponde al problema 2 de <span class=\"ref\">problema.md<\/span>: el cobro es lento en las horas pico porque hay una sola caja y todo se suma a mano. Registrar la venta en el sistema es la base para cobrar más rápido y para saber qué se vendió y quién lo cobró.<\/p>\n<h2>Proceso Actual<\/h2>\n<p>La cajera suma los montos en una registradora que no guarda historial, o con calculadora si hay dudas. Cobra en efectivo, SINPE Móvil o tarjeta. El datafono falla a veces y alarga la fila <em>(supuesto)<\/em>. No queda registro de las líneas vendidas ni de quién cobró.<\/p>\n<h2>Solución Propuesta<\/h2>\n<p>Una pantalla de caja donde la cajera agrega productos por código o búsqueda, ve el total en vivo y cobra con uno o varios medios de pago. El sistema calcula el vuelto, rechaza datos inválidos sin perder la venta y emite el comprobante.<\/p>\n<h2>Documentos de Referencia<\/h2>\n<ul>\n<li><span class=\"ref\">Caso Minisúper La Esquina, secciones 3, 4.1 y 5.1<\/span><\/li>\n<li><span class=\"ref\">Descripción del problema<\/span><\/li>\n<\/ul>\n<h2>Casos de Uso Relacionados<\/h2>\n<ul>\n<li><a href=\"#\" data-go=\"cu1\">CU-01 Registrar venta en caja<\/a><\/li>\n<\/ul>\n<h2>Criterios de Aceptación<\/h2>\n<ol>\n<li>El total de la venta es la suma de cantidad por precio de cada línea.<\/li>\n<li>El vuelto es el monto recibido en efectivo menos el saldo pendiente; con monto insuficiente no se permite cobrar.<\/li>\n<li>Un producto inexistente o una cantidad cero, negativa, decimal (por ejemplo 1,5) o no numérica se rechaza, porque las cantidades son enteras, sin perder las líneas ya registradas.<\/li>\n<li>La cajera puede quitar una línea antes de cobrar y el total se recalcula.<\/li>\n<li>Se puede cobrar con efectivo, SINPE Móvil (con referencia), tarjeta (con autorización) o pago mixto.<\/li>\n<li>Una venta cobrada queda registrada con cajera, fecha, hora, líneas y medio de pago, y no se puede editar.<\/li>\n<li>Con una cajera con práctica y un lector de código de barras, vender un producto en efectivo toma 4 acciones o menos y una venta de 5 productos en efectivo toma 60 s o menos (ver RNF-01).<\/li>\n<li>Solo el efectivo puede exceder el saldo pendiente y generar vuelto; un pago con SINPE Móvil o con tarjeta no puede exceder el saldo pendiente. En un pago mixto, el saldo pendiente se muestra hasta cubrir el total y la tarjeta se puede combinar con otros medios en cualquier orden.<\/li>\n<li>Al cobrar, el sistema emite un comprobante no tributario que contiene las líneas, el total, el monto desglosado por medio de pago (efectivo con monto recibido y vuelto, SINPE Móvil con su referencia y tarjeta con su autorización), la cajera, la fecha y la hora; no es la factura electrónica.<\/li>\n<li>Las cantidades de las líneas son siempre números enteros.<\/li>\n<li>Cada línea toma el precio vigente del producto al agregarla y lo conserva aunque el precio cambie después.<\/li>\n<li>Al cobrar, el sistema descuenta de las existencias la cantidad de cada línea.<\/li>\n<li>Si la cantidad supera las existencias del producto, el sistema avisa a la cajera y permite seguir; las existencias quedan negativas hasta que la dueña las corrija.<\/li>\n<\/ol>\n<h2>Referencias<\/h2>\n<ul>\n<li><a href=\"#\" data-go=\"cu1\">CU-01<\/a><\/li>\n<li><a href=\"#\" data-go=\"rf0\">RF-00 Administrar inventario<\/a><\/li>\n<li><a href=\"#\" data-go=\"cu1\">Backlog de CU-01<\/a><\/li>\n<li><a href=\"#\" data-go=\"rnf1\">RNF-01 Usabilidad en caja<\/a><\/li>\n<\/ul>"}, {"id": "cu1", "tipo": "cu", "codigo": "CU-01", "titulo": "Registrar venta en caja", "corto": "Registrar venta en caja", "abstract": "Este caso de uso permite a la cajera registrar los productos que lleva un cliente, calcular el total y cobrarlo en efectivo, con SINPE Móvil, con tarjeta o con una combinación de medios, y emitir el comprobante.", "chips": ["Primarios: Cajera", "Secundarios: Datafono", "9 flujos alternativos"], "rnfs": ["rnf1"], "rfs": [], "rf": "rf1", "realiza": null, "realizaEn": [], "html": "<h2>Título del Caso de Uso<\/h2>\n<p>CU-01 Registrar venta en caja (atiende <a href=\"#\" data-go=\"rf1\">RF-01<\/a>)<\/p>\n<h2>Descripción<\/h2>\n<p>Este caso de uso permite a la cajera registrar los productos que lleva un cliente, calcular el total y cobrarlo en efectivo, con SINPE Móvil, con tarjeta o con una combinación de medios, y emitir el comprobante.<\/p>\n<p><strong>Límites de alcance de esta versión:<\/strong>\n- Solo se venden cantidades enteras (1, 2, 3…). Los productos por peso (carnicería, frutas y verduras a granel) quedan fuera de alcance.\n- El catálogo y las existencias los mantiene la dueña (<a href=\"#\" data-go=\"cu9\">CU-09<\/a>, <a href=\"#\" data-go=\"cu10\">CU-10<\/a> y <a href=\"#\" data-go=\"cu11\">CU-11<\/a>); la cajera solo vende.\n- El comprobante es un comprobante no tributario; la factura electrónica ante Hacienda queda fuera de alcance.\n- No hay un flujo para que la cajera abandone o cancele una venta abierta que no se cobra (solo la cancela el cierre forzado del turno por la dueña, <a href=\"#\" data-go=\"cu4\">CU-04<\/a>); una venta cobrada solo se anula con <a href=\"#\" data-go=\"cu3\">CU-03<\/a>. Una venta a fiado que espera autorización está en un estado propio («en espera de autorización», ver <a href=\"#\" data-go=\"cu2\">CU-02<\/a>) y no cuenta como venta abierta.<\/p>\n<h2>Actores<\/h2>\n<ul>\n<li><strong>Primarios<\/strong>: Cajera<\/li>\n<li><strong>Secundarios<\/strong>: Datafono (sistema externo, solo en el cobro con tarjeta)<\/li>\n<\/ul>\n<h2>Precondiciones<\/h2>\n<ul>\n<li>La cajera tiene la sesión de caja abierta (<a href=\"#\" data-go=\"cu4\">CU-04<\/a>).<\/li>\n<li>Hay una caja activa.<\/li>\n<li>Los productos a vender están registrados en el catálogo (<a href=\"#\" data-go=\"cu9\">CU-09<\/a>) con código, nombre, precio vigente y existencias.<\/li>\n<\/ul>\n<h2>Postcondiciones<\/h2>\n<ul>\n<li>La venta queda registrada como cobrada con sus líneas, medio o medios de pago, cajera, fecha y hora.<\/li>\n<li>Se descontaron las existencias de cada línea de la venta. Si algún producto no tenía existencias suficientes, sus existencias quedaron negativas y la cajera recibió un aviso (<span class=\"ref\">FA-09<\/span>).<\/li>\n<li>Se emitió el comprobante no tributario de la venta, con el monto desglosado por medio de pago.<\/li>\n<li>Una venta cobrada no se puede editar; solo anular (<a href=\"#\" data-go=\"cu3\">CU-03<\/a>).<\/li>\n<\/ul>\n<h2>Flujo Principal<\/h2>\n<ol>\n<li>La cajera inicia una venta nueva.<\/li>\n<li>La cajera indica el producto (por código o por búsqueda por nombre) y la cantidad. <span class=\"ref\">FA-01<\/span> <span class=\"ref\">FA-02<\/span><\/li>\n<li>El sistema agrega la línea con el precio vigente del producto y actualiza el total. <span class=\"ref\">FA-09<\/span><\/li>\n<li>La cajera repite los pasos 2 y 3 por cada producto. <span class=\"ref\">FA-03<\/span><\/li>\n<li>La cajera indica que va a cobrar. <span class=\"ref\">FA-08<\/span><\/li>\n<li>La cajera elige el medio de pago y registra el monto recibido. <span class=\"ref\">FA-04<\/span> <span class=\"ref\">FA-05<\/span> <span class=\"ref\">FA-06<\/span> <span class=\"ref\">FA-07<\/span><\/li>\n<li>El sistema calcula el vuelto, registra la venta como cobrada y descuenta de las existencias la cantidad de cada línea.<\/li>\n<li>El sistema emite el comprobante no tributario, que contiene las líneas, el total, el monto desglosado por medio de pago, la cajera, la fecha y la hora. El desglose muestra el efectivo con el monto recibido y el vuelto, el SINPE Móvil con su referencia y la tarjeta con su autorización. No es la factura electrónica.<\/li>\n<\/ol>\n<h2>Flujos Alternativos<\/h2>\n<h3>FA-01: Producto no encontrado<\/h3>\n<ol>\n<li>El sistema indica «producto no encontrado» y conserva las líneas de la venta.<\/li>\n<li>La cajera busca el producto de nuevo o desiste de agregarlo.<\/li>\n<li>Si busca de nuevo, el caso de uso continúa en el paso 2 del flujo principal; si desiste, continúa en el paso 4.<\/li>\n<\/ol>\n<h3>FA-02: Cantidad inválida<\/h3>\n<ol>\n<li>El sistema rechaza la cantidad (cero, negativa, decimal como 1,5 o no numérica) porque debe ser un número entero, y conserva las líneas de la venta.<\/li>\n<li>La cajera corrige la cantidad.<\/li>\n<li>El caso de uso continúa en el paso 2 del flujo principal.<\/li>\n<\/ol>\n<h3>FA-03: Quitar una línea<\/h3>\n<ol>\n<li>La cajera selecciona una línea y la quita.<\/li>\n<li>El sistema elimina la línea y recalcula el total.<\/li>\n<li>El caso de uso continúa en el paso 4 del flujo principal.<\/li>\n<\/ol>\n<h3>FA-04: Pago con SINPE Móvil<\/h3>\n<ol>\n<li>La cajera elige SINPE Móvil y registra la referencia del pago.<\/li>\n<li>El sistema verifica que la referencia fue ingresada y que no está registrada en otra venta.<\/li>\n<li>Si la referencia es válida, el caso de uso continúa en el paso 7 del flujo principal, sin vuelto.<\/li>\n<li>Si la referencia falta o está repetida, el sistema no cobra, indica el motivo y la cajera la corrige; el caso de uso continúa en el paso 6 del flujo principal.<\/li>\n<\/ol>\n<h3>FA-05: Pago con tarjeta<\/h3>\n<ol>\n<li>La cajera elige tarjeta y el datafono procesa la transacción.<\/li>\n<li>Si el datafono aprueba, el sistema registra la autorización y el caso de uso continúa en el paso 7.<\/li>\n<li>Si el datafono rechaza o no responde, el sistema avisa, la venta sigue abierta y la cajera reintenta o elige otro medio de pago.<\/li>\n<\/ol>\n<h3>FA-06: Monto recibido insuficiente<\/h3>\n<ol>\n<li>El sistema no permite cobrar y muestra el faltante.<\/li>\n<li>La cajera corrige el monto, cambia el medio de pago o lo registra como pago parcial (<span class=\"ref\">FA-07<\/span>).<\/li>\n<li>Si corrige el monto o cambia el medio de pago, el caso de uso continúa en el paso 6 del flujo principal.<\/li>\n<\/ol>\n<h3>FA-07: Pago mixto<\/h3>\n<ol>\n<li>La cajera registra un pago parcial con un medio de pago.<\/li>\n<li>El sistema acumula el pago y muestra el saldo pendiente. Solo el pago en efectivo puede exceder el saldo pendiente y el exceso es vuelto; un pago con SINPE Móvil o con tarjeta no puede exceder el saldo pendiente y, si lo excede, el sistema lo rechaza (sin enviarlo al datafono en el caso de la tarjeta). La tarjeta se puede combinar con otros medios en cualquier orden.<\/li>\n<li>La cajera repite los pasos 1 y 2 hasta cubrir el total y el caso de uso continúa en el paso 7.<\/li>\n<\/ol>\n<h3>FA-08: Venta sin líneas<\/h3>\n<ol>\n<li>El sistema no permite cobrar y indica que no hay productos en la venta.<\/li>\n<li>La cajera agrega productos.<\/li>\n<li>El caso de uso continúa en el paso 2 del flujo principal.<\/li>\n<\/ol>\n<h3>FA-09: Existencias insuficientes<\/h3>\n<ol>\n<li>La cantidad indicada, sumada a lo ya agregado de ese producto en la venta, supera las existencias que el sistema tiene del producto (o están en cero).<\/li>\n<li>El sistema agrega la línea igual y avisa a la cajera «existencias insuficientes: quedan N» (con N las existencias actuales); el aviso no bloquea la venta.<\/li>\n<li>El caso de uso continúa en el paso 4 del flujo principal. Al cobrar, las existencias del producto quedan negativas hasta que la dueña las corrija con un conteo físico (<a href=\"#\" data-go=\"cu11\">CU-11<\/a>).<\/li>\n<\/ol>\n<h2>Prototipos<\/h2>\n<p>Boceto de baja fidelidad de la pantalla de caja (el diseño final lo define el equipo de frontend):<\/p>\n<pre><code class=\"language-text\">+------------------------------------------------------------+\n| Caja abierta: Yendry                          [Cerrar turno]|\n+------------------------------------------------------------+\n| Producto o código: [_____________]  Cant: [1]  [Agregar]    |\n+------------------------------------------------------------+\n| Producto            Cant   Precio   Subtotal      [Quitar]   |\n| Arroz 1 kg            2    1 200      2 400        [x]       |\n| Leche 1 L             1    1 100      1 100        [x]       |\n+------------------------------------------------------------+\n|                                  TOTAL:  ₡3 500             |\n| Medio: (o) Efectivo ( ) SINPE ( ) Tarjeta ( ) Fiado         |\n| Recibido: [_______]  Vuelto: ₡0           [Cobrar]          |\n+------------------------------------------------------------+\n<\/code><\/pre>\n<p>La opción «Fiado» del boceto la atiende <a href=\"#\" data-go=\"cu2\">CU-02<\/a>; este caso de uso cubre efectivo, SINPE Móvil, tarjeta y pago mixto.<\/p>\n<h2>Requerimientos Especiales<\/h2>\n<ul>\n<li><strong>Usabilidad<\/strong> (RNF-01, <em>supuestos<\/em>): con una cajera con práctica y un lector de código de barras, vender un producto en efectivo requiere 4 acciones o menos y una venta de 5 productos en efectivo, desde iniciarla hasta emitir el comprobante, toma 60 s o menos; cada operación del servidor responde en menos de 500 ms. Para lograrlo, el efectivo es el medio de pago preseleccionado y la cantidad es 1 por omisión.<\/li>\n<li><strong>Seguridad<\/strong> (RNF-03): cada venta queda asociada a la cajera con la sesión abierta.<\/li>\n<li><strong>Regla de negocio<\/strong>: el total es la suma de cantidad por precio de cada línea; el vuelto es el monto recibido en efectivo menos el saldo pendiente. Las cantidades son enteras.<\/li>\n<li><strong>Regla de negocio<\/strong>: solo el efectivo puede exceder el saldo pendiente y generar vuelto; SINPE Móvil y tarjeta no.<\/li>\n<li><strong>Regla de negocio<\/strong>: una venta cobrada no se edita, solo se anula.<\/li>\n<li><strong>Regla de negocio<\/strong>: cada línea toma el precio vigente del producto al agregarla y lo conserva aunque la dueña cambie el precio después (<a href=\"#\" data-go=\"cu10\">CU-10<\/a>).<\/li>\n<li><strong>Regla de negocio<\/strong>: cobrar descuenta las existencias; vender sin existencias suficientes se permite con un aviso (decisión del negocio) y el inventario puede quedar negativo.<\/li>\n<\/ul>\n<h2>Escenarios de Prueba<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Entrada<\/th>\n<th>Salida Esperada<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Flujo principal: venta abierta con 1 «Arroz 1 kg» a ₡1 200, cobro en efectivo con ₡2 000<\/td>\n<td>Venta cobrada por ₡1 200, vuelto de ₡800 y comprobante no tributario emitido con líneas, total, efectivo con monto recibido (₡2 000) y vuelto, cajera, fecha y hora<\/td>\n<\/tr>\n<tr>\n<td>Flujo principal: 2 «Arroz 1 kg» y 1 «Leche 1 L»<\/td>\n<td>Total de ₡3 500<\/td>\n<\/tr>\n<tr>\n<td>FA-01: código «9999999» inexistente<\/td>\n<td>Mensaje «producto no encontrado»; la venta conserva líneas y total<\/td>\n<\/tr>\n<tr>\n<td>FA-02: cantidad 0, -2 o «abc»<\/td>\n<td>Cantidad rechazada; la venta conserva líneas y total<\/td>\n<\/tr>\n<tr>\n<td>FA-02: cantidad decimal 1,5<\/td>\n<td>Cantidad rechazada por no ser entera; la venta conserva líneas y total<\/td>\n<\/tr>\n<tr>\n<td>Flujo principal: 1 «Leche 1 L» a ₡1 100, cobro en efectivo con ₡1 100<\/td>\n<td>Venta cobrada por ₡1 100 y vuelto de ₡0<\/td>\n<\/tr>\n<tr>\n<td>FA-03: quitar la línea de «Leche 1 L» de una venta con 2 líneas<\/td>\n<td>La venta queda con «Arroz 1 kg» y el total es ₡1 200<\/td>\n<\/tr>\n<tr>\n<td>FA-04: SINPE Móvil con referencia «SM-123456»<\/td>\n<td>Venta cobrada por ₡1 200, referencia registrada y sin vuelto<\/td>\n<\/tr>\n<tr>\n<td>FA-04: SINPE Móvil sin referencia<\/td>\n<td>Venta no cobrada; se pide la referencia<\/td>\n<\/tr>\n<tr>\n<td>FA-04: SINPE Móvil con la referencia «SM-123456» ya registrada en otra venta<\/td>\n<td>Venta no cobrada; se indica que la referencia ya fue usada<\/td>\n<\/tr>\n<tr>\n<td>FA-05: datafono aprueba con autorización «AUT-778899»<\/td>\n<td>Venta cobrada, autorización registrada y comprobante no tributario emitido<\/td>\n<\/tr>\n<tr>\n<td>FA-05: datafono rechaza<\/td>\n<td>Venta no cobrada, sigue abierta y se muestra el rechazo<\/td>\n<\/tr>\n<tr>\n<td>FA-05: datafono sin señal<\/td>\n<td>Venta no cobrada, sigue abierta; se indica que el datafono no respondió y la cajera puede reintentar o cambiar de medio de pago<\/td>\n<\/tr>\n<tr>\n<td>FA-06: total ₡1 200 y monto recibido ₡1 000<\/td>\n<td>Venta no cobrada; se muestra un faltante de ₡200<\/td>\n<\/tr>\n<tr>\n<td>FA-07: total ₡3 500, ₡2 000 en efectivo y ₡1 500 con SINPE Móvil<\/td>\n<td>Venta cobrada por ₡3 500 y sin vuelto<\/td>\n<\/tr>\n<tr>\n<td>FA-07: total ₡3 500, ₡1 000 con tarjeta (autorización «AUT-112233»), ₡1 000 con SINPE Móvil (referencia «SM-654321») y ₡1 500 en efectivo recibiendo ₡2 000<\/td>\n<td>Venta cobrada por ₡3 500; el comprobante desglosa ₡1 500 en efectivo con ₡2 000 recibidos y vuelto de ₡500, ₡1 000 con SINPE Móvil con su referencia y ₡1 000 con tarjeta con su autorización<\/td>\n<\/tr>\n<tr>\n<td>FA-07: total ₡3 500 y solo ₡2 000 en efectivo<\/td>\n<td>Venta abierta con saldo pendiente de ₡1 500<\/td>\n<\/tr>\n<tr>\n<td>FA-07: total ₡3 500 y un pago de ₡4 000 con SINPE Móvil<\/td>\n<td>Pago rechazado; se indica que excede el saldo pendiente de ₡3 500<\/td>\n<\/tr>\n<tr>\n<td>FA-07: total ₡3 500 y un pago de ₡4 000 con tarjeta<\/td>\n<td>Pago rechazado sin enviarlo al datafono; se indica que excede el saldo pendiente de ₡3 500 y la venta sigue abierta<\/td>\n<\/tr>\n<tr>\n<td>FA-07: total ₡3 500, ₡1 500 con SINPE Móvil y ₡2 500 en efectivo<\/td>\n<td>Venta cobrada por ₡3 500 y vuelto de ₡500<\/td>\n<\/tr>\n<tr>\n<td>FA-07: total ₡3 500, ₡1 500 con tarjeta aprobada y ₡2 000 en efectivo<\/td>\n<td>Venta cobrada por ₡3 500 y sin vuelto<\/td>\n<\/tr>\n<tr>\n<td>Postcondición: quitar una línea de una venta ya cobrada<\/td>\n<td>Operación rechazada; la venta cobrada no cambia<\/td>\n<\/tr>\n<tr>\n<td>FA-08: cobrar una venta sin líneas<\/td>\n<td>Venta no cobrada; mensaje de que no hay productos<\/td>\n<\/tr>\n<tr>\n<td>Postcondición: cobrar 2 «Arroz 1 kg» con 40 existencias<\/td>\n<td>Venta cobrada y existencias de «Arroz 1 kg» en 38<\/td>\n<\/tr>\n<tr>\n<td>Postcondición: agregar una línea de «Arroz 1 kg» cuando el precio vigente es ₡1 300<\/td>\n<td>La línea se agrega a ₡1 300<\/td>\n<\/tr>\n<tr>\n<td>FA-09: agregar 3 «Arroz 1 kg» con 1 existencia<\/td>\n<td>Línea agregada con el aviso «existencias insuficientes: quedan 1»; la venta sigue y se puede cobrar<\/td>\n<\/tr>\n<tr>\n<td>FA-09: cobrar esa venta de 3 «Arroz 1 kg» con 1 existencia<\/td>\n<td>Venta cobrada y existencias de «Arroz 1 kg» en -2<\/td>\n<\/tr>\n<tr>\n<td>FA-09: agregar 1 «Leche 1 L» con 0 existencias<\/td>\n<td>Línea agregada con el aviso «existencias insuficientes: quedan 0»<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Guiones de prueba (Gherkin):<\/strong> <span class=\"ref\">h1<\/span>, <span class=\"ref\">h2<\/span>, <span class=\"ref\">h3<\/span>, <span class=\"ref\">h4<\/span>, <span class=\"ref\">h5<\/span>, <span class=\"ref\">h6<\/span>, <span class=\"ref\">h7<\/span>, <span class=\"ref\">h8<\/span>, <span class=\"ref\">h9<\/span>. Backlog: <a href=\"#\" data-go=\"cu1\">CU-01-backlog.md<\/a>.<\/p>"}, {"id": "rf2", "tipo": "rf", "codigo": "RF-02", "titulo": "Vender a fiado", "corto": "Vender a fiado", "abstract": "El sistema debe permitir a la cajera registrar una venta a la cuenta de fiado de un cliente que tenga cuenta y crédito disponible. Para montos mayores a ₡20 000 (supuesto) debe exigir la autorización de la dueña. El saldo de la cuenta aumenta por el total de la venta.", "chips": ["Actores: cajera (registra la venta), dueña (autoriza montos altos)"], "rnfs": ["rnf2"], "rfs": [], "realiza": null, "realizaEn": [], "html": "<h2>Descripción<\/h2>\n<p>El sistema debe permitir a la cajera registrar una venta a la cuenta de fiado de un cliente que tenga cuenta y crédito disponible. Para montos mayores a ₡20 000 <em>(supuesto)<\/em> debe exigir la autorización de la dueña. El saldo de la cuenta aumenta por el total de la venta.<\/p>\n<p><strong>Actores:<\/strong> cajera (registra la venta), dueña (autoriza montos altos).<\/p>\n<h2>Necesidad<\/h2>\n<p>Corresponde al problema 3 de <span class=\"ref\">problema.md<\/span>: el fiado vive en un cuaderno que solo maneja Doña
