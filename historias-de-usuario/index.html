Marta, sin límite que se aplique solo ni autorización registrada. Sin este control, el negocio no sabe cuánto se le debe ni quién aprobó cada crédito.<\/p>\n<h2>Proceso Actual<\/h2>\n<p>Ver el proceso «Vender a fiado» en <span class=\"ref\">vender-fiado-bpmn.svg<\/span>. El cliente pide fiado, la cajera busca la cuenta en el cuaderno, se revisa el crédito disponible y, si hay margen, se anota la compra. El cuaderno es el único registro; su pérdida o ilegibilidad es un riesgo que hoy nadie mitiga.<\/p>\n<h2>Solución Propuesta<\/h2>\n<p>El sistema guarda las cuentas de fiado con su límite y saldo. Al elegir al cliente, muestra el crédito disponible y aplica las reglas de la tabla de decisión del caso de uso. Los fiados mayores al umbral pasan al estado «en espera de autorización» hasta que la dueña los autorice o rechace con su PIN en la misma caja, sin abrir turno. Una venta en espera no cuenta como venta abierta: libera la caja para atender a otros clientes y no bloquea el cierre de turno de la cajera. No reserva crédito y el crédito se revalida al autorizar. No hay tiempo máximo de respuesta; la venta en espera caduca al cerrar el día y se descarta sin cobrarse <em>(supuesto)<\/em>.<\/p>\n<h2>Documentos de Referencia<\/h2>\n<ul>\n<li><span class=\"ref\">Caso Minisúper La Esquina, sección 4.2<\/span><\/li>\n<li><span class=\"ref\">Descripción del problema<\/span><\/li>\n<\/ul>\n<h2>Casos de Uso Relacionados<\/h2>\n<ul>\n<li><a href=\"#\" data-go=\"cu2\">CU-02 Vender a fiado<\/a><\/li>\n<\/ul>\n<h2>Criterios de Aceptación<\/h2>\n<ol>\n<li>Si el cliente no existe o no tiene cuenta de fiado, la venta no se cobra a crédito y sigue abierta.<\/li>\n<li>Si el total supera el crédito disponible (límite menos saldo), la venta no se cobra a crédito.<\/li>\n<li>Si el total es mayor a ₡20 000, la venta pasa a «en espera de autorización», deja de contar como venta abierta y la caja queda libre para otra venta. Si la dueña autoriza, se cobra a crédito; si rechaza, el saldo no cambia y la venta vuelve a ser venta abierta de la cajera siempre que su turno siga abierto y no tenga otra venta abierta (en otro caso se descarta) <em>(supuesto)<\/em>. Solo la dueña puede autorizar o rechazar (ver RNF-03).<\/li>\n<li>Con cuenta, crédito suficiente y total de ₡20 000 o menos, la venta queda cobrada a crédito, el saldo aumenta por el total y se emite el comprobante con el saldo resultante.<\/li>\n<li>El saldo de una cuenta nunca supera su límite, ni siquiera con dos intentos de fiado simultáneos al mismo cliente ni al autorizar una venta en espera. Al autorizar se revalida el crédito; si cambió y ya no alcanza, el fiado se rechaza. La venta en espera no reserva crédito y el saldo no cambia mientras está en espera.<\/li>\n<li>La pantalla muestra límite, saldo, crédito disponible y total; la cajera confirma después de verlos.<\/li>\n<li>Cada autorización, rechazo y caducidad queda en la bitácora (ver RNF-02).<\/li>\n<li>Una venta en espera caduca al cerrar el día <em>(supuesto)<\/em>: la dueña ya no puede autorizarla, la venta se descarta sin cobrarse y el saldo no cambia. Si la cajera cierra su turno antes, la venta sigue en espera hasta que la dueña resuelva o se cierre el día.<\/li>\n<\/ol>\n<h2>Referencias<\/h2>\n<ul>\n<li><a href=\"#\" data-go=\"cu2\">CU-02<\/a><\/li>\n<li><a href=\"#\" data-go=\"cu2\">Backlog de CU-02<\/a><\/li>\n<li><a href=\"#\" data-go=\"rnf2\">RNF-02 Trazabilidad y auditoría<\/a><\/li>\n<\/ul>"}, {"id": "cu2", "tipo": "cu", "codigo": "CU-02", "titulo": "Vender a fiado", "corto": "Vender a fiado", "abstract": "Este caso de uso permite a la cajera cobrar una venta a la cuenta de fiado de un cliente que tenga cuenta y crédito disponible.", "chips": ["Primarios: Cajera", "Secundarios: Dueña", "6 flujos alternativos"], "rnfs": ["rnf2"], "rfs": [], "rf": "rf2", "realiza": null, "realizaEn": [], "html": "<h2>Título del Caso de Uso<\/h2>\n<p>CU-02 Vender a fiado (atiende <a href=\"#\" data-go=\"rf2\">RF-02<\/a>)<\/p>\n<h2>Descripción<\/h2>\n<p>Este caso de uso permite a la cajera cobrar una venta a la cuenta de fiado de un cliente que tenga cuenta y crédito disponible. Para montos altos requiere la autorización de la dueña: mientras espera, la venta pasa a un estado propio, «en espera de autorización», que no cuenta como venta abierta y libera la caja para atender a otros clientes.<\/p>\n<h2>Actores<\/h2>\n<ul>\n<li><strong>Primarios<\/strong>: Cajera<\/li>\n<li><strong>Secundarios<\/strong>: Dueña (autoriza los montos mayores a ₡20 000 con su PIN en la misma caja; su sesión es administrativa, no abre turno ni ocupa la caja)<\/li>\n<\/ul>\n<h2>Precondiciones<\/h2>\n<ul>\n<li>La cajera tiene la sesión de caja abierta (<a href=\"#\" data-go=\"cu4\">CU-04<\/a>).<\/li>\n<li>Existe una venta abierta con al menos una línea (<a href=\"#\" data-go=\"cu1\">CU-01<\/a>).<\/li>\n<\/ul>\n<h2>Postcondiciones<\/h2>\n<ul>\n<li>La venta queda cobrada a crédito y se descuentan de las existencias las cantidades de sus líneas (<a href=\"#\" data-go=\"rf0\">RF-00<\/a>); una venta «en espera de autorización» no las descuenta hasta que se autoriza.<\/li>\n<li>El saldo de la cuenta del cliente aumenta por el total de la venta.<\/li>\n<li>Se emite el comprobante con el saldo resultante.<\/li>\n<li>Si el total supera ₡20 000 <em>(supuesto)<\/em> (<span class=\"ref\">FA-04<\/span>): la venta queda «en espera de autorización», no cuenta como venta abierta, la caja queda libre para otra venta, el saldo no cambia y el crédito no se reserva.<\/li>\n<li>Si la dueña autoriza, la venta queda cobrada a crédito; si rechaza, la venta no se cobra (<span class=\"ref\">FA-05<\/span>); si el día se cierra antes, la venta en espera se descarta (<span class=\"ref\">FA-06<\/span>).<\/li>\n<li>Si hubo autorización, rechazo o caducidad de la solicitud, quedó en la bitácora.<\/li>\n<\/ul>\n<h2>Flujo Principal<\/h2>\n<ol>\n<li>La cajera indica que la venta será a fiado.<\/li>\n<li>La cajera identifica al cliente. <span class=\"ref\">FA-01<\/span><\/li>\n<li>El sistema verifica que el cliente tiene cuenta de fiado <span class=\"ref\">FA-02<\/span> y muestra su límite, su saldo, su crédito disponible y el total de la venta.<\/li>\n<li>La cajera confirma el fiado.<\/li>\n<li>El sistema verifica que el total no supera el crédito disponible del cliente. <span class=\"ref\">FA-03<\/span><\/li>\n<li>El sistema verifica que el total no supera ₡20 000. <span class=\"ref\">FA-04<\/span><\/li>\n<li>El sistema registra la venta como fiada y aumenta el saldo de la cuenta.<\/li>\n<li>El sistema emite el comprobante con el saldo resultante.<\/li>\n<\/ol>\n<h2>Flujos Alternativos<\/h2>\n<h3>FA-01: Cliente no encontrado<\/h3>\n<ol>\n<li>El sistema indica «cliente no encontrado».<\/li>\n<li>La cajera busca de nuevo o cancela el fiado.<\/li>\n<li>Si busca de nuevo, el caso de uso continúa en el paso 2; si cancela, la venta sigue abierta para cobrarse con otro medio.<\/li>\n<\/ol>\n<h3>FA-02: Cliente sin cuenta de fiado<\/h3>\n<ol>\n<li>El sistema rechaza el fiado e indica que el cliente no tiene fiado.<\/li>\n<li>La venta sigue abierta.<\/li>\n<li>La cajera la cobra con otro medio de pago (<a href=\"#\" data-go=\"cu1\">CU-01<\/a>).<\/li>\n<\/ol>\n<h3>FA-03: Crédito insuficiente<\/h3>\n<ol>\n<li>El sistema rechaza el fiado e indica el crédito disponible del cliente.<\/li>\n<li>La venta sigue abierta y el saldo no cambia.<\/li>\n<li>La cajera cobra con otro medio de pago o ajusta la venta.<\/li>\n<\/ol>\n<h3>FA-04: Monto mayor a ₡20 000<\/h3>\n<ol>\n<li>El sistema pasa la venta al estado «en espera de autorización» y avisa a la dueña. La venta deja de ser la venta abierta de la cajera: la caja queda libre y la cajera puede abrir otra venta y atender al siguiente cliente sin esperar a la dueña.<\/li>\n<li>El saldo no cambia mientras la venta está en espera y la venta en espera no reserva crédito: otro fiado al mismo cliente puede consumirlo mientras tanto. No hay tiempo máximo de respuesta de la dueña; la solicitud caduca solo al cerrar el día (<span class=\"ref\">FA-06<\/span>).<\/li>\n<li>La dueña, con su sesión administrativa abierta (<a href=\"#\" data-go=\"cu4\">CU-04<\/a>) mediante su PIN en la misma caja, sin abrir turno, revisa y autoriza. La venta sigue en espera aunque la cajera cierre su turno (<span class=\"ref\">CU-04 FA-06<\/span>); la dueña puede resolverla después desde su sesión administrativa.<\/li>\n<li>El sistema registra la autorización en la bitácora.<\/li>\n<li>El sistema revalida el crédito al autorizar: vuelve a verificar que el total no supera el crédito disponible, porque el saldo pudo cambiar mientras la venta estaba en espera (<span class=\"ref\">FA-03<\/span>). Si lo supera, el fiado se rechaza igual que en <span class=\"ref\">FA-05<\/span>; si no, el caso de uso continúa en el paso 7.<\/li>\n<li>Si la dueña rechaza (<span class=\"ref\">FA-05<\/span>), no se cobra.<\/li>\n<\/ol>\n<h3>FA-05: La dueña rechaza la autorización o el crédito ya no alcanza<\/h3>\n<ol>\n<li>La dueña rechaza el fiado, o el sistema lo rechaza al revalidar el crédito.<\/li>\n<li>El sistema cancela el fiado y el saldo no cambia. La venta sale del estado «en espera» y vuelve a ser venta abierta de la cajera para cobrarse con otro medio, siempre que su turno siga abierto y no tenga otra venta abierta; en otro caso se descarta sin cobrarse <em>(supuesto)<\/em>.<\/li>\n<li>El sistema registra el rechazo en la bitácora, y el descarte si lo hubo.<\/li>\n<\/ol>\n<h3>FA-06: La venta en espera caduca al cerrar el día<\/h3>\n<ol>\n<li>La dueña cierra el día (<a href=\"#\" data-go=\"cu6\">CU-06 «Cerrar el día»<\/a>) con una venta en espera de autorización.<\/li>\n<li>El sistema caduca la solicitud: la dueña ya no puede autorizarla.<\/li>\n<li>El sistema descarta la venta <em>(supuesto: es lo más simple, porque una venta no debe pasar de un día a otro)<\/em>; no se cobra y el saldo no cambia.<\/li>\n<li>El sistema registra la caducidad en la bitácora.<\/li>\n<\/ol>\n<h2>Prototipos<\/h2>\n<p>Boceto de baja fidelidad de la selección de cliente en la pantalla de caja:<\/p>\n<pre><code class=\"language-text\">+------------------------------------------------------------+\n| Cobrar a fiado                                              |\n| Cliente: [Juan Mora            ] [Buscar]                   |\n|                                                             |\n| Límite: ₡50 000   Saldo: ₡10 000   Disponible: ₡40 000      |\n| Total de la venta: ₡8 000                                   |\n|                                                             |\n| [Confirmar fiado]  [Cancelar]                               |\n+------------------------------------------------------------+\n<\/code><\/pre>\n<h2>Requerimientos Especiales<\/h2>\n<ul>\n<li><strong>Seguridad<\/strong> (RNF-03): incluye <a href=\"#\" data-go=\"cu8\">CU-08 Autorizar una operación sensible con el PIN de la dueña<\/a> para la autorización con PIN.<\/li>\n<li><strong>Seguridad<\/strong> (RNF-03): solo la dueña puede autorizar o rechazar un fiado; el servidor valida el rol en cada operación, no basta con ocultar el botón.<\/li>\n<li><strong>Seguridad<\/strong> (RNF-02): cada autorización y rechazo queda en la bitácora con persona, fecha, hora y monto.<\/li>\n<li><strong>Usabilidad<\/strong> (RNF-01): la cajera ve el crédito disponible junto al total antes de confirmar; los mensajes de rechazo dicen qué pasó y qué hacer, sin términos técnicos.<\/li>\n<li><strong>Regla de negocio<\/strong>: el crédito se revalida en el momento de autorizar, no solo al solicitar; la venta en espera no reserva crédito.<\/li>\n<li><strong>Regla de negocio<\/strong>: una venta «en espera de autorización» no es una venta abierta: libera la caja, no bloquea el cierre de turno de la cajera y se conserva en espera hasta que la dueña resuelva o hasta el cierre del día.<\/li>\n<li><strong>Regla de negocio<\/strong> <em>(supuesto)<\/em>: la venta en espera caduca al cerrar el día y se descarta sin cobrarse; no hay otro tiempo máximo de respuesta.<\/li>\n<li><strong>Regla de negocio<\/strong> <em>(supuesto)<\/em>: si la dueña rechaza (o el crédito ya no alcanza), la venta vuelve a ser venta abierta de la cajera solo si su turno sigue abierto y no tiene otra venta abierta; en otro caso se descarta.<\/li>\n<li><strong>Integridad<\/strong>: el saldo de la cuenta no puede ser negativo ni superar el límite, ni siquiera con dos intentos de fiado simultáneos al mismo cliente (por ejemplo, la autorización de una venta en espera mientras se cobra un nuevo fiado). Hay una sola caja activa, por lo que la simultaneidad se da entre la autorización de la dueña y la operación de la cajera.<\/li>\n<li><strong>Regla de negocio<\/strong>: cada cuenta tiene un límite definido por la dueña; el crédito disponible es el límite menos el saldo; el fiado no genera intereses.<\/li>\n<li><strong>Regla de negocio<\/strong> <em>(supuesto)<\/em>: el umbral de autorización de la dueña es ₡20 000.<\/li>\n<li><strong>Tabla de decisión<\/strong>:<\/li>\n<\/ul>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Escenario<\/th>\n<th>¿Tiene cuenta?<\/th>\n<th>¿Total ≤ crédito disponible?<\/th>\n<th>¿Total &gt; ₡20 000?<\/th>\n<th>Acción<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>E1<\/td>\n<td>Sí<\/td>\n<td>Sí<\/td>\n<td>No<\/td>\n<td>Registrar la compra a la cuenta<\/td>\n<\/tr>\n<tr>\n<td>E2<\/td>\n<td>Sí<\/td>\n<td>Sí<\/td>\n<td>Sí<\/td>\n<td>Dejar la venta en espera de autorización de la dueña; si la da, registrar; si la rechaza, no cobrar<\/td>\n<\/tr>\n<tr>\n<td>E3<\/td>\n<td>Sí<\/td>\n<td>No<\/td>\n<td>(no aplica)<\/td>\n<td>Rechazar: no hay crédito disponible<\/td>\n<\/tr>\n<tr>\n<td>E4<\/td>\n<td>No<\/td>\n<td>(no aplica)<\/td>\n<td>(no aplica)<\/td>\n<td>Rechazar: el cliente no tiene fiado<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li><strong>Fuera de alcance<\/strong>: abonar a la cuenta y consultar el saldo son casos de uso propios.<\/li>\n<\/ul>\n<h2>Escenarios de Prueba<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Entrada<\/th>\n<th>Salida Esperada<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Flujo principal: cliente «Juan Mora» con límite ₡50 000 y saldo ₡10 000; venta de ₡8 000 a fiado<\/td>\n<td>Venta cobrada a crédito por ₡8 000; saldo de «Juan Mora» pasa a ₡18 000; comprobante con el saldo<\/td>\n<\/tr>\n<tr>\n<td>Flujo principal: venta de ₡20 000 con crédito disponible de ₡40 000<\/td>\n<td>Venta cobrada a crédito por ₡20 000 sin pedir autorización; saldo pasa a ₡30 000<\/td>\n<\/tr>\n<tr>\n<td>FA-01: buscar al cliente «Zzz Inexistente»<\/td>\n<td>Mensaje «cliente no encontrado»; la cajera puede buscar de nuevo o cancelar<\/td>\n<\/tr>\n<tr>\n<td>FA-02: cliente «Ana Solís» sin cuenta de fiado<\/td>\n<td>Venta no cobrada a crédito; mensaje de que no tiene fiado; la venta sigue abierta<\/td>\n<\/tr>\n<tr>\n<td>Flujo principal: elegir al cliente «Juan Mora» con venta de ₡8 000<\/td>\n<td>Antes de confirmar, la pantalla muestra límite ₡50 000, saldo ₡10 000, disponible ₡40 000 y el total en la misma vista<\/td>\n<\/tr>\n<tr>\n<td>FA-03: saldo ₡45 000, límite ₡50 000 y venta de ₡8 000<\/td>\n<td>Venta no cobrada; mensaje con crédito disponible de ₡5 000; saldo sigue en ₡45 000<\/td>\n<\/tr>\n<tr>\n<td>FA-03: saldo ₡45 000, límite ₡50 000 y venta de ₡5 000<\/td>\n<td>Venta cobrada a crédito; saldo pasa a ₡50 000<\/td>\n<\/tr>\n<tr>\n<td>FA-03: autorización de una venta en espera de ₡4 000 y un nuevo fiado de ₡4 000 al mismo cliente, al mismo tiempo, con ₡5 000 disponibles<\/td>\n<td>Solo una queda cobrada; la otra es rechazada por falta de crédito; el saldo nunca supera ₡50 000<\/td>\n<\/tr>\n<tr>\n<td>FA-04: venta de ₡25 000, límite ₡100 000, saldo ₡0<\/td>\n<td>La venta queda en espera de autorización, no cuenta como venta abierta y el saldo sigue en ₡0<\/td>\n<\/tr>\n<tr>\n<td>FA-04: venta de ₡25 000 en espera; la cajera abre una venta nueva de ₡3 000<\/td>\n<td>La caja queda libre: la cajera puede abrir y cobrar la venta nueva sin esperar a la dueña<\/td>\n<\/tr>\n<tr>\n<td>FA-04: la dueña autoriza la venta de ₡25 000<\/td>\n<td>Venta cobrada a crédito; saldo pasa a ₡25 000<\/td>\n<\/tr>\n<tr>\n<td>FA-05: la dueña rechaza la venta de ₡25 000 con el turno de la cajera abierto y sin otra venta abierta<\/td>\n<td>Venta no cobrada que vuelve a ser venta abierta de la cajera; saldo en ₡0; rechazo en la bitácora<\/td>\n<\/tr>\n<tr>\n<td>FA-05: la dueña rechaza la venta de ₡25 000 y la cajera ya tiene otra venta abierta<\/td>\n<td>Venta no cobrada y descartada; saldo en ₡0; rechazo y descarte en la bitácora <em>(supuesto)<\/em><\/td>\n<\/tr>\n<tr>\n<td>FA-04: la dueña autoriza la venta de ₡25 000<\/td>\n<td>Además, la autorización queda en la bitácora con la dueña, la cajera, el cliente, el monto, la fecha y la hora<\/td>\n<\/tr>\n<tr>\n<td>FA-04: venta de ₡25 000 en espera; mientras tanto otro fiado de ₡80 000 deja el saldo en ₡80 000 (límite ₡100 000) y la dueña autoriza<\/td>\n<td>Fiado rechazado por falta de crédito (disponible ₡20 000); saldo sigue en ₡80 000<\/td>\n<\/tr>\n<tr>\n<td>FA-04: venta de ₡25 000 en espera y saldo del cliente sin cambios<\/td>\n<td>El saldo sigue en ₡0 mientras la venta está en espera<\/td>\n<\/tr>\n<tr>\n<td>FA-04: venta de ₡25 000 en espera; la dueña autoriza con su PIN en la misma caja sin abrir turno<\/td>\n<td>La venta se cobra a crédito; la sesión de la dueña no ocupa la caja<\/td>\n<\/tr>\n<tr>\n<td>FA-04: venta de ₡25 000 en espera y la cajera cierra su turno<\/td>\n<td>El turno se cierra y la venta sigue en espera hasta que la dueña resuelva o se cierre el día<\/td>\n<\/tr>\n<tr>\n<td>FA-06: venta de ₡25 000 en espera al cerrar el día<\/td>\n<td>La solicitud caduca; la dueña ya no puede autorizar; la venta se descarta sin cobrarse; saldo en ₡0; caducidad en la bitácora<\/td>\n<\/tr>\n<tr>\n<td>FA-04: la cajera intenta autorizar su propia venta<\/td>\n<td>Operación rechazada por falta de permiso; la venta sigue en espera<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>| Flujo principal: tras elegir al cliente, la cajera confirma | La confirmación ocurre después de ver límite, saldo, disponible y total; recién entonces se registra el fiado |<\/p>\n<p><strong>Guiones de prueba (Gherkin):<\/strong> <span class=\"ref\">h1<\/span>, <span class=\"ref\">h2<\/span>, <span class=\"ref\">h3<\/span>, <span class=\"ref\">h4<\/span>, <span class=\"ref\">h5<\/span>, <span class=\"ref\">h6<\/span>. Backlog: <a href=\"#\" data-go=\"cu2\">CU-02-backlog.md<\/a>.<\/p>"}, {"id": "rf3", "tipo": "rf", "codigo": "RF-03", "titulo": "Anular ventas con autorización", "corto": "Anular ventas con autorización", "abstract": "El sistema debe permitir anular una venta ya cobrada del día en curso, antes del cierre del día, con un motivo obligatorio y la autorización de la dueña. La venta anulada se conserva, se revierte su efecto según el medio de pago y la anulación queda registrada con quién la solicitó, quién la autorizó, cuándo y por qué.", "chips": ["Actores: cajera (solicita), dueña (autoriza, rechaza o anula directamente)"], "rnfs": ["rnf1", "rnf2", "rnf3"], "rfs": [], "realiza": null, "realizaEn": [], "html": "<h2>Descripción<\/h2>\n<p>El sistema debe permitir anular una venta ya cobrada del día en curso, antes del cierre del día, con un motivo obligatorio y la autorización de la dueña. La venta anulada se conserva, se revierte su efecto según el medio de pago y la anulación queda registrada con quién la solicitó, quién la autorizó, cuándo y por qué.<\/p>\n<p><strong>Actores:<\/strong> cajera (solicita), dueña (autoriza, rechaza o anula directamente).<\/p>\n<h2>Necesidad<\/h2>\n<p>Corresponde al problema 1 de <span class=\"ref\">problema.md<\/span>: un cajero anulaba ventas cobradas en efectivo y se quedaba con la diferencia durante unos 4 meses, con una pérdida cercana a ₡350 000. Sin control de quién anula y por qué, el riesgo se repite.<\/p>\n<h2>Proceso Actual<\/h2>\n<p>Una anulación se corrige en la registradora sin dejar registro de la persona ni del motivo. La única forma de reconstruir lo ocurrido es revisar las grabaciones de las cámaras.<\/p>\n<h2>Solución Propuesta<\/h2>\n<p>La cajera solicita la anulación indicando el motivo y la solicitud queda registrada en la bitácora desde ese momento. La dueña revisa y autoriza o rechaza desde su sesión administrativa, con su PIN, sin abrir turno ni ocupar la caja. Al autorizar, la venta pasa a «anulada», se ajusta el saldo si fue fiado y el sistema indica la devolución que corresponde según el medio de pago (si la venta combinó medios, la indicación se da por cada medio usado). La dueña también puede anular directamente. Si la dueña cierra el día (<a href=\"#\" data-go=\"rf6\">RF-06<\/a>) con una solicitud pendiente, la solicitud caduca y ya no se puede autorizar; después del cierre del día ninguna venta de ese día se puede anular.<\/p>\n<h2>Documentos de Referencia<\/h2>\n<ul>\n<li><span class=\"ref\">Caso Minisúper La Esquina, secciones 4.4 y 5.1<\/span><\/li>\n<li><span class=\"ref\">Descripción del problema<\/span><\/li>\n<\/ul>\n<h2>Casos de Uso Relacionados<\/h2>\n<ul>\n<li><a href=\"#\" data-go=\"cu3\">CU-03 Anular venta<\/a><\/li>\n<li><a href=\"#\" data-go=\"cu6\">CU-06 Cerrar el día<\/a> (produce el cierre del día que cierra la ventana de anulación)<\/li>\n<\/ul>\n<h2>Criterios de Aceptación<\/h2>\n<ol>\n<li>Una solicitud sin motivo, o con motivo de menos de 10 caracteres <em>(supuesto)<\/em>, se rechaza.<\/li>\n<li>Solo la dueña puede autorizar o rechazar una solicitud; una cajera que lo intente, incluso llamando a la API directamente, recibe acceso denegado.<\/li>\n<li>Solo se anulan ventas del día en curso, antes del cierre del día <em>(supuesto)<\/em>, que existan, que no estén ya anuladas y que no tengan otra solicitud pendiente; si no se cumple por la fecha o el cierre, el mensaje es «solo se anulan ventas del día y antes del cierre del día». El cierre del día es el que produce <a href=\"#\" data-go=\"rf6\">RF-06<\/a>; no es el cuadre de caja, que sigue siendo un proceso manual fuera de esta versión.<\/li>\n<li>Una venta anulada se conserva en el sistema y nunca se borra.<\/li>\n<li>Al anular una venta a fiado, el saldo de la cuenta se reduce por el monto de la venta.<\/li>\n<li>El sistema indica la devolución manual que corresponde: dinero en efectivo, devolución por SINPE Móvil o reverso en el datafono, por cada medio de pago usado en la venta <em>(supuesto: el sistema no devuelve dinero por sí mismo)<\/em>.<\/li>\n<li>Cada solicitud (al crearse), autorización, rechazo y caducidad, y cada anulación directa de la dueña, queda en la bitácora con persona, fecha, hora y motivo de la solicitud (ver RNF-02).<\/li>\n<li>Solicitar la anulación toma 3 acciones o menos para la cajera <em>(supuesto)<\/em> (ver RNF-01).<\/li>\n<li>Una solicitud pendiente caduca al cerrar el día: la venta sigue cobrada, la dueña ya no puede autorizarla ni rechazarla y la caducidad queda en la bitácora.<\/li>\n<li>La dueña autoriza o anula directamente desde su sesión administrativa, con su PIN, sin abrir turno ni ocupar la caja.<\/li>\n<\/ol>\n<h2>Referencias<\/h2>\n<ul>\n<li><a href=\"#\" data-go=\"cu3\">CU-03<\/a><\/li>\n<li><a href=\"#\" data-go=\"cu3\">Backlog de CU-03<\/a><\/li>\n<li><a href=\"#\" data-go=\"rf6\">RF-06 Cerrar el día<\/a><\/li>\n<li><a href=\"#\" data-go=\"rnf2\">RNF-02 Trazabilidad y auditoría<\/a><\/li>\n<li><a href=\"#\" data-go=\"rnf3\">RNF-03 Control de acceso y protección de credenciales<\/a><\/li>\n<\/ul>"}, {"id": "cu3", "tipo": "cu", "codigo": "CU-03", "titulo": "Anular venta", "corto": "Anular venta", "abstract": "Este caso de uso permite revertir una venta ya cobrada del día en curso, con un motivo obligatorio y la autorización de la dueña, sin dejar un hueco de control sobre quién anuló y por qué. La anulación solo es posible antes del cierre del día (CU-06).", "chips": ["Primarios: Cajera", "Secundarios: Dueña", "8 flujos alternativos"], "rnfs": ["rnf1", "rnf2", "rnf3"], "rfs": [], "rf": "rf3", "realiza": null, "realizaEn": [], "html": "<h2>Título del Caso de Uso<\/h2>\n<p>CU-03 Anular venta (atiende <a href=\"#\" data-go=\"rf3\">RF-03<\/a>)<\/p>\n<h2>Descripción<\/h2>\n<p>Este caso de uso permite revertir una venta ya cobrada del día en curso, con un motivo obligatorio y la autorización de la dueña, sin dejar un hueco de control sobre quién anuló y por qué. La anulación solo es posible antes del cierre del día (<a href=\"#\" data-go=\"cu6\">CU-06<\/a>).<\/p>\n<h2>Actores<\/h2>\n<ul>\n<li><strong>Primarios<\/strong>: Cajera (solicita la anulación)<\/li>\n<li><strong>Secundarios<\/strong>: Dueña (autoriza, rechaza o anula directamente desde su sesión administrativa)<\/li>\n<\/ul>\n<h2>Precondiciones<\/h2>\n<ul>\n<li>La cajera tiene su turno abierto (<a href=\"#\" data-go=\"cu4\">CU-04<\/a>), o la dueña tiene su sesión administrativa abierta (CU-04). La sesión de la dueña no abre turno ni ocupa la caja: la dueña autoriza con su PIN sin abrir turno.<\/li>\n<li>La venta existe, está cobrada, no está anulada y es del día en curso.<\/li>\n<li>El día no está cerrado: <a href=\"#\" data-go=\"cu6\">CU-06<\/a> aún no se ha ejecutado para la fecha de la venta.<\/li>\n<\/ul>\n<h2>Postcondiciones<\/h2>\n<ul>\n<li>La venta queda anulada y se conserva en el sistema.<\/li>\n<li>Se devolvieron a las existencias las cantidades de cada línea de la venta.<\/li>\n<li>Se revirtió su efecto: si fue a fiado, el saldo de la cuenta se redujo por el monto de la venta; si no, el sistema indicó la devolución manual que corresponde a cada medio de pago usado (efectivo, SINPE Móvil o reverso en el datafono).<\/li>\n<li>La bitácora registra la solicitud, la autorización (o el rechazo, o la caducidad) y, en la anulación directa, a la dueña como solicitante y autorizante, con la fecha, la hora y el motivo.<\/li>\n<li>Si el día se cierra antes de que la dueña resuelva, la solicitud caduca y la venta sigue cobrada (<span class=\"ref\">FA-08<\/span>).<\/li>\n<\/ul>\n<h2>Flujo Principal<\/h2>\n<ol>\n<li>La cajera busca la venta a anular. <span class=\"ref\">FA-01<\/span><\/li>\n<li>La cajera solicita la anulación e indica el motivo. <span class=\"ref\">FA-02<\/span> <span class=\"ref\">FA-03<\/span> <span class=\"ref\">FA-04<\/span> <span class=\"ref\">FA-07<\/span><\/li>\n<li>El sistema deja la solicitud pendiente, la registra en la bitácora (venta, cajera, motivo, fecha y hora) y avisa a la dueña.<\/li>\n<li>La dueña revisa la venta y autoriza con su PIN desde su sesión administrativa, sin abrir turno. <span class=\"ref\">FA-05<\/span> <span class=\"ref\">FA-06<\/span> <span class=\"ref\">FA-08<\/span><\/li>\n<li>El sistema marca la venta como anulada y devuelve a las existencias la cantidad de cada línea; si fue a fiado, reduce el saldo de la cuenta por el monto de la venta, y si no, indica a la cajera la devolución manual que corresponde a cada medio de pago usado.<\/li>\n<li>El sistema registra en la bitácora la autorización: venta, solicitante, autorizante, fecha, hora y motivo.<\/li>\n<\/ol>\n<h2>Flujos Alternativos<\/h2>\n<h3>FA-01: La venta no existe<\/h3>\n<ol>\n<li>El sistema indica «venta no encontrada».<\/li>\n<li>La cajera busca de nuevo.<\/li>\n<li>El caso de uso continúa en el paso 1 del flujo principal.<\/li>\n<\/ol>\n<h3>FA-02: La venta ya está anulada<\/h3>\n<ol>\n<li>El sistema rechaza la solicitud e indica que la venta ya está anulada.<\/li>\n<li>No se crea ninguna solicitud.<\/li>\n<li>El caso de uso termina.<\/li>\n<\/ol>\n<h3>FA-03: Venta de un día cerrado<\/h3>\n<ol>\n<li>La venta es de un día anterior, o es de hoy pero la dueña ya cerró el día (<a href=\"#\" data-go=\"cu6\">CU-06<\/a>).<\/li>\n<li>El sistema rechaza la solicitud e indica que solo se anulan ventas del día y antes del cierre del día.<\/li>\n<li>No se crea ninguna solicitud.<\/li>\n<li>El caso de uso termina.<\/li>\n<\/ol>\n<h3>FA-04: Motivo faltante o demasiado corto<\/h3>\n<ol>\n<li>El sistema exige el motivo (mínimo 10 caracteres <em>(supuesto)<\/em>) y no crea la solicitud.<\/li>\n<li>La cajera escribe un motivo válido.<\/li>\n<li>El caso de uso continúa en el paso 2 del flujo principal.<\/li>\n<\/ol>\n<h3>FA-05: La dueña rechaza la solicitud<\/h3>\n<ol>\n<li>La dueña rechaza la solicitud.<\/li>\n<li>La venta sigue cobrada y la solicitud queda como rechazada.<\/li>\n<li>El sistema registra el rechazo en la bitácora (venta, solicitante, quien rechazó, fecha, hora y motivo de la solicitud); la cajera puede solicitar de nuevo.<\/li>\n<\/ol>\n<h3>FA-06: La dueña anula directamente<\/h3>\n<ol>\n<li>La dueña, desde su sesión administrativa, busca la venta e indica el motivo.<\/li>\n<li>El sistema aplica las mismas validaciones del flujo principal (venta existente, no anulada, del día y antes del cierre del día, sin solicitud pendiente, motivo válido) y, si las cumple, omite los pasos 3 y 4.<\/li>\n<li>El sistema registra en la bitácora la anulación con la dueña como solicitante y autorizante, la fecha, la hora y el motivo.<\/li>\n<li>El caso de uso continúa en el paso 5 del flujo principal.<\/li>\n<\/ol>\n<h3>FA-07: Ya existe una solicitud pendiente<\/h3>\n<ol>\n<li>El sistema indica que ya existe una solicitud pendiente para esa venta.<\/li>\n<li>No se crea otra solicitud.<\/li>\n<li>El caso de uso termina.<\/li>\n<\/ol>\n<h3>FA-08: La solicitud caduca al cerrar el día<\/h3>\n<ol>\n<li>Con la solicitud pendiente, la dueña cierra el día (<a href=\"#\" data-go=\"cu6\">CU-06<\/a>).<\/li>\n<li>El sistema caduca la solicitud: la venta sigue cobrada y la dueña ya no puede autorizarla ni rechazarla.<\/li>\n<li>Si la dueña intenta resolverla, el sistema indica que la solicitud caducó con el cierre del día y no cambia nada.<\/li>\n<li>La caducidad queda en la bitácora (la registra CU-06) y el caso de uso termina. Para anular esa venta ya no hay vía dentro del sistema <em>(supuesto)<\/em>.<\/li>\n<\/ol>\n<h2>Prototipos<\/h2>\n<p>Boceto de baja fidelidad de la solicitud de anulación y de la lista de pendientes de la dueña:<\/p>\n<pre><code class=\"language-text\">Solicitud (cajera)                      Pendientes (dueña, sesión administrativa)\n+-----------------------------+         +------------------------------------+\n| Anular venta #1042 (₡5 800) |         | #1042  Yendry  ₡5 800  14:32       |\n| Motivo: [_______________ ]  |         | Motivo: Cliente devolvió producto  |\n| [Solicitar]  [Cancelar]     |         | PIN: [____]                        |\n+-----------------------------+         | [Autorizar]  [Rechazar]            |\n                                        +------------------------------------+\n<\/code><\/pre>\n<h2>Requerimientos Especiales<\/h2>\n<ul>\n<li><strong>Seguridad<\/strong> (RNF-03): incluye <a href=\"#\" data-go=\"cu8\">CU-08 Autorizar una operación sensible con el PIN de la dueña<\/a> para la autorización con PIN.<\/li>\n<li><strong>Seguridad<\/strong> (RNF-03): solo la dueña autoriza; la validación de permisos se hace en el servidor, no solo en la interfaz.<\/li>\n<li><strong>Seguridad<\/strong> (RNF-02): la bitácora no se puede editar ni borrar desde la aplicación, y registra la solicitud, la autorización, el rechazo, la caducidad y la anulación directa.<\/li>\n<li><strong>Usabilidad<\/strong> (RNF-01, <em>supuesto<\/em>): solicitar la anulación toma 3 acciones o menos para la cajera.<\/li>\n<li><strong>Regla de negocio<\/strong>: una venta se anula una sola vez y nunca se borra.<\/li>\n<li><strong>Regla de negocio<\/strong> <em>(supuesto)<\/em>: la anulación es posible el mismo día, antes del cierre del día. El cierre del día lo produce <a href=\"#\" data-go=\"cu6\">CU-06<\/a>; no es el cuadre de caja, que es un proceso manual fuera de esta versión.<\/li>\n<li><strong>Regla de negocio<\/strong>: la sesión de la dueña es administrativa; autorizar o anular directamente no requiere abrir turno ni ocupa la caja.<\/li>\n<li><strong>Regla de negocio<\/strong>: una solicitud pendiente caduca al cerrar el día.<\/li>\n<li><strong>Regla de negocio<\/strong> <em>(supuesto)<\/em>: el sistema no devuelve dinero por sí mismo; indica la devolución manual en efectivo, SINPE Móvil o reverso en el datafono, por cada medio de pago usado en la venta.<\/li>\n<\/ul>\n<h2>Escenarios de Prueba<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Entrada<\/th>\n<th>Salida Esperada<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Flujo principal: la cajera «Yendry» solicita anular la venta #1042 (₡5 800, efectivo) con el motivo «Cliente devolvió el producto»<\/td>\n<td>La solicitud queda pendiente, la venta sigue cobrada y la solicitud queda en la bitácora con la venta, la cajera, el motivo, la fecha y la hora<\/td>\n<\/tr>\n<tr>\n<td>Flujo principal: la dueña autoriza la solicitud con su PIN, sin turno abierto<\/td>\n<td>La venta #1042 queda anulada y se conserva; el sistema indica devolver ₡5 800 en efectivo; la caja sigue libre para las cajeras<\/td>\n<\/tr>\n<tr>\n<td>Flujo principal: anular una venta de 2 «Arroz 1 kg» cuando las existencias son 38<\/td>\n<td>La venta queda anulada y las existencias de «Arroz 1 kg» pasan a 40<\/td>\n<\/tr>\n<tr>\n<td>Flujo principal: anular una venta a fiado de ₡8 000 con saldo de ₡18 000<\/td>\n<td>La venta queda anulada y el saldo pasa a ₡10 000<\/td>\n<\/tr>\n<tr>\n<td>Flujo principal: anular una venta de ₡12 000 pagada con ₡7 000 en efectivo y ₡5 000 por SINPE Móvil<\/td>\n<td>La venta queda anulada y el sistema indica devolver ₡7 000 en efectivo y ₡5 000 por SINPE Móvil<\/td>\n<\/tr>\n<tr>\n<td>FA-01: buscar la venta #9999<\/td>\n<td>Mensaje «venta no encontrada»<\/td>\n<\/tr>\n<tr>\n<td>FA-02: solicitar anular una venta ya anulada<\/td>\n<td>Solicitud rechazada con mensaje de que ya está anulada<\/td>\n<\/tr>\n<tr>\n<td>FA-03: solicitar anular la venta #1001 cobrada ayer<\/td>\n<td>Solicitud rechazada con el mensaje de que solo se anulan ventas del día y antes del cierre del día<\/td>\n<\/tr>\n<tr>\n<td>FA-03: la dueña cerró el día y la cajera solicita anular la venta #1042 de hoy<\/td>\n<td>Solicitud rechazada con el mismo mensaje; no se crea la solicitud<\/td>\n<\/tr>\n<tr>\n<td>FA-04: solicitar sin motivo<\/td>\n<td>Se exige el motivo y no se crea la solicitud<\/td>\n<\/tr>\n<tr>\n<td>FA-04: solicitar con el motivo «error»<\/td>\n<td>Mensaje de que el motivo debe tener al menos 10 caracteres<\/td>\n<\/tr>\n<tr>\n<td>FA-05: la dueña rechaza la solicitud<\/td>\n<td>La venta sigue cobrada, la solicitud queda rechazada y el rechazo está en la bitácora<\/td>\n<\/tr>\n<tr>\n<td>FA-06: la dueña anula la venta #1042 con el motivo «Error de digitación en el precio»<\/td>\n<td>Venta anulada sin solicitud pendiente; la dueña figura como solicitante y autorizante y la anulación directa está en la bitácora<\/td>\n<\/tr>\n<tr>\n<td>FA-06: la dueña intenta anular directamente la venta #1042 después de cerrar el día<\/td>\n<td>Anulación rechazada con el mensaje de que solo se anulan ventas del día y antes del cierre del día<\/td>\n<\/tr>\n<tr>\n<td>FA-07: solicitar anular una venta que ya tiene solicitud pendiente<\/td>\n<td>Mensaje de solicitud pendiente y no se crea otra<\/td>\n<\/tr>\n<tr>\n<td>FA-08: solicitud pendiente sobre la venta #1042, la dueña cierra el día y luego intenta autorizarla<\/td>\n<td>La solicitud está caducada, el sistema indica que caducó con el cierre del día, la venta #1042 sigue cobrada y la caducidad está en la bitácora<\/td>\n<\/tr>\n<tr>\n<td>Seguridad: la cajera intenta autorizar llamando a la API directamente<\/td>\n<td>Acceso denegado y la venta sigue cobrada<\/td>\n<\/tr>\n<tr>\n<td>Seguridad: modificar o borrar un registro de la bitácora<\/td>\n<td>La aplicación no ofrece la operación y el registro no cambia<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Guiones de prueba (Gherkin):<\/strong> <span class=\"ref\">h1<\/span>, <span class=\"ref\">h2<\/span>, <span class=\"ref\">h3<\/span>, <span class=\"ref\">h4<\/span>, <span class=\"ref\">h5<\/span>, <span class=\"ref\">h6<\/span>, <span class=\"ref\">h7<\/span>, <span class=\"ref\">h8<\/span>, <span class=\"ref\">h9<\/span>. Backlog: <a href=\"#\" data-go=\"cu3\">CU-03-backlog.md<\/a>.<\/p>"}, {"id": "rf4", "tipo": "rf", "codigo": "RF-04", "titulo": "Abrir y cerrar turno de caja (identificar a la cajera)", "corto": "Abrir y cerrar turno de caja", "abstract": "El sistema debe identificar a cada cajera con su usuario y un PIN corto al abrir su turno, mantener una sola caja abierta a la vez y asociar a esa persona todas las operaciones del turno, hasta que cierre el turno.", "chips": ["Actores: cajera, dueña"], "rnfs": ["rnf1", "rnf2", "rnf3"], "rfs": [], "realiza": null, "realizaEn": [], "html": "<h2>Descripción<\/h2>\n<p>El sistema debe identificar a cada cajera con su usuario y un PIN corto al abrir su turno, mantener una sola caja abierta a la vez y asociar a esa persona todas las operaciones del turno, hasta que cierre el turno. La dueña se identifica con una sesión administrativa que no ocupa la caja y puede forzar el cierre de un turno que una cajera olvidó cerrar. Una vez cerrado el día, no se abre otro turno ese día. La administración de las cajeras está en <a href=\"#\" data-go=\"rf5\">RF-05<\/a>.<\/p>\n<p><strong>Actores:<\/strong> cajera, dueña.<\/p>\n<h2>Necesidad<\/h2>\n<p>Corresponde a los problemas 1 y 4 de <span class=\"ref\">problema.md<\/span>: para saber quién hizo cada operación hay que identificar a la persona, pero un control pesado alarga la fila. La identificación debe ser rápida, una vez por turno y, a la vez, suficiente para atribuir cada operación.<\/p>\n<h2>Proceso Actual<\/h2>\n<p>No hay identificación dentro del sistema. Las cajeras rotan turnos en la misma registradora y la única forma de saber quién estaba a cargo es el horario o la grabación de las cámaras.<\/p>\n<h2>Solución Propuesta<\/h2>\n<p>Al iniciar el turno, la cajera elige su usuario e ingresa un PIN de 4 a 6 dígitos <em>(supuesto)<\/em>. El sistema abre la sesión, registra el inicio y no vuelve a pedir el PIN durante el turno, salvo tras 5 minutos de inactividad <em>(supuesto)<\/em>. Tras 3 intentos fallidos consecutivos <em>(supuesto)<\/em> el PIN se bloquea y solo la dueña lo desbloquea. Al terminar, la cajera cierra su turno y la caja queda libre. La dueña se identifica con su PIN en una sesión administrativa que no abre turno, no ocupa la caja y sirve para administrar y para autorizar operaciones en la caja; además puede forzar el cierre de un turno olvidado: si el turno tiene una venta abierta, el sistema advierte, pide confirmación y cancela esa venta <em>(supuesto)<\/em>, y queda registrado quién lo forzó y la venta cancelada. Tras el cierre del día el sistema rechaza abrir turno; el cierre no se deshace desde la aplicación y un cierre equivocado se resuelve fuera del sistema <em>(supuesto)<\/em>. Si el PIN de la dueña se bloquea, se recupera fuera del sistema por soporte técnico <em>(supuesto)<\/em>. El mecanismo definitivo (PIN, tarjeta o sesión por turno) se confirma con un spike.<\/p>\n<h2>Documentos de Referencia<\/h2>\n<ul>\n<li><span class=\"ref\">Caso Minisúper La Esquina, secciones 5.1 y 5.2<\/span><\/li>\n<li><span class=\"ref\">Descripción del problema<\/span><\/li>\n<li><span class=\"ref\">Arquitectura<\/span><\/li>\n<\/ul>\n<h2>Casos de Uso Relacionados<\/h2>\n<ul>\n<li><a href=\"#\" data-go=\"cu4\">CU-04 Abrir y cerrar turno de caja (identificar a la cajera)<\/a><\/li>\n<\/ul>\n<h2>Criterios de Aceptación<\/h2>\n<ol>\n<li>Con usuario y PIN correctos se abre la sesión de caja y se registra el inicio del turno.<\/li>\n<li>Con un PIN incorrecto no se abre la sesión y se permite reintentar.<\/li>\n<li>Tras 3 intentos fallidos consecutivos <em>(supuesto)<\/em> el PIN se bloquea; con el PIN bloqueado no se entra ni con el PIN correcto. Solo la dueña lo desbloquea (ver RF-05).<\/li>\n<li>Solo una cajera puede tener la caja abierta a la vez; una segunda debe esperar a que se cierre el turno anterior.<\/li>\n<li>Todas las operaciones del turno quedan asociadas a la cajera con la sesión abierta.<\/li>\n<li>La cajera puede cerrar su turno solo si no tiene una venta abierta; con una venta abierta el turno no se cierra y se le pide cobrarla o cancelarla. Una venta a fiado «en espera de autorización» (RF-02) no cuenta como venta abierta y no bloquea el cierre: sigue en espera hasta que la dueña resuelva o se cierre el día. Al cerrar, la caja queda libre y se registra la hora de fin.<\/li>\n<li>La identificación toma 3 s o menos <em>(supuesto)<\/em> y se pide una sola vez por turno (ver RNF-01).<\/li>\n<li>Tras 5 minutos sin actividad <em>(supuesto)<\/em> la pantalla se bloquea y pide el PIN; la misma cajera que ingresa su PIN vuelve a su venta abierta sin perder líneas, y otra cajera no puede continuar esa sesión.<\/li>\n<li>Una cajera inactiva no puede abrir sesión, y sus ventas anteriores se conservan a su nombre.<\/li>\n<li>Cada inicio y cierre de sesión, intento fallido de PIN y bloqueo queda en la bitácora con persona, fecha y hora (ver RNF-02).<\/li>\n<li>La sesión de la dueña es administrativa: no abre turno, no ocupa la caja y no cuenta como «caja abierta». Con su PIN la dueña administra y autoriza operaciones en la caja (fiados mayores a ₡20 000 y anulaciones) sin abrir turno ni cambiar a quién pertenece el turno abierto.<\/li>\n<li>Solo la dueña puede forzar el cierre del turno que una cajera olvidó cerrar; la caja queda libre, y la bitácora registra la cajera y quién forzó el cierre con fecha y hora. Si el turno tiene una venta abierta, el sistema advierte que se cancelará, pide confirmación y, al confirmar, cancela la venta y la deja registrada en la bitácora <em>(supuesto)<\/em>; si la dueña no confirma, nada cambia. Las ventas a fiado en espera de la cajera no se tocan. Si una cajera lo intenta, el sistema la rechaza por falta de permiso.<\/li>\n<li>Tras el cierre del día (RF-06) el sistema rechaza abrir turno e indica que el día está cerrado; el cierre no se deshace desde la aplicación y no se abre otro turno el mismo día <em>(supuesto)<\/em>. Al día siguiente las cajeras abren su turno con normalidad.<\/li>\n<li>Si el PIN de la dueña se bloquea, la aplicación no ofrece desbloquearlo: se recupera fuera del sistema por soporte técnico <em>(supuesto)<\/em> (ver RF-05).<\/li>\n<\/ol>\n<h2>Referencias<\/h2>\n<ul>\n<li><a href=\"#\" data-go=\"cu4\">CU-04<\/a><\/li>\n<li><a href=\"#\" data-go=\"cu4\">Backlog de CU-04<\/a><\/li>\n<li><a href=\"#\" data-go=\"rf5\">RF-05 Administrar cajeras<\/a><\/li>\n<li><a href=\"#\" data-go=\"rf6\">RF-06 Cerrar el día<\/a><\/li>\n<li><a href=\"#\" data-go=\"rnf3\">RNF-03 Control de acceso y protección de credenciales<\/a><\/li>\n<\/ul>"}, {"id": "cu4", "tipo": "cu", "codigo": "CU-04", "titulo": "Abrir y cerrar turno de caja (identificar a la cajera)", "corto": "Abrir y cerrar turno de caja", "abstract": "Este caso de uso permite que cada cajera abra su turno con su usuario y un PIN corto, de modo que toda operación quede asociada a una persona sin frenar el cobro, y que lo cierre al terminar. También cubre la sesión administrativa de la dueña, que no ocupa la caja, y el cierre forzado de un turno que una cajera olvidó cerrar.", "chips": ["Primarios: Cajera", "Secundarios: Dueña", "9 flujos alternativos"], "rnfs": ["rnf1", "rnf2", "rnf3"], "rfs": [], "rf": "rf4", "realiza": null, "realizaEn": [], "html": "<h2>Título del Caso de Uso<\/h2>\n<p>CU-04 Abrir y cerrar turno de caja (identificar a la cajera) (atiende <a href=\"#\" data-go=\"rf4\">RF-04<\/a>)<\/p>\n<h2>Descripción<\/h2>\n<p>Este caso de uso permite que cada cajera abra su turno con su usuario y un PIN corto, de modo que toda operación quede asociada a una persona sin frenar el cobro, y que lo cierre al terminar. También cubre la sesión administrativa de la dueña, que no ocupa la caja, y el cierre forzado de un turno que una cajera olvidó cerrar. Una vez que la dueña cierra el día (<a href=\"#\" data-go=\"cu6\">CU-06<\/a>), no se abre otro turno ese día. La administración de las cajeras (crear, inactivar, desbloquear y reasignar PIN) está en <a href=\"#\" data-go=\"cu5\">CU-05<\/a>.<\/p>\n<h2>Actores<\/h2>\n<ul>\n<li><strong>Primarios<\/strong>: Cajera (abre y cierra su turno)<\/li>\n<li><strong>Secundarios<\/strong>: Dueña (se identifica con una sesión administrativa en FA-07 y fuerza el cierre de un turno olvidado en FA-08)<\/li>\n<\/ul>\n<h2>Precondiciones<\/h2>\n<ul>\n<li>La cajera tiene un usuario activo y un PIN asignados por la dueña (<a href=\"#\" data-go=\"cu5\">CU-05<\/a>).<\/li>\n<li>Ninguna otra cajera tiene la caja abierta.<\/li>\n<li>El día no está cerrado (<a href=\"#\" data-go=\"cu6\">CU-06<\/a>). <span class=\"ref\">FA-09<\/span><\/li>\n<\/ul>\n<h2>Postcondiciones<\/h2>\n<ul>\n<li>Al terminar el paso 5 (turno abierto): hay una sesión de caja abierta a nombre de la cajera, toda operación posterior queda a su nombre y el inicio del turno quedó registrado en la bitácora.<\/li>\n<li>Al terminar el paso 7 (turno cerrado): la sesión está cerrada, la hora de fin quedó registrada en la bitácora y ninguna cajera tiene la caja abierta.<\/li>\n<li>Al terminar FA-07 (sesión administrativa): la dueña tiene una sesión administrativa abierta, la caja no cambió de estado y el inicio de la sesión quedó en la bitácora.<\/li>\n<li>Al terminar FA-08 (cierre forzado): el turno de la cajera quedó cerrado, la caja está libre, la venta abierta que tuviera quedó cancelada y la bitácora registra la cajera, quién forzó el cierre y la venta cancelada. Las ventas a fiado en espera de autorización de esa cajera siguen en espera.<\/li>\n<li>Al terminar FA-09 (día cerrado): no se abrió ningún turno ni sesión de caja y el sistema indicó que el día está cerrado.<\/li>\n<\/ul>\n<h2>Flujo Principal<\/h2>\n<ol>\n<li>La cajera selecciona su usuario. <span class=\"ref\">FA-03<\/span> <span class=\"ref\">FA-04<\/span> <span class=\"ref\">FA-07<\/span> <span class=\"ref\">FA-09<\/span><\/li>\n<li>La cajera ingresa su PIN.<\/li>\n<li>El sistema valida el PIN. <span class=\"ref\">FA-01<\/span> <span class=\"ref\">FA-02<\/span><\/li>\n<li>El sistema abre la sesión de caja y registra el inicio del turno.<\/li>\n<li>El sistema muestra la pantalla de venta (<a href=\"#\" data-go=\"cu1\">CU-01<\/a>). Durante el turno el sistema no vuelve a pedir el PIN, salvo por <span class=\"ref\">FA-05<\/span>.<\/li>\n<li>Al terminar, la cajera cierra su turno. <span class=\"ref\">FA-06<\/span><\/li>\n<li>El sistema cierra la sesión y registra el fin del turno.<\/li>\n<\/ol>\n<h2>Flujos Alternativos<\/h2>\n<h3>FA-01: PIN incorrecto<\/h3>\n<ol>\n<li>El sistema indica «PIN incorrecto» y cuenta el intento fallido.<\/li>\n<li>La cajera reintenta.<\/li>\n<li>El caso de uso continúa en el paso 2 del flujo principal.<\/li>\n<\/ol>\n<h3>FA-02: Tercer intento fallido<\/h3>\n<ol>\n<li>El sistema bloquea el PIN tras 3 intentos fallidos consecutivos <em>(supuesto)<\/em>.<\/li>\n<li>El sistema indica que solo la dueña lo puede desbloquear (<a href=\"#\" data-go=\"cu5\">CU-05<\/a>).<\/li>\n<li>El sistema registra los intentos y el bloqueo en la bitácora y el caso de uso termina.<\/li>\n<\/ol>\n<h3>FA-03: Usuario bloqueado o inactivo<\/h3>\n<ol>\n<li>El sistema impide el inicio de sesión, incluso con el PIN correcto.<\/li>\n<li>El sistema indica que el usuario está bloqueado o inactivo y a quién acudir.<\/li>\n<li>El caso de uso termina.<\/li>\n<\/ol>\n<h3>FA-04: Otra cajera tiene la caja abierta<\/h3>\n<ol>\n<li>El sistema no abre la sesión y pide cerrar el turno anterior.<\/li>\n<li>La cajera anterior cierra su turno (pasos 6 y 7 del flujo principal) o, si lo olvidó, la dueña lo fuerza (<span class=\"ref\">FA-08<\/span>).<\/li>\n<li>El caso de uso continúa en el paso 1 del flujo principal.<\/li>\n<\/ol>\n<h3>FA-05: Inactividad de la sesión<\/h3>\n<ol>\n<li>Pasados 5 minutos sin actividad <em>(supuesto)<\/em>, el sistema bloquea la pantalla y pide el PIN.<\/li>\n<li>La misma cajera ingresa su PIN; el sistema la devuelve a la venta abierta con sus líneas.<\/li>\n<li>Si otra cajera ingresa su propio PIN, el sistema no desbloquea y pide cerrar el turno de la primera.<\/li>\n<li>La sesión administrativa de la dueña se bloquea igual y se desbloquea con su PIN.<\/li>\n<\/ol>\n<h3>FA-06: Cierre de turno con venta abierta<\/h3>\n<ol>\n<li>El sistema no cierra el turno y pide cobrar o cancelar la venta abierta.<\/li>\n<li>La cajera cobra o cancela la venta.<\/li>\n<li>El caso de uso continúa en el paso 6 del flujo principal.<\/li>\n<li>Solo una venta ABIERTA bloquea el cierre del turno. Una venta a fiado «en espera de autorización» (<span class=\"ref\">CU-02 FA-04<\/span>) no es una venta abierta y no lo bloquea: el turno se cierra y la venta sigue en espera hasta que la dueña resuelva o hasta el cierre del día.<\/li>\n<\/ol>\n<h3>FA-07: La dueña se identifica (sesión administrativa)<\/h3>\n<ol>\n<li>La dueña selecciona su usuario e ingresa su PIN (pasos 1 a 3 del flujo principal, con las mismas reglas de PIN incorrecto y bloqueo).<\/li>\n<li>El sistema abre una sesión administrativa a nombre de la dueña y registra su inicio en la bitácora. Esta sesión no abre un turno de caja, no ocupa la caja y no cuenta como «caja abierta».<\/li>\n<li>Desde la sesión administrativa, la dueña administra las cajeras (<a href=\"#\" data-go=\"cu5\">CU-05<\/a>) y puede forzar el cierre de un turno olvidado (<span class=\"ref\">FA-08<\/span>).<\/li>\n<li>Con la caja de una cajera abierta, la dueña ingresa su PIN en la misma caja para autorizar un fiado mayor a ₡20 000 (<a href=\"#\" data-go=\"cu2\">CU-02<\/a>) o una anulación (<a href=\"#\" data-go=\"cu3\">CU-03<\/a>). El turno sigue a nombre de la cajera y la autorización queda a nombre de la dueña. Si no hay turno abierto, la dueña resuelve desde su sesión administrativa las ventas que sigan en espera.<\/li>\n<li>Si el PIN de la dueña se bloquea por intentos fallidos, la aplicación no ofrece desbloquearlo: se recupera fuera del sistema por soporte técnico <em>(supuesto)<\/em>, igual que la asignación inicial de su PIN (<a href=\"#\" data-go=\"cu5\">CU-05<\/a>).<\/li>\n<\/ol>\n<h3>FA-08: La dueña fuerza el cierre de un turno olvidado<\/h3>\n<ol>\n<li>La dueña, con su sesión administrativa abierta (FA-07), selecciona el turno abierto de una cajera que olvidó cerrarlo.<\/li>\n<li>Si el turno tiene una venta abierta sin cobrar, el sistema advierte que esa venta se cancelará <em>(supuesto)<\/em> y pide confirmación. Si la dueña no confirma, no cambia nada: el turno y la venta siguen abiertos.<\/li>\n<li>Con la confirmación, el sistema cancela la venta abierta, cierra la sesión de la cajera, registra la hora de fin y deja en la bitácora la cajera, quién forzó el cierre, la venta cancelada (identificador y total), la fecha y la hora.<\/li>\n<li>La caja queda libre; el token de la cajera deja de ser válido. Las ventas a fiado en espera de autorización de esa cajera no se tocan: siguen en espera.<\/li>\n<\/ol>\n<h3>FA-09: Intento de abrir turno después del cierre del día<\/h3>\n<ol>\n<li>La dueña ya cerró el día (<a href=\"#\" data-go=\"cu6\">CU-06<\/a>) y una cajera selecciona su usuario para abrir turno.<\/li>\n<li>El sistema no abre el turno ni la sesión de caja e indica que el día está cerrado.<\/li>\n<li>El caso de uso termina. El cierre del día no se deshace desde la aplicación y no se abre otro turno el mismo día; un cierre equivocado se resuelve fuera del sistema <em>(supuesto)<\/em>. La sesión administrativa de la dueña no se bloquea por el cierre del día <em>(supuesto)<\/em>, y al día siguiente las cajeras abren su turno con normalidad.<\/li>\n<\/ol>\n<h2>Prototipos<\/h2>\n<p>Boceto de baja fidelidad del inicio de turno:<\/p>\n<pre><code class=\"language-text\">+---------------------------------+\n| Abrir caja                      |\n| Usuario:  (o) Yendry            |\n|           ( ) Katherine         |\n|           ( ) Doña Marta        |\n|                                 |\n| PIN:  [ * * * * ]               |\n|        1  2  3                  |\n|        4  5  6                  |\n|        7  8  9                  |\n|           0   [Entrar]          |\n+---------------------------------+\n<\/code><\/pre>\n<p>Si el usuario elegido es «Doña Marta», la pantalla que sigue es la administración, no la de venta.<\/p>\n<h2>Requerimientos Especiales<\/h2>\n<ul>\n<li><strong>Seguridad<\/strong> (RNF-03): incluye <a href=\"#\" data-go=\"cu8\">CU-08 Autorizar una operación sensible con el PIN de la dueña<\/a> para la autorización con PIN.<\/li>\n<li><strong>Usabilidad<\/strong> (RNF-01, <em>supuestos<\/em>): la identificación toma 3 s o menos y se pide una vez por turno, no por venta.<\/li>\n<li><strong>Seguridad<\/strong> (RNF-03): el PIN se guarda con hash y no aparece en registros ni en respuestas; los permisos se validan en el servidor; el token de sesión expira al cerrar el turno.<\/li>\n<li><strong>Seguridad<\/strong> (RNF-02): inicios, cierres, intentos fallidos, bloqueos y cierres forzados quedan en la bitácora, que no se puede editar ni borrar.<\/li>\n<li><strong>Regla de negocio<\/strong> <em>(supuesto)<\/em>: el PIN tiene de 4 a 6 dígitos.<\/li>\n<li><strong>Regla de negocio<\/strong>: solo una cajera puede tener la caja abierta a la vez.<\/li>\n<li><strong>Regla de negocio<\/strong>: la sesión de la dueña es administrativa; no ocupa la caja ni cuenta como «caja abierta». La dueña se identifica con su PIN para administrar y también para autorizar operaciones en la caja (fiados mayores a ₡20 000 y anulaciones) sin abrir turno.<\/li>\n<li><strong>Regla de negocio<\/strong>: solo la dueña puede forzar el cierre de un turno de otra persona.<\/li>\n<li><strong>Regla de negocio<\/strong> <em>(supuesto)<\/em>: forzar el cierre de un turno con una venta abierta cancela esa venta, previa advertencia y confirmación de la dueña; la bitácora registra quién lo forzó y la venta cancelada.<\/li>\n<li><strong>Regla de negocio<\/strong>: el cierre de turno se bloquea solo por una venta ABIERTA, no por una venta a fiado «en espera de autorización»; esta sigue en espera al cerrar el turno hasta que la dueña resuelva o hasta el cierre del día.<\/li>\n<li><strong>Regla de negocio<\/strong> <em>(supuesto)<\/em>: tras el cierre del día (<a href=\"#\" data-go=\"cu6\">CU-06<\/a>) el sistema rechaza abrir turno e indica que el día está cerrado; el cierre no se deshace desde la aplicación y no se abre otro turno el mismo día. Un cierre equivocado se resuelve fuera del sistema.<\/li>\n<li><strong>Límite<\/strong> <em>(supuesto)<\/em>: si el PIN de la dueña se bloquea, se recupera fuera del sistema por soporte técnico; la aplicación no ofrece desbloquearlo ni reasignarlo.<\/li>\n<li><strong>Regla de negocio<\/strong>: crear cajeras, asignar PIN, inactivar y desbloquear PIN corresponden a <a href=\"#\" data-go=\"cu5\">CU-05<\/a>.<\/li>\n<li><strong>Decisión de diseño por validar (spike)<\/strong>: el PIN corto una vez por turno es la propuesta para balancear trazabilidad y velocidad. Las alternativas son tarjeta de proximidad y sesión por turno con renovación; se resuelve con el spike S1 del <a href=\"#\" data-go=\"cu4\">backlog<\/a> antes de implementar.<\/li>\n<\/ul>\n<h2>Escenarios de Prueba<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Entrada<\/th>\n<th>Salida Esperada<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Flujo principal: «Yendry» con PIN «4821» y ninguna cajera con la caja abierta<\/td>\n<td>Sesión de caja abierta a nombre de «Yendry», inicio de turno registrado y pantalla de venta<\/td>\n<\/tr>\n<tr>\n<td>Flujo principal: «Yendry» registra tres ventas seguidas<\/td>\n<td>El sistema no vuelve a pedir el PIN<\/td>\n<\/tr>\n<tr>\n<td>Flujo principal: «Yendry» cierra su turno<\/td>\n<td>Sesión cerrada, hora de fin registrada y ninguna cajera con la caja abierta<\/td>\n<\/tr>\n<tr>\n<td>FA-01: PIN «0000» para «Yendry»<\/td>\n<td>No se abre la sesión y se muestra «PIN incorrecto»<\/td>\n<\/tr>\n<tr>\n<td>FA-01: PIN «0000» y luego «4821»<\/td>\n<td>Se abre la sesión y los intentos fallidos vuelven a cero<\/td>\n<\/tr>\n<tr>\n<td>FA-02: 3 PIN incorrectos seguidos<\/td>\n<td>PIN bloqueado, mensaje de que solo la dueña lo desbloquea e intentos y bloqueo en la bitácora<\/td>\n<\/tr>\n<tr>\n<td>FA-02: PIN bloqueado y luego el PIN correcto de «Yendry»<\/td>\n<td>No se abre la sesión<\/td>\n<\/tr>\n<tr>\n<td>FA-03: PIN correcto con el usuario bloqueado<\/td>\n<td>No se abre la sesión; mensaje de usuario bloqueado y a quién acudir<\/td>\n<\/tr>\n<tr>\n<td>FA-03: usuario «Katherine» inactivo<\/td>\n<td>No se abre la sesión; mensaje de usuario inactivo y sus ventas anteriores siguen a su nombre<\/td>\n<\/tr>\n<tr>\n<td>FA-04: «Katherine» intenta abrir con la caja de «Yendry» abierta<\/td>\n<td>No se abre la sesión; se pide cerrar el turno de «Yendry»<\/td>\n<\/tr>\n<tr>\n<td>FA-05: 5 minutos sin actividad y luego el PIN de «Yendry»<\/td>\n<td>Pantalla bloqueada y, al ingresar el PIN, vuelve a la venta con sus 2 líneas<\/td>\n<\/tr>\n<tr>\n<td>FA-05: 5 minutos sin actividad y luego el PIN de «Katherine»<\/td>\n<td>La pantalla sigue bloqueada y se pide cerrar el turno de «Yendry»<\/td>\n<\/tr>\n<tr>\n<td>FA-06: cerrar el turno con 1 línea en una venta abierta<\/td>\n<td>El turno no se cierra y se pide cobrar o cancelar la venta<\/td>\n<\/tr>\n<tr>\n<td>FA-06: cerrar el turno con una venta a fiado de ₡25 000 en espera de autorización y sin venta abierta<\/td>\n<td>El turno se cierra; la venta sigue en espera hasta que la dueña resuelva o se cierre el día<\/td>\n<\/tr>\n<tr>\n<td>FA-07: «Doña Marta» con PIN «7365» y la caja de «Yendry» abierta<\/td>\n<td>Sesión administrativa abierta; la caja sigue a nombre de «Yendry»<\/td>\n<\/tr>\n<tr>\n<td>FA-07: «Doña Marta» con PIN «7365» y ninguna caja abierta<\/td>\n<td>Sesión administrativa abierta y ninguna cajera con la caja abierta<\/td>\n<\/tr>\n<tr>\n<td>FA-07: «Doña Marta» autoriza un fiado de ₡35 000 en la caja de «Yendry»<\/td>\n<td>La autorización queda a nombre de «Doña Marta» y el turno sigue a nombre de «Yendry»<\/td>\n<\/tr>\n<tr>\n<td>FA-08: «Yendry» olvidó cerrar el turno y «Doña Marta» lo fuerza<\/td>\n<td>Turno cerrado, caja libre y bitácora con «Yendry» y «Doña Marta» como quien forzó el cierre<\/td>\n<\/tr>\n<tr>\n<td>FA-08: el turno olvidado tiene una venta abierta de 2 líneas<\/td>\n<td>El sistema advierte que se cancelará y pide confirmación<\/td>\n<\/tr>\n<tr>\n<td>FA-08: la dueña confirma el cierre forzado con la venta abierta de 2 líneas<\/td>\n<td>La venta abierta queda cancelada, el turno se cierra, la caja queda libre y la bitácora registra a «Yendry», a «Doña Marta» como quien lo forzó y la venta cancelada <em>(supuesto)<\/em><\/td>\n<\/tr>\n<tr>\n<td>FA-08: la dueña no confirma la advertencia<\/td>\n<td>El turno de «Yendry» y su venta abierta siguen sin cambios<\/td>\n<\/tr>\n<tr>\n<td>FA-08: el turno olvidado tiene además una venta a fiado de ₡25 000 en espera<\/td>\n<td>Tras el cierre forzado la venta sigue en espera de autorización<\/td>\n<\/tr>\n<tr>\n<td>FA-08: «Katherine» (cajera) intenta forzar el cierre del turno de «Yendry»<\/td>\n<td>Operación rechazada por falta de permiso y el turno sigue abierto<\/td>\n<\/tr>\n<tr>\n<td>FA-04 y FA-08: «Doña Marta» fuerza el cierre de «Yendry» y luego «Katherine» intenta abrir<\/td>\n<td>«Katherine» puede abrir su turno<\/td>\n<\/tr>\n<tr>\n<td>FA-09: «Doña Marta» cerró el día a las 20:15 y «Yendry» intenta abrir turno con su PIN correcto<\/td>\n<td>No se abre turno ni sesión de caja; mensaje de que el día está cerrado <em>(supuesto)<\/em><\/td>\n<\/tr>\n<tr>\n<td>FA-09: «Doña Marta» cerró el día y se intenta abrir otro turno el mismo día<\/td>\n<td>Se rechaza; el cierre no se deshace desde la aplicación<\/td>\n<\/tr>\n<tr>\n<td>FA-09: al día siguiente del cierre, «Yendry» abre turno con su PIN correcto<\/td>\n<td>Sesión de caja abierta a nombre de «Yendry»<\/td>\n<\/tr>\n<tr>\n<td>Límite: el PIN de «Doña Marta» se bloquea y ella ingresa el PIN correcto<\/td>\n<td>No se abre su sesión; la aplicación no ofrece desbloquearlo y se indica que se recupera por soporte técnico <em>(supuesto)<\/em><\/td>\n<\/tr>\n<tr>\n<td>Flujo principal: «Yendry» abre la sesión y registra una venta<\/td>\n<td>La venta queda asociada a «Yendry»<\/td>\n<\/tr>\n<tr>\n<td>Flujo principal: cronometrar la identificación de «Yendry» (selección de usuario, PIN y Entrar)<\/td>\n<td>Toma 3 s o menos<\/td>\n<\/tr>\n<tr>\n<td>Flujo principal: después de cerrar el turno, usar el token de la sesión cerrada<\/td>\n<td>Solicitud rechazada por autenticación requerida<\/td>\n<\/tr>\n<tr>\n<td>Seguridad: consultar cómo quedó guardado el PIN «593821»<\/td>\n<td>El valor guardado es un hash y no contiene «593821»<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Guiones de prueba (Gherkin):<\/strong> <span class=\"ref\">h1<\/span>, <span class=\"ref\">h2<\/span>, <span class=\"ref\">h3<\/span>, <span class=\"ref\">h4<\/span>, <span class=\"ref\">h5<\/span>, <span class=\"ref\">h6<\/span>, <span class=\"ref\">h7<\/span>, <span class=\"ref\">h8<\/span>, <span class=\"ref\">h9<\/span>, <span class=\"ref\">h10<\/span>, <span class=\"ref\">h11<\/span>. Backlog: <a href=\"#\" data-go=\"cu4\">CU-04-backlog.md<\/a>.<\/p>"}, {"id": "rf5", "tipo": "rf", "codigo": "RF-05", "titulo": "Administrar cajeras", "corto": "Administrar cajeras", "abstract": "El sistema debe permitir que la dueña cree cajeras con un PIN, las inactive, desbloquee un PIN bloqueado y reasigne el PIN de una cajera. Nadie más puede hacer estas operaciones, y cada una queda en la bitácora.", "chips": ["Actores: dueña (administra), cajera (la persona administrada)"], "rnfs": ["rnf2", "rnf3"], "rfs": [], "realiza": null, "realizaEn": [], "html": "<h2>Descripción<\/h2>\n<p>El sistema debe permitir que la dueña cree cajeras con un PIN, las inactive, desbloquee un PIN bloqueado y reasigne el PIN de una cajera. Nadie más puede hacer estas operaciones, y cada una queda en la bitácora.<\/p>\n<p><strong>Actores:<\/strong> dueña (administra), cajera (la persona administrada).<\/p>\n<h2>Necesidad<\/h2>\n<p>Corresponde a los problemas 1 y 4 de <span class=\"ref\">problema.md<\/span>: para atribuir cada operación a una persona, cada cajera necesita su propia identidad, y solo la dueña puede crearla, retirarla o recuperarla. Si cualquiera pudiera cambiar un PIN, la bitácora dejaría de ser confiable.<\/p>\n<h2>Proceso Actual<\/h2>\n<p>No hay identidades dentro del sistema. Las cajeras comparten la misma registradora y no existe un registro de quién entra o sale del equipo.<\/p>\n<h2>Solución Propuesta<\/h2>\n<p>La dueña, con su sesión administrativa (ver <a href=\"#\" data-go=\"rf4\">RF-04<\/a>), crea cada cajera con su nombre y un PIN de 4 a 6 dígitos <em>(supuesto)<\/em>. Puede inactivar una cajera, que deja de poder entrar pero conserva sus ventas anteriores a su nombre; desbloquear el PIN que se bloqueó tras 3 intentos fallidos <em>(supuesto)<\/em>; y reasignar el PIN de una cajera que lo olvidó o lo expuso. La sesión de la dueña no ocupa la caja. Los permisos se validan en el servidor.<\/p>\n<p><strong>Límites de esta versión<\/strong> <em>(supuesto)<\/em>: el PIN de la dueña lo asigna el soporte técnico al instalar el sistema; si se bloquea, se recupera fuera del sistema por soporte técnico. Reasignar el PIN de la dueña por ella misma queda fuera de alcance.<\/p>\n<h2>Documentos de Referencia<\/h2>\n<ul>\n<li><span class=\"ref\">Caso Minisúper La Esquina, secciones 5.1 y 5.2<\/span><\/li>\n<li><span class=\"ref\">Descripción del problema<\/span><\/li>\n<li><span class=\"ref\">Arquitectura<\/span><\/li>\n<\/ul>\n<h2>Casos de Uso Relacionados<\/h2>\n<ul>\n<li><a href=\"#\" data-go=\"cu5\">CU-05 Administrar cajeras<\/a><\/li>\n<\/ul>\n<h2>Criterios de Aceptación<\/h2>\n<ol>\n<li>La dueña puede crear una cajera con nombre y PIN; la cajera queda activa y puede abrir su turno con ese PIN.<\/li>\n<li>El PIN tiene de 4 a 6 dígitos <em>(supuesto)<\/em>; al crear una cajera o reasignar un PIN, cualquier otro valor se rechaza y no se cambia nada.<\/li>\n<li>No se crea una cajera con nombre vacío ni con el nombre de una cajera que ya existe.<\/li>\n<li>Al inactivar una cajera, esta no puede abrir sesión y sus ventas anteriores se conservan a su nombre; si tiene el turno abierto, antes se debe forzar su cierre <em>(supuesto)<\/em>.<\/li>\n<li>La dueña puede desbloquear el PIN de una cajera; los intentos fallidos vuelven a cero y la cajera puede entrar.<\/li>\n<li>La dueña puede reasignar el PIN de una cajera; el PIN anterior deja de servir y, si estaba bloqueado, queda desbloqueado <em>(supuesto)<\/em>.<\/li>\n<li>El PIN se guarda con hash y no aparece en la bitácora, en registros ni en respuestas (ver RNF-03).<\/li>\n<li>Solo la dueña puede crear cajeras, inactivarlas, desbloquear y reasignar PIN; si una cajera lo intenta, o no hay sesión, el sistema rechaza la operación (falta de permiso o autenticación requerida) y no cambia nada.<\/li>\n<li>La administración cubre solo a las cajeras: el sistema no ofrece desbloquear ni reasignar el PIN de la dueña, que se recupera fuera del sistema por soporte técnico <em>(supuesto)<\/em>.<\/li>\n<li>Cada creación, inactivación, desbloqueo y reasignación queda en la bitácora con la dueña, la cajera afectada, fecha y hora, y la bitácora no se puede editar ni borrar (ver RNF-02).<\/li>\n<\/ol>\n<h2>Referencias<\/h2>\n<ul>\n<li><a href=\"#\" data-go=\"cu5\">CU-05<\/a><\/li>\n<li><a href=\"#\" data-go=\"cu5\">Backlog de CU-05<\/a><\/li>\n<li><a href=\"#\" data-go=\"rf4\">RF-04 Abrir y cerrar turno de caja<\/a><\/li>\n<li><a href=\"#\" data-go=\"rnf2\">RNF-02 Trazabilidad y auditoría<\/a><\/li>\n<li><a href=\"#\" data-go=\"rnf3\">RNF-03 Control de acceso y protección de credenciales<\/a><\/li>\n<\/ul>"}, {"id": "cu5", "tipo": "cu", "codigo": "CU-05", "titulo": "Administrar cajeras", "corto": "Administrar cajeras", "abstract": "Este caso de uso permite que la dueña cree cajeras con su PIN, las inactive, desbloquee un PIN bloqueado y reasigne el PIN de una cajera, para que cada persona tenga su propia identidad en la caja y nadie más pueda administrarla.", "chips": ["Primarios: Dueña", "Secundarios: Cajera", "6 flujos alternativos"], "rnfs": ["rnf2", "rnf3"], "rfs": [], "rf": "rf5", "realiza": null, "realizaEn": [], "html": "<h2>Título del Caso de Uso<\/h2>\n<p>CU-05 Administrar cajeras (atiende <a href=\"#\" data-go=\"rf5\">RF-05<\/a>)<\/p>\n<h2>Descripción<\/h2>\n<p>Este caso de uso permite que la dueña cree cajeras con su PIN, las inactive, desbloquee un PIN bloqueado y reasigne el PIN de una cajera, para que cada persona tenga su propia identidad en la caja y nadie más pueda administrarla.<\/p>\n<h2>Actores<\/h2>\n<ul>\n<li><strong>Primarios<\/strong>: Dueña (administra las cajeras)<\/li>\n<li><strong>Secundarios<\/strong>: Cajera (la persona administrada; no participa en la administración)<\/li>\n<\/ul>\n<h2>Precondiciones<\/h2>\n<ul>\n<li>La dueña tiene su sesión administrativa abierta (<a href=\"#\" data-go=\"cu4\">CU-04<\/a>, FA-07). No necesita que la caja esté abierta ni la abre.<\/li>\n<\/ul>\n<h2>Postcondiciones<\/h2>\n<ul>\n<li>Según la acción: hay una cajera nueva y activa con su PIN, una cajera inactiva, un PIN desbloqueado o un PIN reasignado.<\/li>\n<li>El PIN nunca queda en texto plano.<\/li>\n<li>La bitácora registra la acción, la dueña que la hizo, la cajera afectada, la fecha y la hora.<\/li>\n<\/ul>\n<h2>Flujo Principal<\/h2>\n<ol>\n<li>La dueña abre la administración de cajeras y el sistema muestra la lista con el estado de cada una (activa, inactiva o bloqueada). <span class=\"ref\">FA-06<\/span><\/li>\n<li>La dueña elige crear una cajera e ingresa su nombre y un PIN de 4 a 6 dígitos. <span class=\"ref\">FA-01<\/span> <span class=\"ref\">FA-02<\/span><\/li>\n<li>El sistema crea la cajera como activa, con el PIN guardado con hash.<\/li>\n<li>El sistema registra la creación en la bitácora.<\/li>\n<li>La cajera puede abrir su turno con su usuario y PIN (<a href=\"#\" data-go=\"cu4\">CU-04<\/a>).<\/li>\n<\/ol>\n<h2>Flujos Alternativos<\/h2>\n<h3>FA-01: PIN con formato inválido<\/h3>\n<ol>\n<li>El sistema rechaza el PIN que no tenga de 4 a 6 dígitos <em>(supuesto)<\/em> o tenga caracteres que no sean dígitos.<\/li>\n<li>El sistema indica que debe tener de 4 a 6 dígitos y no crea ni cambia nada.<\/li>\n<li>El caso de uso continúa en el paso 2 del flujo principal (o en el paso 1 de FA-05 si se reasignaba un PIN).<\/li>\n<\/ol>\n<h3>FA-02: Nombre vacío o repetido<\/h3>\n<ol>\n<li>El sistema rechaza el nombre vacío o el de una cajera que ya existe (activa o inactiva).<\/li>\n<li>El sistema indica el motivo y no crea la cajera.<\/li>\n<li>El caso de uso continúa en el paso 2 del flujo principal.<\/li>\n<\/ol>\n<h3>FA-03: La dueña inactiva una cajera<\/h3>\n<ol>\n<li>La dueña selecciona una cajera activa y la inactiva.<\/li>\n<li>Si la cajera tiene el turno abierto, el sistema no la inactiva y pide forzar antes el cierre del turno (<a href=\"#\" data-go=\"cu4\">CU-04<\/a>, FA-08) <em>(supuesto)<\/em>.<\/li>\n<li>El sistema marca la cajera como inactiva: no puede iniciar sesión, aunque use el PIN correcto. Sus ventas anteriores se conservan a su nombre.<\/li>\n<li>El sistema registra la inactivación en la bitácora.<\/li>\n<\/ol>\n<h3>FA-04: La dueña desbloquea un PIN<\/h3>\n<ol>\n<li>La dueña selecciona una cajera con el PIN bloqueado y lo desbloquea.<\/li>\n<li>El sistema deja el contador de intentos fallidos en cero.<\/li>\n<li>El sistema registra el desbloqueo en la bitácora; la cajera puede iniciar sesión con su PIN.<\/li>\n<\/ol>\n<h3>FA-05: La dueña reasigna el PIN de una cajera<\/h3>\n<ol>\n<li>La dueña selecciona una cajera activa e ingresa un PIN nuevo de 4 a 6 dígitos. <span class=\"ref\">FA-01<\/span><\/li>\n<li>El sistema guarda el PIN nuevo con hash; el PIN anterior deja de servir. Si el PIN estaba bloqueado, queda desbloqueado y con intentos fallidos en cero <em>(supuesto)<\/em>.<\/li>\n<li>El sistema registra la reasignación en la bitácora, sin guardar ni mostrar el PIN.<\/li>\n<li>La dueña comunica el PIN nuevo a la cajera; el turno que la cajera tenga abierto continúa sin cambios.<\/li>\n<\/ol>\n<h3>FA-06: Una cajera intenta administrar<\/h3>\n<ol>\n<li>Una cajera (o una solicitud sin sesión de dueña) intenta crear, inactivar, desbloquear o reasignar PIN.<\/li>\n<li>El sistema rechaza la operación por falta de permiso, validada en el servidor, y no cambia nada.<\/li>\n<li>El caso de uso termina.<\/li>\n<\/ol>\n<h2>Prototipos<\/h2>\n<p>Boceto de baja fidelidad de la administración de cajeras:<\/p>\n<pre><code class=\"language-text\">+------------------------------------------------------+\n| Administrar cajeras              Sesión: Doña Marta  |\n| [+ Nueva cajera]                                     |\n|                                                      |\n| Yendry      Activa     [Reasignar PIN] [Inactivar]   |\n| Katherine   Bloqueada  [Desbloquear]   [Reasignar PIN]|\n| Daniela     Activa     [Reasignar PIN] [Inactivar]   |\n+------------------------------------------------------+\n<\/code><\/pre>\n<h2>Requerimientos Especiales<\/h2>\n<ul>\n<li><strong>Seguridad<\/strong> (RNF-03): incluye <a href=\"#\" data-go=\"cu8\">CU-08 Autorizar una operación sensible con el PIN de la dueña<\/a> para la autorización con PIN.<\/li>\n<li><strong>Seguridad<\/strong> (RNF-03): los permisos de dueña se validan en el servidor; el PIN se guarda con hash y no aparece en registros ni en respuestas.<\/li>\n<li><strong>Seguridad<\/strong> (RNF-02): crear, inactivar, desbloquear y reasignar quedan en la bitácora, que no se puede editar ni borrar.<\/li>\n<li><strong>Regla de negocio<\/strong> <em>(supuesto)<\/em>: el PIN tiene de 4 a 6 dígitos.<\/li>\n<li><strong>Regla de negocio<\/strong>: solo la dueña crea cajeras, asigna y reasigna PIN, inactiva cajeras y desbloquea PIN.<\/li>\n<li><strong>Regla de negocio<\/strong>: la sesión de la dueña es administrativa; no ocupa la caja ni cuenta como «caja abierta». La dueña se identifica con su PIN para administrar y también para autorizar operaciones en la caja (fiados mayores a ₡20 000 y anulaciones) sin abrir turno.<\/li>\n<li><strong>Límite<\/strong> <em>(supuesto)<\/em>: el PIN de la dueña lo asigna el soporte técnico al instalar el sistema. Si el PIN de la dueña se bloquea, se recupera fuera del sistema por soporte técnico; la aplicación no ofrece desbloquearlo.<\/li>\n<li><strong>Límite<\/strong> <em>(supuesto)<\/em>: reasignar el PIN de la dueña por ella misma queda fuera del alcance de esta versión; esta administración solo cubre a las cajeras.<\/li>\n<li><strong>Regla de negocio<\/strong>: una cajera inactiva conserva sus ventas anteriores a su nombre; nunca se borra.<\/li>\n<\/ul>\n<h2>Escenarios de Prueba<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Entrada<\/th>\n<th>Salida Esperada<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Flujo principal: la dueña crea la cajera «Daniela» con PIN «593821»<\/td>\n<td>«Daniela» queda activa, creación en la bitácora y puede abrir su turno<\/td>\n<\/tr>\n<tr>\n<td>FA-01: crear una cajera con PIN «123» o «12ab»<\/td>\n<td>PIN rechazado con el mensaje de que debe tener de 4 a 6 dígitos<\/td>\n<\/tr>\n<tr>\n<td>FA-01: reasignar a «Yendry» el PIN «98»<\/td>\n<td>PIN rechazado y el PIN actual de «Yendry» sigue funcionando<\/td>\n<\/tr>\n<tr>\n<td>FA-02: crear una cajera sin nombre<\/td>\n<td>Cajera no creada; se indica que el nombre es obligatorio<\/td>\n<\/tr>\n<tr>\n<td>FA-02: crear otra cajera «Yendry»<\/td>\n<td>Cajera no creada; se indica que ya existe<\/td>\n<\/tr>\n<tr>\n<td>FA-03: la dueña inactiva a «Katherine»<\/td>\n<td>«Katherine» no puede iniciar sesión y sus ventas anteriores siguen a su nombre<\/td>\n<\/tr>\n<tr>\n<td>FA-03: la dueña intenta inactivar a «Yendry» con el turno abierto<\/td>\n<td>No se inactiva; se pide forzar antes el cierre del turno<\/td>\n<\/tr>\n<tr>\n<td>FA-04: la dueña desbloquea el PIN de «Yendry»<\/td>\n<td>El PIN queda desbloqueado, intentos en cero y «Yendry» puede entrar<\/td>\n<\/tr>\n<tr>\n<td>FA-05: la dueña reasigna a «Yendry» el PIN «7102»<\/td>\n<td>Con «7102» entra; con «4821» no<\/td>\n<\/tr>\n<tr>\n<td>FA-05: reasignar el PIN de «Yendry», que estaba bloqueado<\/td>\n<td>El PIN queda desbloqueado con el valor nuevo<\/td>\n<\/tr>\n<tr>\n<td>FA-05: consultar cómo quedó guardado el PIN «7102»<\/td>\n<td>El valor guardado es un hash y no contiene «7102»; la bitácora no lo muestra<\/td>\n<\/tr>\n<tr>\n<td>FA-06: «Katherine» (cajera) intenta crear la cajera «Daniela»<\/td>\n<td>Operación rechazada por falta de permiso<\/td>\n<\/tr>\n<tr>\n<td>FA-06: «Katherine» intenta desbloquear el PIN de «Yendry»<\/td>\n<td>Operación rechazada por falta de permiso y el PIN sigue bloqueado<\/td>\n<\/tr>\n<tr>\n<td>FA-06: llamar a la API de administración sin sesión<\/td>\n<td>Respuesta de autenticación requerida<\/td>\n<\/tr>\n<tr>\n<td>Límite: la dueña busca desbloquear o reasignar su propio PIN desde la administración<\/td>\n<td>La aplicación no lo ofrece; se resuelve fuera del sistema con soporte técnico<\/td>\n<\/tr>\n<tr>\n<td>Cualquier acción de la dueña<\/td>\n<td>La bitácora registra la acción, a «Doña Marta», la cajera afectada, fecha y hora<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Guiones de prueba (Gherkin):<\/strong> <span class=\"ref\">h1<\/span>, <span class=\"ref\">h2<\/span>, <span class=\"ref\">h3<\/span>, <span class=\"ref\">h4<\/span>, <span class=\"ref\">h5<\/span>, <span class=\"ref\">h6<\/span>. Backlog: <a href=\"#\" data-go=\"cu5\">CU-05-backlog.md<\/a>.<\/p>"}, {"id": "rf6", "tipo": "rf", "codigo": "RF-06", "titulo": "Cerrar el día", "corto": "Cerrar el día", "abstract": "El sistema debe permitir que la dueña cierre el día con una marca simple. Desde ese momento las ventas del día ya no se pueden anular, y las solicitudes pendientes de anulación caducan y las ventas a fiado «en espera de autorización» caducan y se descartan sin cobrarse: la dueña ya no puede autorizarlas.", "chips": ["Actores: dueña (cierra el día)"], "rnfs": ["rnf2", "rnf3"], "rfs": [], "realiza": null, "realizaEn": [], "html": "<h2>Descripción<\/h2>\n<p>El sistema debe permitir que la dueña cierre el día con una marca simple. Desde ese momento las ventas del día ya no se pueden anular, y las solicitudes pendientes de anulación caducan y las ventas a fiado «en espera de autorización» caducan y se descartan sin cobrarse: la dueña ya no puede autorizarlas. El cierre del día y sus caducidades quedan en la bitácora.<\/p>\n<p><strong>Actores:<\/strong> dueña (cierra el día).<\/p>\n<h2>Necesidad<\/h2>\n<p>Corresponde al problema 1 de <span class=\"ref\">problema.md<\/span>: sin un límite de tiempo, una venta cobrada se podría anular días después, cuando ya nadie recuerda el hecho, y el abuso tardaría meses en notarse. El cierre del día fija ese límite y evita que queden solicitudes pendientes o ventas a fiado en espera de un día para otro. Además, <a href=\"#\" data-go=\"rf3\">RF-03<\/a> y <a href=\"#\" data-go=\"rf2\">RF-02<\/a> lo necesitan como evento definido y no como un supuesto externo.<\/p>\n<h2>Proceso Actual<\/h2>\n<p>Hoy el cierre del día es un cuadre manual: se cuenta el efectivo y se compara contra la registradora. No hay marca en ningún sistema que impida corregir una venta después, y nada deja registro de quién cerró ni cuándo.<\/p>\n<h2>Solución Propuesta<\/h2>\n<p>La dueña, desde su sesión administrativa, elige «Cerrar el día» cuando ya no queda ninguna caja abierta. El sistema muestra cuántas solicitudes de anulación y cuántas ventas a fiado en espera van a caducar, pide confirmar y marca el día como cerrado con fecha, hora y quién lo cerró. Las ventas del día dejan de ser anulables, las solicitudes de anulación pendientes caducan y las ventas a fiado en espera se descartan sin cobrarse. Todo queda en la bitácora. Una venta a fiado «en espera de autorización» no cuenta como venta abierta ni bloquea el cierre: solo los turnos abiertos lo bloquean.<\/p>\n<p><strong>Límites de esta versión<\/strong> <em>(supuesto)<\/em>: el cierre del día no se deshace desde la aplicación (no hay reapertura), no se abre otro turno ese día y un cierre equivocado se resuelve fuera del sistema. El cierre del día no es el cuadre de caja (conteo de efectivo), que sigue siendo un proceso manual fuera de esta versión.<\/p>\n<h2>Documentos de Referencia<\/h2>\n<ul>\n<li><span class=\"ref\">Caso Minisúper La Esquina, secciones 4.4 y 5.1<\/span><\/li>\n<li><span class=\"ref\">Descripción del problema<\/span><\/li>\n<\/ul>\n<h2>Casos de Uso Relacionados<\/h2>\n<ul>\n<li><a href=\"#\" data-go=\"cu6\">CU-06 Cerrar el día<\/a><\/li>\n<li><a href=\"#\" data-go=\"cu3\">CU-03 Anular venta<\/a> (depende del cierre del día)<\/li>\n<li><a href=\"#\" data-go=\"cu2\">CU-02 Vender a fiado<\/a> (sus ventas a fiado en espera caducan con el cierre)<\/li>\n<li><a href=\"#\" data-go=\"cu4\">CU-04 Identificar cajera en la caja (PIN)<\/a> (sesión administrativa de la dueña y cierre de turnos)<\/li>\n<\/ul>\n<h2>Criterios de Aceptación<\/h2>\n<ol>\n<li>Solo la dueña puede cerrar el día; una cajera que lo intente, incluso llamando a la API directamente, recibe acceso denegado.<\/li>\n<li>El día solo se cierra si no hay ningún turno abierto; si lo hay, el sistema no cierra el día e indica qué cajera tiene el turno abierto. Una venta a fiado en espera de autorización no bloquea el cierre.<\/li>\n<li>Un día ya cerrado no se vuelve a cerrar: el sistema informa cuándo y quién lo cerró y no cambia nada.<\/li>\n<li>La dueña debe confirmar el cierre; si cancela, no cambia nada.<\/li>\n<li>Al cerrar, el día queda marcado con fecha, hora y la dueña que lo cerró, y el cierre no se puede deshacer desde la aplicación: no hay reapertura y no se abre otro turno ese día; un cierre equivocado se resuelve fuera del sistema <em>(supuesto)<\/em>.<\/li>\n<li>Después del cierre, ninguna venta de ese día se puede anular, ni por solicitud de la cajera ni por anulación directa de la dueña (<a href=\"#\" data-go=\"rf3\">RF-03<\/a>).<\/li>\n<li>Al cerrar, t
